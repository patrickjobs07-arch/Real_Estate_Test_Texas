      return `<li><button class="choice ${cls}" data-i="${i}" ${done ? "disabled" : ""} aria-label="${KEYS[i]}. ${esc(p.f(o.v))}${done ? (o.ok ? ". Correct answer" : i === DR.ans ? ". Your answer, incorrect" : "") : ""}"><span class="key">${KEYS[i]}</span><span class="ctext num">${esc(p.f(o.v))}</span>${verdict ? `<span class="verdict">${verdict}</span>` : ""}</button></li>`; }).join("")}</ul>
    ${done ? `<section class="feedback ${picked.ok ? "fb-good" : "fb-bad"}" aria-live="polite">
      <div class="fb-head">${picked.ok ? I.check : I.x}<span>${picked.ok ? pk(["Correct!", "Nice work!", "Exactly right!"]) : "Not quite. Here's the working"}</span>${picked.ok && DR.streak >= 3 ? `<span class="combo">${IC.flame}${DR.streak} in a row</span>` : ""}</div>
      ${!picked.ok && picked.why ? `<p><b>${esc(p.f(picked.v))}</b>: ${esc(picked.why)}</p>` : ""}
      <p>${esc(p.w)}</p>
      ${calcHTML({ f:p.steps })}
      <div class="row" style="flex-wrap:wrap;gap:10px">${srcChip(p.src)}<a class="small" style="font-weight:600" href="#topic-math">Review the math lesson</a></div>
    </section>
    <div class="stickynext"><button class="btn btn-primary btn-block" id="dNext">Next problem</button></div>`
    : `<p class="small muted">Choose an answer. Numbers are generated for practice; the formulas follow the course book.</p>`}
  </div>`;
  view.querySelectorAll(".choice:not([disabled])").forEach(b => b.onclick = () => drillAnswer(+b.dataset.i));
  view.querySelectorAll("[data-dcat]").forEach(b => b.onclick = () => {
    const k = b.dataset.dcat;
    if (DR.cats.has(k) && DR.cats.size === 1) return announce("Keep at least one type selected");
    DR.cats.has(k) ? DR.cats.delete(k) : DR.cats.add(k);
    if (!done && !DR.cats.has(p.cat)) DR.cur = null;
    renderDrill(); const nb = view.querySelector(`[data-dcat="${k}"]`); if (nb) nb.focus();
  });
  $("#dQuit").onclick = finishDrills;
  if (done){ $("#dNext").onclick = nextDrill; emphasize(view.querySelectorAll(".feedback > p")); }
}
function drillAnswer(i){
  if (DR.ans !== null) return;
  const ok = !!DR.cur.opts[i].ok;
  DR.ans = i; DR.n++; if (ok){ DR.right++; DR.streak++; } else DR.streak = 0;
  S.drill = S.drill || { seen:0, correct:0 }; S.drill.seen++; if (ok) S.drill.correct++;
  const dkk = todayKey(); S.days[dkk] = (S.days[dkk] || 0) + 1; save();
  tone(ok ? "good" : "bad"); renderDrill();
  if (ok) confetti($(".fb-head"));
  announce(ok ? "Correct." : "Incorrect. The correct answer is " + DR.cur.f(DR.cur.a));
  const fb = $(".feedback"); if (fb && fb.getBoundingClientRect().top > innerHeight * 0.6) fb.scrollIntoView({ behavior: document.documentElement.classList.contains("reduce") ? "auto" : "smooth", block:"start" });
}
function nextDrill(){ DR.cur = null; renderDrill(); window.scrollTo(0, 0); const c = $(".choice"); if (c) c.focus(); }
document.addEventListener("keydown", e => {
  if (route().name !== "drill" || e.metaKey || e.ctrlKey || e.altKey || !DR.cur) return;
  const tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea") return;
  const key = e.key.toUpperCase(); let pos = KEYS.indexOf(key); if (pos === -1 && /^[1-4]$/.test(key)) pos = +key - 1;
  if (DR.ans === null && pos > -1 && pos < DR.cur.opts.length){ e.preventDefault(); drillAnswer(pos); }
  else if (DR.ans !== null && e.key === "Enter" && e.target.tagName !== "BUTTON" && e.target.tagName !== "A"){ e.preventDefault(); nextDrill(); }
});

/* =====================================================================
   4. CONFIDENCE CHECK
   After a correct answer she can say "I guessed". A guessed answer
   doesn't count as mastered and comes back tomorrow in Review.
   ===================================================================== */
function isMastered(st){ return !!(st && st.last && !st.guess); }
function sureHTML(q){
  const st = S.stats[q.id] || {}, g = !!st.guess;
  return `<div class="sure" role="group" aria-labelledby="sureL">
    <span class="sure-l" id="sureL">How sure were you?</span>
    <div class="seg sure-seg"><button type="button" data-sure="1" aria-pressed="${!g}">I knew it</button><button type="button" data-sure="0" aria-pressed="${g}">I guessed</button></div>
    ${g ? `<p class="small sure-note">${IC.refresh}<span>Good call. It won't count as mastered yet and will come back in Review tomorrow.</span></p>` : ""}
  </div>`;
}
function setSure(q, knew){
  const ss = S.session, st = S.stats[q.id]; if (!st) return;
  ss.srsPrev = ss.srsPrev || {};
  if (!knew && !st.guess){
    ss.srsPrev[q.id] = S.srs && S.srs[q.id] ? Object.assign({}, S.srs[q.id]) : null;
    st.guess = true; S.srs = S.srs || {}; S.srs[q.id] = { box:0, due:dnum() + SRS_GAP[0] };
  } else if (knew && st.guess){
    st.guess = false;
    if (q.id in ss.srsPrev){ const p = ss.srsPrev[q.id]; if (p) S.srs[q.id] = p; else delete S.srs[q.id]; }
  }
  save(); renderQuiz();
  const b = view.querySelector(`[data-sure="${knew ? 1 : 0}"]`); if (b) b.focus();
  announce(knew ? "Marked as known." : "Marked as a guess. It will come back tomorrow.");
}

/* =====================================================================
   5. GLOSSARY FLASHCARDS
   Same step system as Review: "Got it" moves a card along
   (back in 1, 3, then 7 days); "Again" sends it back to the start
   and shows it once more before the set ends.
   ===================================================================== */
const CARD_GAP = [1, 3, 7];
const FC = { deck:"all", q:[], i:0, flipped:false, got:0, again:0, done:false, re:new Set() };
function cardPool(deck){ return GLOSSARY.filter(g => deck === "all" || (TOPIC[g.t] && TOPIC[g.t].group === deck)); }
function cardCounts(deck){
  const t = dnum(), C = S.cards || {}, pool = cardPool(deck);
  return { due:pool.filter(g => C[g.id] && C[g.id].due <= t).length, fresh:pool.filter(g => !C[g.id]).length, learned:pool.filter(g => C[g.id] && C[g.id].box >= CARD_GAP.length).length, total:pool.length };
}
function buildDeck(deck){
  const t = dnum(), C = S.cards || {}, pool = cardPool(deck);
  const due = shuffle(pool.filter(g => C[g.id] && C[g.id].due <= t && C[g.id].box < CARD_GAP.length));
  const fresh = shuffle(pool.filter(g => !C[g.id]));
  let q = due.concat(fresh).slice(0, 15);
  if (!q.length) q = shuffle(pool.slice()).slice(0, 15);
  return q.map(g => g.id);
}
function startCards(deck){ Object.assign(FC, { deck:deck || FC.deck, i:0, flipped:false, got:0, again:0, done:false, re:new Set() }); FC.q = buildDeck(FC.deck); go("cards"); }
function rateCard(ok){
  const id = FC.q[FC.i], t = dnum(); S.cards = S.cards || {};
  const c = S.cards[id] || { box:-1 };
  if (ok){ const box = Math.min(c.box + 1, CARD_GAP.length); S.cards[id] = { box, due: box >= CARD_GAP.length ? t + 30 : t + CARD_GAP[box] }; FC.got++; }
  else { S.cards[id] = { box:-1, due:t }; FC.again++; if (!FC.re.has(id)){ FC.re.add(id); FC.q.push(id); } }
  save(); FC.i++; FC.flipped = false;
  if (FC.i >= FC.q.length){ FC.done = true; tone("done"); }
  renderCards(); const f = $("#fcMain"); if (f) f.focus();
}
function renderCards(){
  if (!FC.q.length && !FC.done) FC.q = buildDeck(FC.deck);
  const decks = [["all", "All terms"], ["gen", "General"], ["tx", "Texas"]];
  const cc = cardCounts(FC.deck);
  const head = `<div class="qtop">
      <a class="iconbtn" href="#glossary" aria-label="Back to key terms" title="Key terms">${I.x}</a>
      <div class="grow drill-tally"><b>Flashcards</b><span class="small muted num">${FC.done ? "Set complete" : `Card ${Math.min(FC.i + 1, FC.q.length)} of ${FC.q.length}`}</span></div>
      ${muteBtnHTML()}
    </div>
    <div class="bar" aria-hidden="true"><span style="width:${FC.q.length ? Math.round(FC.i / FC.q.length * 100) : 0}%"></span></div>`;
  if (FC.done){
    view.innerHTML = `<div class="stack-lg fc">
      ${head}
      <section class="card stack fc-end" style="gap:14px;text-align:center;align-items:center">
        ${iconTile("sparkles", 3, "lg")}
        <h1>Set complete</h1>
        <p class="muted"><b class="num">${FC.got}</b> got it · <b class="num">${FC.again}</b> again</p>
        <p class="small muted">${cc.due ? `${cc.due} more card${cc.due > 1 ? "s" : ""} due today.` : cc.fresh ? `${cc.fresh} terms you haven't seen yet.` : "Cards you knew will come back in a few days to keep them fresh."}</p>
        <div class="stack" style="gap:8px;width:100%"><button class="btn btn-primary btn-block" id="fcAgain">Another set</button><a class="btn btn-quiet btn-block" href="#glossary">Back to key terms</a></div>
      </section>
    </div>`;
    $("#fcAgain").onclick = () => startCards(FC.deck); $("#fcAgain").focus();
    return;
  }
  const g = GBY[FC.q[FC.i]], tp = TOPIC[g.t];
  view.innerHTML = `<div class="stack-lg fc">
    ${head}
    <div class="dchips" role="group" aria-label="Which terms">${decks.map(([k, l]) => `<button type="button" class="dchip" data-deck="${k}" aria-pressed="${FC.deck === k}">${l}</button>`).join("")}</div>
    <p class="small muted num">${cc.due} due · ${cc.fresh} new · ${cc.learned} learned of ${cc.total}</p>
    <button type="button" class="card fc-card ${FC.flipped ? "is-back" : ""}" id="fcMain" style="${tc(g.t)}" aria-label="${FC.flipped ? esc(g.term + ". " + g.def) : esc(g.term) + ". Show the definition"}">
      <span class="fc-topic">${ticon(g.t, "sm")}<span>${esc(tp ? tp.title : "")}</span></span>
      <span class="fc-term">${esc(g.term)}</span>
      ${FC.flipped ? `<span class="fc-def">${esc(g.def)}</span>` : `<span class="fc-hint">Say the definition to yourself, then tap to check.</span>`}
    </button>
    ${FC.flipped ? `<div class="row" style="flex-wrap:wrap;gap:10px">${srcChip(g.s)}<a class="small" style="font-weight:600" href="#topic-${g.t}">Open the lesson</a></div>
    <div class="fc-rate"><button class="btn btn-quiet" id="fcNo">${IC.refresh}<span>Again</span></button><button class="btn btn-primary" id="fcYes">${I.check}<span>Got it</span></button></div>`
    : `<button class="btn btn-primary btn-block" id="fcFlip">Show definition</button>`}
    <p class="small muted fc-keys">Keyboard: Space to flip, 1 for Again, 2 for Got it.</p>
  </div>`;
  const flip = () => { if (FC.flipped) return; FC.flipped = true; renderCards(); const y = $("#fcYes"); if (y) y.focus(); };
  $("#fcMain").onclick = flip; if ($("#fcFlip")) $("#fcFlip").onclick = flip;
  if ($("#fcYes")){ $("#fcYes").onclick = () => rateCard(true); $("#fcNo").onclick = () => rateCard(false); }
  view.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => { if (FC.deck === b.dataset.deck) return; startCards(b.dataset.deck); const nb = view.querySelector(`[data-deck="${b.dataset.deck}"]`); if (nb) nb.focus(); });
}
document.addEventListener("keydown", e => {
  if (route().name !== "cards" || e.metaKey || e.ctrlKey || e.altKey || FC.done) return;
  const tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea") return;
  if (!FC.flipped && (e.key === " " || e.key === "Enter") && (!e.target.closest || !e.target.closest("button:not(#fcMain):not(#fcFlip), a"))){ e.preventDefault(); FC.flipped = true; renderCards(); const y = $("#fcYes"); if (y) y.focus(); }
  else if (FC.flipped && (e.key === "1" || e.key === "2")){ e.preventDefault(); rateCard(e.key === "2"); }
});

/* =====================================================================
   6. STUDY PLAN
   She picks her exam date and study days. The plan is rebuilt from her
   real progress every time, so it never says "behind": it just shows
   today's focus. The last stretch is kept for review and practice exams.
   ===================================================================== */
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const dFromNum = n => { const d = new Date(n * 864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const isoToNum = iso => { const [y, m, d] = iso.split("-").map(Number); return dnum(new Date(y, m - 1, d, 12)); };
const numToIso = n => { const d = dFromNum(n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function planUnits(){
  const out = [];
  TOPICS.forEach(t => {
    const unread = t.lessons.map((l, i) => i).filter(i => !S.read[t.id + ":" + i]);
    for (let k = 0; k < unread.length; k += 2) out.push({ kind:"read", t:t.id, ls:unread.slice(k, k + 2) });
    const qs = topicQs(t.id), m = qs.filter(q => isMastered(S.stats[q.id])).length;
    if (qs.length && m / qs.length < 0.8) out.push({ kind:"practice", t:t.id });
  });
  return out;
}
function buildPlan(){
  const P = S.plan; if (!P || !P.exam) return null;
  const today = dnum(), exam = isoToNum(P.exam);
  if (exam <= today) return { past:true, exam };
  const days = []; for (let n = today; n < exam; n++) if (P.days.includes(dFromNum(n).getDay())) days.push(n);
  if (!days.length) return { exam, days:[], sched:[], none:true };
  const units = planUnits();
  const reviewN = days.length >= 4 ? Math.max(1, Math.round(days.length * 0.2)) : 0;
  const learnDays = days.slice(0, days.length - reviewN), revDays = days.slice(days.length - reviewN);
  const CAP = 4, slots = Math.max(learnDays.length, 1) * CAP;
  let use = units, trimmed = false;
  if (units.length > slots){ trimmed = true; const pr = units.filter(u => u.kind === "practice").slice(0, slots), rd = units.filter(u => u.kind === "read").slice(0, slots - pr.length); const keep = new Set(pr.concat(rd)); use = units.filter(u => keep.has(u)); }
  const per = learnDays.length ? Math.ceil(use.length / learnDays.length) : use.length;
  const sched = [];
  learnDays.forEach((n, i) => sched.push({ n, tasks:mergeReads(use.slice(i * per, (i + 1) * per)) }));
  revDays.forEach((n, i) => sched.push({ n, tasks:[{ kind: i === revDays.length - 1 && i > 0 ? "light" : i % 2 ? "mixed" : "exam" }] }));

  sched.forEach(d => { if (!d.tasks.length) d.tasks = [{ kind:"mixed" }]; });
  return { exam, days, sched, per, unitsLeft:units.length, trimmed, today };
}
function mergeReads(list){
  const out = [];
  list.forEach(u => { const prev = out[out.length - 1]; if (u.kind === "read" && prev && prev.kind === "read" && prev.t === u.t) prev.ls = prev.ls.concat(u.ls); else out.push(Object.assign({}, u, u.ls ? { ls:u.ls.slice() } : {})); });
  return out;
}
function taskText(k){
  if (k.kind === "read"){ const t = TOPIC[k.t]; return { title:t.title, sub: k.ls.length > 1 ? `Read lessons ${k.ls[0] + 1}–${k.ls[k.ls.length - 1] + 1}` : `Read lesson ${k.ls[0] + 1}` }; }
  if (k.kind === "practice") return { title:TOPIC[k.t].title, sub:"Practice the topic's questions" };
  if (k.kind === "exam") return { title:"Practice exam", sub:"Full or short: your choice" };
  if (k.kind === "light") return { title:"Light review", sub:"Due reviews and flashcards. Rest well." };
  return { title:"Mixed round", sub:"Plus anything due in Review" };
}
function taskIcon(k){ return k.t ? ticon(k.t, "sm") : iconTile(k.kind === "exam" ? "target" : k.kind === "light" ? "books" : "shuffle", k.kind === "exam" ? 2 : 4, "sm"); }
function doTask(k){
  if (k.kind === "read"){ S.openLesson = { t:k.t, i:k.ls[0] }; save(); go("topic-" + k.t); }
  else if (k.kind === "practice") startRound(topicQs(k.t).map(q => q.id), k.t, S.prefs.timed);
  else if (k.kind === "exam") go("exam");
  else if (k.kind === "light"){ if (srsDue().length) startSrs(); else startCards(); }
  else { if (srsDue().length) startSrs(); else startMixed(); }
}
function planToday(){
  const p = buildPlan(); if (!p || p.past || p.none) return null;
  const d = p.sched.find(x => x.n >= p.today); if (!d) return null;
  return { rest: d.n !== p.today, day:d, plan:p };
}
function planTileHTML(){
  const pt = planToday();
  if (!S.plan || !S.plan.exam) return `<a class="tile t-week" href="#plan"><span class="tile-head">${iconTile("calendar", 1, "sm")}</span><b class="tile-title">Study plan</b><span class="tile-text small">Add your exam date for a daily focus</span></a>`;
  if (!pt) return `<a class="tile t-week" href="#plan"><span class="tile-head">${iconTile("calendar", 1, "sm")}</span><b class="tile-title">Study plan</b><span class="tile-text small">${S.plan && buildPlan() && buildPlan().past ? "Exam date passed. Update it?" : "Open your plan"}</span></a>`;
  const k = pt.day.tasks[0], tt = taskText(k);
  return `<a class="tile t-week" href="#plan"><span class="tile-head">${iconTile("calendar", 1, "sm")}</span><span class="small muted" style="font-weight:600">${pt.rest ? `Rest day · next ${WD[dFromNum(pt.day.n).getDay()]}` : "Today's focus"}</span><b class="tile-title">${esc(tt.title)}</b><span class="tile-text small">${esc(tt.sub)}${pt.day.tasks.length > 1 ? ` +${pt.day.tasks.length - 1} more` : ""}</span></a>`;
}
function renderPlan(){
  const P = S.plan || { exam:"", days:[1, 2, 3, 4, 5] }, p = buildPlan(), today = dnum();
  const minIso = numToIso(today + 1);
  const dayRow = d => {
    const dt = dFromNum(d.n), isT = d.n === today;
    return `<li class="pday ${isT ? "today" : ""}"><div class="pdate"><b>${isT ? "Today" : dt.toLocaleDateString(undefined, { weekday:"short" })}</b><span class="num">${dt.toLocaleDateString(undefined, { month:"short", day:"numeric" })}</span></div>
      <div class="ptasks">${d.tasks.map((k, j) => { const tt = taskText(k); return `<button type="button" class="ptask" data-pt="${d.n}:${j}">${taskIcon(k)}<span class="grow"><b>${esc(tt.title)}</b><small>${esc(tt.sub)}</small></span>${IC.arrow}</button>`; }).join("")}</div></li>`;
  };
  let body = "";
  if (p && p.past) body = `<p class="small muted">That exam date has passed. Pick a new one to rebuild the plan.</p>`;
  else if (p && p.none) body = `<p class="small muted">No study days before the exam with the days you picked. Add a day or two.</p>`;
  else if (p){
    const first = p.sched.slice(0, 7), rest = p.sched.slice(7);
    body = `<p class="small muted">${p.days.length} study day${p.days.length > 1 ? "s" : ""} before your exam${p.unitsLeft ? `, about ${p.per} short task${p.per > 1 ? "s" : ""} a day` : ""}. The plan updates itself from what you've done, so there's no catching up to do. Do what you can.</p>
      ${p.trimmed ? `<p class="small plan-note">There's more material than days, so the plan puts topic practice first and keeps each day to a few tasks. Mixed rounds and the practice exam cover the rest quickly.</p>` : ""}
      <ol class="plist">${first.map(dayRow).join("")}</ol>
      ${rest.length ? `<details class="navpanel"><summary>Show the rest of the plan (${rest.length} day${rest.length > 1 ? "s" : ""})</summary><ol class="plist">${rest.map(dayRow).join("")}</ol></details>` : ""}`;
  }
  view.innerHTML = `<div class="stack-lg">
    <header class="stack" style="gap:8px"><a href="#home" class="small" style="font-weight:600">← Home</a>
      <div class="topichead">${iconTile("calendar", 1, "lg")}<div><h1>Study plan</h1><p class="muted">A gentle daily focus that fits the time you have.</p></div></div></header>
    <section class="card stack" style="gap:16px" aria-label="Plan settings">
      <div class="stack" style="gap:6px"><label for="pExam"><b>Exam date</b></label><input class="field" type="date" id="pExam" min="${minIso}" value="${esc(P.exam || "")}"></div>
      <div class="stack" style="gap:8px"><span id="pDaysL"><b>Study days</b></span><div class="week-days pdays" role="group" aria-labelledby="pDaysL">${WD.map((w, i) => `<button type="button" class="wday" data-pd="${i}" aria-pressed="${P.days.includes(i)}" aria-label="${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][i]}"><span class="wd-num" style="font-size:.86rem">${w}</span></button>`).join("")}</div></div>
      ${S.plan && S.plan.exam ? `<button class="linkbtn" id="pClear" type="button" style="align-self:flex-start">Remove the plan</button>` : ""}
    </section>
    ${S.plan && S.plan.exam ? `<section class="stack" aria-labelledby="pT"><h2 id="pT">Your days</h2>${body}</section>` : `<p class="small muted">Pick your exam date and the days you can study. You'll get one small focus per study day, with the last stretch saved for review and practice exams.</p>`}
  </div>`;
  const upd = () => { const ex = $("#pExam").value, days = [...view.querySelectorAll("[data-pd][aria-pressed=true]")].map(b => +b.dataset.pd); if (ex && isoToNum(ex) <= today) return; S.plan = { exam:ex, days:days.length ? days : [1, 2, 3, 4, 5] }; if (!ex) S.plan.exam = ""; save(); };
  $("#pExam").onchange = () => { upd(); renderPlan(); const i = $("#pExam"); if (i) i.focus(); };
  view.querySelectorAll("[data-pd]").forEach(b => b.onclick = () => {
    const on = b.getAttribute("aria-pressed") === "true";
    if (on && view.querySelectorAll("[data-pd][aria-pressed=true]").length === 1) return announce("Keep at least one study day");
    b.setAttribute("aria-pressed", String(!on)); upd(); renderPlan(); const nb = view.querySelector(`[data-pd="${b.dataset.pd}"]`); if (nb) nb.focus();
  });
  const c = $("#pClear"); if (c) c.onclick = () => { S.plan = null; save(); renderPlan(); toast("Plan removed"); };
  view.querySelectorAll("[data-pt]").forEach(b => b.onclick = () => { const [n, j] = b.dataset.pt.split(":").map(Number); const d = p.sched.find(x => x.n === n); if (d && d.tasks[j]) doTask(d.tasks[j]); });
}

/* =====================================================================
   8. LISTEN MODE
   Reads a lesson aloud with the device's built-in voice. One paragraph
   at a time (more reliable on phones), the paragraph being read is
   highlighted, and a small player sits above the menu.
   ===================================================================== */
const TTS = { on:false, paused:false, kind:"lesson", t:null, i:0, code:null, page:0, gen:0, loading:false, parts:[], k:0, voice:null };
const ttsOK = () => "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function pickVoice(){
  if (!ttsOK()) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));

/* --- reading the course books aloud --- */
async function bookPageParts(code, n){
  const doc = await getDoc(code), pg = await doc.getPage(n), tc = await pg.getTextContent();
  const W = pg.view[2] - pg.view[0], lines = []; let cur = "";
  tc.items.forEach(it => {
    const s = it.str || "", x = it.transform ? it.transform[4] : 0;
    if (!(x > W * 0.8 && s.trim().length < 30)) cur += (cur && s && !/\s$/.test(cur) && !/^\s/.test(s) && !/-$/.test(cur) ? " " : "") + s;
    if (it.hasEOL){ lines.push(cur); cur = ""; }
  });
  if (cur) lines.push(cur);
  const keep = lines.map(x => x.replace(/\s+/g, " ").trim()).filter(x => x && !/^\d{1,3}$/.test(x) && !/copyright\s*©|champions school of real estate/i.test(x) && !/^page \d+$/i.test(x));
  let text = ""; keep.forEach(x => { text = text ? (/-$/.test(text) ? text.slice(0, -1) + x : text + " " + x) : x; });
  text = speakable(text.replace(/&/g, "&amp;").replace(/</g, "&lt;"));
  if (!text) return [{ p:0, txt:`Page ${n} has no text to read.` }];
  return splitLong(text).map((txt, j) => ({ p:j, txt }));
}
async function ttsBookStart(code, page){
  if (!ttsOK()) return;
  speechSynthesis.cancel();
  const gen = TTS.gen + 1;
  Object.assign(TTS, { on:true, paused:false, kind:"book", loading:true, gen, code, page, t:null, parts:[], k:0 });
  ttsBar(); ttsMark();
  let parts;
  try { parts = await bookPageParts(code, page); } catch(e){ if (TTS.gen === gen){ ttsEnd(false); toast("This page couldn't be read aloud"); } return; }
  if (TTS.gen !== gen) return;
  TTS.parts = parts; TTS.loading = false; ttsBar(); ttsSpeak();
}
async function ttsBookNext(){
  const code = TTS.code, next = TTS.page + 1, gen = TTS.gen;
  let N = 0; try { N = (await getDoc(code)).numPages; } catch(e) {}
  if (!TTS.on || TTS.code !== code || TTS.gen !== gen) return;
  if (next > N){ ttsEnd(true); return; }
  if (READER_HOOK && READER_HOOK.code === code && route().name === "read") READER_HOOK.go(next);   // turns the page; the reader restarts reading there
  else ttsBookStart(code, next);
}

        <span class="grow"><b>${esc(src.name)}</b><small>${m ? `Added · ${mb(m.size)}${pos ? ` · last read p. ${pos}` : ""}` : "Not added yet"}</small></span>
        ${m ? `<button class="btn btn-primary btn-sm" data-bopen="${c}">${pos ? "Resume" : "Open"}</button><button class="iconbtn bk-x" data-bdel="${c}" aria-label="Remove ${esc(src.name)} from this device" title="Remove">${I.x}</button>`
            : `<button class="btn btn-quiet btn-sm" data-badd="${c}">Add</button>`}</li>`; }).join("")}</ul>
    <p class="small muted">The books belong to your course provider. Keep them for your own study.</p>`}
  </div>`;
  if (!ok) return;
  const pick = $("#bkPick"), one = $("#bkOne"); let oneCode = null;
  $("#bkAdd").onclick = () => pick.click();
  pick.onchange = async () => { const files = [...pick.files]; pick.value = ""; await addFiles(files); };
  view.querySelectorAll("[data-badd]").forEach(b => b.onclick = () => { oneCode = b.dataset.badd; one.click(); });
  one.onchange = async () => { const f = one.files[0]; one.value = ""; if (f && oneCode) await addFiles([f], oneCode); };
  view.querySelectorAll("[data-bopen]").forEach(b => b.onclick = () => openRead(b.dataset.bopen, (S.bookPos || {})[b.dataset.bopen] || 1));
  view.querySelectorAll("[data-bdel]").forEach(b => b.onclick = () => {
    const c = b.dataset.bdel, li = b.closest("li");
    li.insertAdjacentHTML("afterend", `<li class="bk-confirm-row"><span class="small">Remove <b>${esc(SOURCES[c].name)}</b> from this device? You can add it again any time.</span><span class="row" style="gap:8px"><button class="btn btn-primary btn-sm" data-yes>Remove</button><button class="btn btn-quiet btn-sm" data-no>Cancel</button></span></li>`);
    const row = li.nextElementSibling; row.querySelector("[data-yes]").focus();
    row.querySelector("[data-no]").onclick = () => row.remove();
    row.querySelector("[data-yes]").onclick = async () => { await bookDel(c); delete PDFDOCS[c]; toast("Book removed"); renderBooks(); };
  });
  if (BOOK_PENDING.length) showPending();
}
async function addFiles(files, forced){
  const msg = $("#bkMsg"); let added = [], bad = [];
  for (const f of files){
    if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf"){ bad.push(f.name); continue; }
    const code = forced || guessBook(f.name);
    if (!code){ BOOK_PENDING.push(f); continue; }
    if (msg) msg.innerHTML = `<p class="small">Saving ${esc(f.name)}…</p>`;
    try { await saveBookFile(code, f); added.push(SOURCES[code].name); }
    catch(e){ bad.push(f.name + (e && e.name === "QuotaExceededError" ? " (not enough space)" : "")); }
  }
  await renderBooks();
  const m2 = $("#bkMsg");
  if (m2) m2.innerHTML = (added.length ? `<p class="small bk-ok">${I.check}<span>Added ${added.map(esc).join(", ")}.</span></p>` : "") + (bad.length ? `<p class="small sync-err">Couldn't add ${bad.map(esc).join(", ")}. Make sure it's the PDF file.</p>` : "");
  if (added.length) toast(added.length > 1 ? `${added.length} books added` : "Book added");
}
function showPending(){
  const msg = $("#bkPend"); if (!msg || !BOOK_PENDING.length) return;
  const f = BOOK_PENDING[0];
  msg.innerHTML = `<div class="bk-confirm"><p class="small">Which book is <b>${esc(f.name)}</b>?</p>
    <div class="row" style="flex-wrap:wrap;gap:8px"><label class="sr-only" for="bkWhich">Book</label><select class="field" id="bkWhich">${Object.entries(SOURCES).map(([c, s]) => `<option value="${c}">${esc(s.name)}</option>`).join("")}</select>
    <button class="btn btn-primary btn-sm" id="bkWhichOk">Save</button><button class="btn btn-quiet btn-sm" id="bkWhichSkip">Skip</button></div></div>`;
  $("#bkWhich").focus();
  $("#bkWhichOk").onclick = async () => { const c = $("#bkWhich").value; BOOK_PENDING.shift(); await addFiles([f], c); };
  $("#bkWhichSkip").onclick = () => { BOOK_PENDING.shift(); msg.innerHTML = ""; showPending(); };
}

/* --- reader --- */
const PDFDOCS = {};
let PDFLIB = null, READ_ZOOM = 1, READ_TASK = 0;
function loadPdfLib(){
  if (PDFLIB) return PDFLIB;
  PDFLIB = new Promise((ok, no) => {
    if (window.pdfjsLib) return ok(window.pdfjsLib);
    const s = document.createElement("script"); s.src = PDFJS_URL; s.async = true;
    s.onload = () => { if (!window.pdfjsLib) return no(new Error("pdfjs")); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; ok(window.pdfjsLib); };
    s.onerror = () => { PDFLIB = null; no(new Error("pdfjs-load")); };
    document.head.appendChild(s);
  });
  return PDFLIB;
}
async function getDoc(code){
  if (PDFDOCS[code]) return PDFDOCS[code];
  const rec = await bookGet(code); if (!rec) return null;
  const lib = await loadPdfLib();
  PDFDOCS[code] = lib.getDocument({ data:new Uint8Array(rec.data.slice(0)), isEvalSupported:false }).promise;
  try { return await PDFDOCS[code]; } catch(e){ delete PDFDOCS[code]; throw e; }
}
function readRoute(h){ const m = h.match(/^read-(POR1|POR2|AG|CON|PCF|FIN)-(\d+)$/); return m ? { name:"read", code:m[1], page:+m[2] } : null; }
async function renderRead(r){
  const code = r.code, src = SOURCES[code], task = ++READ_TASK;
  const back = READ_FROM && !READ_FROM.startsWith("read-") ? READ_FROM : "books";
  view.innerHTML = `<div class="stack reader" style="gap:12px">
    <div class="qtop">
      <button class="iconbtn" id="rdBack" aria-label="Close the book" title="Close">${I.x}</button>
      <div class="grow drill-tally"><b class="rd-title">${esc(src.name)}</b><span class="small muted num" id="rdInfo">Page ${r.page}</span></div>
      <button class="iconbtn" id="rdListen" aria-label="Read this page aloud" aria-pressed="${TTS.on && TTS.kind === "book" && TTS.code === code}" title="Listen">${IC.volume}</button>
      <button class="iconbtn" id="rdOut" aria-label="Zoom out" title="Zoom out">${IC.minus || "−"}</button>
      <button class="iconbtn" id="rdIn" aria-label="Zoom in" title="Zoom in">${IC.plus || "+"}</button>
    </div>
    <div class="rd-stage" id="rdStage" aria-live="polite"><p class="small muted rd-wait">Opening page ${r.page}…</p></div>
    <div class="stickynext rd-nav"><button class="btn btn-quiet" id="rdPrev" aria-label="Previous page">${IC.arrow}</button>
      <label class="rd-go"><span class="sr-only">Go to page</span><input class="field num" id="rdPage" inputmode="numeric" pattern="[0-9]*" value="${r.page}" aria-label="Page number"><span class="small muted num" id="rdOf"></span></label>
      <button class="btn btn-quiet" id="rdNext" aria-label="Next page">${IC.arrow}</button></div>
  </div>`;
  $("#rdBack").onclick = () => go(back);
  let doc = null;
  try {
    const rec = await bookMetas(); if (task !== READ_TASK) return;
    if (!rec[code]){
      $("#rdStage").innerHTML = `<div class="card stack rd-empty" style="gap:12px;align-items:flex-start">${iconTile("books", 3, "sm")}<h2>${esc(src.name)} isn't on this device yet</h2><p class="small muted">Add the PDF once and every page reference will open right here, starting with page ${r.page}.</p><button class="btn btn-primary" id="rdAdd">Add this book</button><input type="file" id="rdFile" accept="application/pdf,.pdf" hidden><div id="bkMsg" aria-live="polite"></div></div>`;
      document.querySelector(".rd-nav").hidden = true; $("#rdOut").hidden = true; $("#rdIn").hidden = true; $("#rdListen").hidden = true;
      $("#rdAdd").onclick = () => $("#rdFile").click();
      $("#rdFile").onchange = async () => { const f = $("#rdFile").files[0]; if (!f) return; $("#rdAdd").disabled = true; $("#bkMsg").innerHTML = `<p class="small">Saving…</p>`; try { await saveBookFile(code, f); toast("Book added"); renderRead(r); } catch(e){ $("#rdAdd").disabled = false; $("#bkMsg").innerHTML = `<p class="small sync-err">That file didn't work. Make sure it's the PDF of ${esc(src.name)}.</p>`; } };
      return;
    }
    doc = await getDoc(code);
  } catch(e){
    if (task !== READ_TASK) return;
    $("#rdStage").innerHTML = `<p class="card small">${e && /pdfjs/.test(e.message) ? "The reader needs an internet connection the first time it opens. Check your connection and try again." : "This book couldn't be opened. Try removing it and adding the PDF again."}</p>`;
    return;
  }
  if (task !== READ_TASK || !doc) return;
  const N = doc.numPages; let page = Math.min(Math.max(1, r.page), N);
  $("#rdOf").textContent = "of " + N;
  const draw = async () => {
    const my = ++READ_TASK; const stage = $("#rdStage"); if (!stage) return;
    $("#rdPage").value = page; $("#rdInfo").textContent = `Page ${page} of ${N}`;
    $("#rdPrev").disabled = page <= 1; $("#rdNext").disabled = page >= N;
    S.bookPos = S.bookPos || {}; S.bookPos[code] = page; save(true);
    if (TTS.on && TTS.kind === "book" && TTS.code === code && TTS.page !== page) ttsBookStart(code, page);
    try { if (CUR !== `read-${code}-${page}`){ CUR = `read-${code}-${page}`; history.replaceState(null, "", "#" + CUR); } } catch(e) {}
    const pg = await doc.getPage(page); if (my !== READ_TASK) return;
    const base = pg.getViewport({ scale:1 }), w = Math.max(240, stage.clientWidth);
    const scale = w / base.width * READ_ZOOM, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vp = pg.getViewport({ scale:scale * dpr });
    const cv = document.createElement("canvas"); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.width = Math.floor(vp.width / dpr) + "px"; cv.style.height = Math.floor(vp.height / dpr) + "px";
    cv.setAttribute("role", "img"); cv.setAttribute("aria-label", `${src.name}, page ${page}`);
    await pg.render({ canvasContext:cv.getContext("2d"), viewport:vp }).promise; if (my !== READ_TASK) return;
    stage.innerHTML = ""; stage.appendChild(cv); stage.scrollLeft = 0;
  };
  const goPage = n => { page = Math.min(Math.max(1, n), N); draw(); window.scrollTo(0, 0); };
  READER_HOOK = { code, go: n => goPage(n) };
  $("#rdListen").onclick = () => { if (!ttsOK()){ toast("This browser can't read aloud. Open the app in Chrome or Safari to listen."); return; } if (TTS.on && TTS.kind === "book" && TTS.code === code) ttsEnd(false); else ttsBookStart(code, page); };
  $("#rdPrev").onclick = () => goPage(page - 1);
  $("#rdNext").onclick = () => goPage(page + 1);
  $("#rdPage").onchange = () => { const n = parseInt($("#rdPage").value, 10); if (n) goPage(n); else $("#rdPage").value = page; };
  $("#rdPage").onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); $("#rdPage").blur(); $("#rdPage").dispatchEvent(new Event("change")); } };
  $("#rdIn").onclick = () => { READ_ZOOM = Math.min(3, +(READ_ZOOM + 0.5).toFixed(1)); draw(); };
  $("#rdOut").onclick = () => { READ_ZOOM = Math.max(1, +(READ_ZOOM - 0.5).toFixed(1)); draw(); };
  let sx = null;
  $("#rdStage").addEventListener("touchstart", e => { sx = READ_ZOOM === 1 && e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive:true });
  $("#rdStage").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) goPage(page + (dx < 0 ? 1 : -1)); sx = null; }, { passive:true });
  READ_KEYS = e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") goPage(page + 1); else if (e.key === "ArrowLeft") goPage(page - 1); };
  draw();
}
let READ_KEYS = null, READER_HOOK = null;
document.addEventListener("keydown", e => { if (route().name === "read" && READ_KEYS && !e.metaKey && !e.ctrlKey && !e.altKey) READ_KEYS(e); });
let rdResize = 0;
window.addEventListener("resize", () => { if (route().name !== "read") return; clearTimeout(rdResize); rdResize = setTimeout(() => render(), 250); });

applyPrefs();
render();
})();
</script>
