<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurely's TREC Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#edf1f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one calm reading column (max 680px) — top bar with mute + settings, bottom tab bar on phones, tabs in the top bar on wide screens. */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --sunk:#eef2f5; --ink:#15233d; --muted:#56637a; --line:#dfe5ec;
  --teal:#0d7570; --teal-ink:#ffffff; --teal-soft:#e2f2f0; --warm:#b8661f; --warm-soft:#fbefe1;
  --good:#11744f; --good-soft:#e3f4ec; --bad:#a83e2b; --bad-soft:#fbe9e4; --focus:#2f6fd6;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius:16px; --base:17px; --dur:200ms;
  --h1:#0d9488; --h2:#4f46e5; --h3:#8b3fd9; --h4:#e2503a; --h5:#c97d00; --h6:#1784cc; --h7:#d6336c; --h8:#2f9e44;
  --hero-a:#1e1b6b; --hero-b:#4c2fd6; --hero-c:#0e8f88; --sun:#ffb020; --pop:#ff6b4a; --s-nat:#4f46e5; --s-st:#c97d00;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1626; --surface:#152038; --sunk:#111b2f; --ink:#e7ecf4; --muted:#9eabc0; --line:#263552;
  --teal:#4dbfb4; --teal-ink:#06201e; --teal-soft:#123634; --warm:#e8a462; --warm-soft:#36281a;
  --good:#58c99e; --good-soft:#123327; --bad:#f08e78; --bad-soft:#3a1f1a; --focus:#7aa7ff; color-scheme:dark;
  --h1:#2dd4bf; --h2:#9192ff; --h3:#c48dff; --h4:#ff8a70; --h5:#ffc247; --h6:#5cc0ff; --h7:#ff7aa8; --h8:#62d67e;
  --hero-a:#211d74; --hero-b:#5434e0; --hero-c:#0f8a84; --sun:#ffc247; --pop:#ff8a70; --s-nat:#7b7cf2; --s-st:#bb7d22 } }
:root[data-theme="dark"]{
  --bg:#0e1626; --surface:#152038; --sunk:#111b2f; --ink:#e7ecf4; --muted:#9eabc0; --line:#263552;
  --teal:#4dbfb4; --teal-ink:#06201e; --teal-soft:#123634; --warm:#e8a462; --warm-soft:#36281a;
  --good:#58c99e; --good-soft:#123327; --bad:#f08e78; --bad-soft:#3a1f1a; --focus:#7aa7ff; color-scheme:dark;
  --h1:#2dd4bf; --h2:#9192ff; --h3:#c48dff; --h4:#ff8a70; --h5:#ffc247; --h6:#5cc0ff; --h7:#ff7aa8; --h8:#62d67e;
  --hero-a:#211d74; --hero-b:#5434e0; --hero-c:#0f8a84; --sun:#ffc247; --pop:#ff8a70; --s-nat:#7b7cf2; --s-st:#bb7d22 }
:root.text-lg{ --base:19.5px }
:root.reduce *, :root.reduce *::before, :root.reduce *::after{ animation:none!important; transition:none!important }

*{ box-sizing:border-box }
html{ font-size:var(--base) }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:1rem; line-height:1.55;
  -webkit-font-smoothing:antialiased; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)) }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg) }
h1,h2,h3{ font-family:var(--font-display); font-weight:650; letter-spacing:-0.01em; text-wrap:balance; margin:0; line-height:1.2 }
h1{ font-size:1.75rem } h2{ font-size:1.3rem } h3{ font-size:1.08rem }
p{ margin:0 }
a{ color:var(--teal) }
button{ font:inherit; color:inherit }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:10px }
.wrap{ max-width:680px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }
.eyebrow{ font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.muted{ color:var(--muted) }
.small{ font-size:.86rem }
.num{ font-variant-numeric:tabular-nums }

/* top bar */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line) }
.topbar .wrap{ display:flex; align-items:center; gap:12px; padding-block:10px }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); margin-right:auto; min-width:0 }
.mark{ width:34px; height:34px; border-radius:10px; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-family:var(--font-display); font-weight:650; flex:none }
.brand b{ font-family:var(--font-display); font-weight:650; font-size:1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.iconbtn{ width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; flex:none }
.iconbtn svg{ width:20px; height:20px }
.toptabs{ display:none; gap:4px }
.toptabs a{ text-decoration:none; color:var(--muted); font-weight:600; padding:10px 14px; border-radius:10px }
.toptabs a[aria-current="page"]{ color:var(--ink); background:var(--sunk) }

/* bottom tabs */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px) }
.tabbar nav{ max-width:680px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr) }
.tabbar a{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 10px; text-decoration:none; color:var(--muted); font-size:.74rem; font-weight:600; min-height:60px }
.tabbar a svg{ width:22px; height:22px }
.tabbar a[aria-current="page"]{ color:var(--h2) }
.tabbar a svg{ padding:3px 12px; box-sizing:content-box; border-radius:99px; transition:background var(--dur) }
.tabbar a[aria-current="page"] svg{ background:color-mix(in srgb, var(--h2) 16%, var(--surface)) }
@media (min-width:860px){ .tabbar{ display:none } .toptabs{ display:flex } body{ padding-bottom:40px } }

main{ padding-block:24px 32px }
.stack{ display:flex; flex-direction:column; gap:16px }
.stack-lg{ display:flex; flex-direction:column; gap:28px }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px }
.row{ display:flex; align-items:center; gap:12px }
.row > .grow{ flex:1; min-width:0 }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:12px 20px; border-radius:12px; border:1px solid transparent; font-weight:650; cursor:pointer; text-decoration:none; font-size:1rem; transition:transform var(--dur), background var(--dur) }
.btn:active{ transform:scale(.985) }
.btn-primary{ background:var(--teal); color:var(--teal-ink) }
.btn-primary:hover{ filter:brightness(1.05) }
.btn-quiet{ background:var(--surface); border-color:var(--line); color:var(--ink) }
.btn-block{ width:100% }
.btn-sm{ min-height:44px; padding:8px 14px; font-size:.92rem; font-weight:600 }
.linkbtn{ background:none; border:0; padding:10px 4px; color:var(--teal); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; min-height:44px }

/* hero */
.hero{ position:relative; overflow:hidden; isolation:isolate; background:linear-gradient(135deg, var(--hero-a), var(--hero-b) 55%, var(--hero-c)); color:#fff; border-radius:24px; padding:24px 22px; display:flex; flex-direction:column; gap:14px }
.hero::before{ content:""; position:absolute; z-index:-1; width:240px; height:240px; right:-70px; top:-90px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--sun) 55%, transparent), transparent 70%) }
.hero::after{ content:""; position:absolute; z-index:-1; width:180px; height:180px; left:-60px; bottom:-90px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, #fff 18%, transparent), transparent 70%) }
.hero .heroicon{ position:absolute; right:18px; top:18px; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:rgb(255 255 255 / .16); color:#fff }
.hero .heroicon svg{ width:24px; height:24px }
.hero h1{ color:#fff; padding-right:56px }
.hero .sub{ color:rgb(255 255 255 / .85) }
.hero .eyebrow{ color:rgb(255 255 255 / .8) }
.hero .btn-primary{ background:#fff; color:var(--hero-a); box-shadow:0 6px 20px rgb(0 0 0 / .18) }
.hero .btn-primary svg{ width:20px; height:20px }
.hero-next{ font-size:.92rem; color:rgb(255 255 255 / .85) }
.week{ display:flex; gap:6px; align-items:center }
.week i{ width:10px; height:10px; border-radius:50%; background:rgb(255 255 255 / .25); display:block }
.week i.on{ background:var(--sun); box-shadow:0 0 0 3px rgb(255 176 32 / .25) }

/* topic cards */
.grouphead{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px }
.grouphead h2{ white-space:nowrap }
.tlist{ display:grid; gap:10px }
.tcard{ display:flex; gap:14px; align-items:center; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; min-height:76px }
.tcard:hover{ border-color:color-mix(in srgb, var(--teal) 45%, var(--line)) }
.tcard .grow{ flex:1; min-width:0 }
.tcard .ttl{ font-weight:650; line-height:1.3 }
.tcard .meta{ font-size:.82rem; color:var(--muted); margin-top:2px }
.ring{ width:44px; height:44px; flex:none }
.ring circle{ fill:none; stroke-width:5 }
.ring .bgc{ stroke:var(--sunk) }
.ring .fg{ stroke:var(--teal); stroke-linecap:round; transition:stroke-dashoffset 600ms ease }
.ring text{ fill:var(--ink); font-size:12px; font-weight:700; font-family:var(--font-body) }
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:.75rem; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--sunk); color:var(--muted); white-space:nowrap }
.chip.tx{ background:var(--warm-soft); color:var(--warm) }
.chip.rev{ background:var(--teal-soft); color:var(--teal) }

/* lessons */
.lesson{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden }
.lesson > button{ width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:none; border:0; padding:16px 18px; cursor:pointer; min-height:64px }
.lesson > button .grow{ flex:1; min-width:0 }
.lesson .lnum{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.85rem; background:var(--sunk); color:var(--muted); flex:none }
.lesson.read .lnum{ background:var(--good-soft); color:var(--good) }
.lesson .chev{ width:20px; height:20px; color:var(--muted); transition:transform var(--dur) }
.lesson[data-open="1"] .chev{ transform:rotate(180deg) }
.lbody{ padding:0 18px 18px 60px; display:flex; flex-direction:column; gap:10px; max-width:64ch }
.lbody b{ font-weight:650 }
.src{ display:inline-flex; align-items:center; gap:6px; font-size:.8rem; color:var(--muted); background:var(--sunk); padding:4px 10px; border-radius:8px; align-self:flex-start }
.flag{ display:flex; gap:10px; padding:10px 12px; border-radius:10px; background:var(--warm-soft); color:var(--ink); font-size:.88rem }
.flag svg{ flex:none; width:18px; height:18px; color:var(--warm); margin-top:2px }
@media (max-width:480px){ .lbody{ padding-left:18px } }

/* quiz */
.qtop{ display:flex; align-items:center; gap:12px; position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--tb, 65px)); z-index:15; background:var(--bg); padding-block:10px; margin-block:-10px; box-shadow:0 10px 12px -12px rgb(0 0 0 / .18) }
.bar{ height:8px; border-radius:99px; background:var(--sunk); overflow:hidden; flex:1 }
.bar > span{ display:block; height:100%; background:var(--teal); border-radius:99px; transition:width 400ms ease }
.qtext{ font-size:1.22rem; font-weight:600; line-height:1.45 }
.choices{ display:flex; flex-direction:column; gap:10px; list-style:none; margin:0; padding:0 }
.choice{ width:100%; display:flex; align-items:flex-start; gap:12px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; min-height:60px; cursor:pointer; line-height:1.4; transition:border-color var(--dur), background var(--dur) }
.choice:hover:not([disabled]){ border-color:color-mix(in srgb, var(--teal) 55%, var(--line)) }
.choice .key{ width:30px; height:30px; flex:none; border-radius:9px; display:grid; place-items:center; font-weight:700; font-size:.88rem; background:var(--sunk); color:var(--muted) }
.choice .ctext{ flex:1; min-width:0; padding-top:3px }
.choice .verdict{ flex:none; font-size:.8rem; font-weight:700; padding-top:5px; display:flex; align-items:center; gap:4px }
.choice .verdict svg{ width:18px; height:18px }
.choice[disabled]{ cursor:default }
.choice.is-correct{ border-color:var(--good); background:var(--good-soft) }
.choice.is-correct .key{ background:var(--good); color:var(--surface) }
.choice.is-correct .verdict{ color:var(--good) }
.choice.is-wrong{ border-color:var(--bad); background:var(--bad-soft) }
.choice.is-wrong .key{ background:var(--bad); color:var(--surface) }
.choice.is-wrong .verdict{ color:var(--bad) }
.choice.dim{ opacity:.72 }
.feedback{ border-radius:var(--radius); border:1px solid var(--line); background:var(--surface); padding:18px; display:flex; flex-direction:column; gap:12px; animation:rise var(--dur) ease-out }
.fb-head{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:650; font-size:1.15rem }
.fb-head svg{ width:26px; height:26px }
.fb-head .combo{ margin-left:auto; font-family:var(--font-body); font-size:.8rem; font-weight:700; display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:99px; background:color-mix(in srgb, var(--pop) 16%, var(--surface)); color:var(--pop) }
.fb-head .combo svg{ width:16px; height:16px }
.fb-good .fb-head{ color:var(--good) } .fb-bad .fb-head{ color:var(--bad) }
.others{ margin:0; padding-left:1.1rem; display:flex; flex-direction:column; gap:6px; font-size:.92rem; color:var(--muted) }
.others b{ color:var(--ink); font-weight:600 }
.tools{ display:flex; flex-wrap:wrap; gap:8px }
.toggle-btn[aria-pressed="true"]{ background:var(--teal-soft); border-color:var(--teal); color:var(--teal) }
.timer{ display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font-weight:700; font-size:.92rem; cursor:pointer; white-space:nowrap; flex:none }
.timer svg{ width:17px; height:17px; flex:none }
.timer .tico{ color:var(--h2); display:flex }
.timer .teye{ color:var(--muted); display:flex; margin-left:2px }
.timer .teye svg{ width:15px; height:15px }
.timer.is-hidden{ color:var(--muted); font-weight:600 }
.timer.low:not(.is-hidden){ border-color:var(--warm); color:var(--warm) }
.timer.done{ border-color:transparent;  background:var(--warm-soft); color:var(--warm) }
.stickynext{ position:sticky; bottom:calc(72px + env(safe-area-inset-bottom,0px)); padding-block:10px; background:linear-gradient(to top, var(--bg) 70%, transparent) }
@media (min-width:860px){ .stickynext{ bottom:0 } }
@keyframes rise{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
@keyframes pop{ 0%{ transform:scale(1) } 40%{ transform:scale(1.015) } 100%{ transform:scale(1) } }
.choice.is-correct{ animation:pop 320ms ease-out }

/* results */
.score{ display:flex; align-items:center; gap:18px }
.score .big{ font-family:var(--font-display); font-size:2.6rem; font-weight:650; line-height:1 }
.trow{ display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line) }
.trow:first-child{ border-top:0 }
.minibar{ width:90px; height:7px; border-radius:99px; background:var(--sunk); overflow:hidden; flex:none }
.minibar span{ display:block; height:100%; background:var(--teal) }
.missed{ display:flex; flex-direction:column; gap:8px; padding:14px 0; border-top:1px solid var(--line) }
.missed:first-child{ border-top:0 }
.ans{ font-size:.9rem; display:flex; gap:8px; align-items:flex-start }
.ans svg{ width:18px; height:18px; flex:none; margin-top:2px }
.ans.bad{ color:var(--bad) } .ans.good{ color:var(--good) }
.ans span{ color:var(--ink) }

/* settings */
.setting{ display:flex; align-items:center; gap:14px; padding:16px 0; border-top:1px solid var(--line) }
.setting:first-child{ border-top:0; padding-top:4px }
.setting .grow{ flex:1; min-width:0 }
.switch{ position:relative; width:56px; height:32px; border-radius:99px; border:0; background:var(--line); cursor:pointer; flex:none; transition:background var(--dur) }
.switch::after{ content:""; position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgb(0 0 0 / .25); transition:transform var(--dur) }
.switch[aria-checked="true"]{ background:var(--teal) }
.switch[aria-checked="true"]::after{ transform:translateX(24px) }
.seg{ display:inline-flex; background:var(--sunk); border-radius:12px; padding:4px; gap:4px; flex-wrap:wrap }
.seg button{ border:0; background:none; padding:8px 12px; border-radius:9px; font-weight:600; cursor:pointer; min-height:40px; color:var(--muted) }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .08) }
.setting.wrapline{ flex-wrap:wrap }

.note{ display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--line) }
.note:first-child{ border-top:0 }
.lvl{ flex:none; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:6px; height:fit-content }
.lvl.verify{ background:var(--warm-soft); color:var(--warm) }
.lvl.unclear{ background:var(--sunk); color:var(--muted) }
.lvl.minor{ background:var(--sunk); color:var(--muted) }
.empty{ text-align:center; padding:28px 18px; color:var(--muted) }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom,0px)); z-index:40; background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:600; box-shadow:0 8px 24px rgb(0 0 0 / .2); animation:rise var(--dur) ease-out; max-width:calc(100% - 32px) }
.disclaimer{ font-size:.8rem; color:var(--muted); text-align:center; max-width:52ch; margin:8px auto 0 }
.opt{ display:flex; gap:12px; align-items:center; padding:14px; border:1.5px solid var(--line); border-radius:12px; cursor:pointer }
.opt:has(input:checked){ border-color:var(--teal); background:var(--teal-soft) }
.opt input{ width:20px; height:20px; accent-color:var(--teal); flex:none }
.opt > span:not(.ticon){ display:flex; flex-direction:column; gap:2px; min-width:0 }
.qgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); gap:6px }
.qcell{ position:relative; height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-weight:600; font-size:.88rem; cursor:pointer; font-variant-numeric:tabular-nums }
.qcell.done{ background:var(--teal-soft); border-color:transparent; color:var(--teal) }
.qcell.cur{ border-color:var(--ink) }
.qcell .fdot{ position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:var(--warm) }
.legend{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px }
.legend .lg{ display:inline-block; width:14px; height:14px; border-radius:4px; border:1.5px solid var(--line); background:var(--surface); vertical-align:middle; position:relative }
.legend .lg.done{ background:var(--teal-soft); border-color:transparent }
.legend .lg.flg::after{ content:""; position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%; background:var(--warm) }
.exnav{ display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:8px }
.btn[disabled]{ opacity:.45; cursor:default }
.navpanel{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px 14px }
.navpanel summary{ cursor:pointer; font-weight:600; padding:10px 0; min-height:44px; display:flex; align-items:center }
.navpanel[open]{ padding-bottom:14px }
.navpanel[open] summary{ margin-bottom:6px }
.choice.is-picked{ border-color:var(--teal); background:var(--teal-soft) }
.choice.is-picked .key{ background:var(--teal); color:var(--teal-ink) }
.choice.is-picked .verdict{ color:var(--teal) }
.stats3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center }
.stats3 div{ background:var(--sunk); border-radius:12px; padding:12px 6px; display:flex; flex-direction:column }
.stats3 b{ font-family:var(--font-display); font-size:1.6rem; font-weight:650 }

.meter i{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); border-radius:2px }

.ticon{ --c:var(--h1); width:46px; height:46px; flex:none; border-radius:14px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 15%, var(--surface)); color:var(--c) }
.ticon svg{ width:24px; height:24px }
.ticon.lg{ width:60px; height:60px; border-radius:18px } .ticon.lg svg{ width:30px; height:30px }
.ticon.sm{ width:36px; height:36px; border-radius:11px } .ticon.sm svg{ width:19px; height:19px }
.tcard .ring{ width:40px; height:40px }
.tcard .ring .fg{ stroke:var(--c) }
.tcard .pbar{ height:5px; border-radius:99px; background:var(--sunk); margin-top:7px; overflow:hidden }
.tcard .pbar span{ display:block; height:100%; border-radius:99px; background:var(--c) }
.tcard:hover{ border-color:color-mix(in srgb, var(--c) 50%, var(--line)); transform:translateY(-1px) }
.tcard{ transition:transform var(--dur), border-color var(--dur) }
.tcard .done-badge{ color:var(--c); display:flex }
.tcard .done-badge svg{ width:22px; height:22px }
.tchip{ --c:var(--h1); display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:4px 10px 4px 6px; border-radius:99px; background:color-mix(in srgb, var(--c) 14%, var(--surface)); color:var(--c) }
.tchip svg{ width:16px; height:16px }
.qa{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px }
.qa a, .qa button{ --c:var(--h2); display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface); color:var(--ink); text-decoration:none; text-align:left; cursor:pointer; min-height:118px; transition:transform var(--dur), border-color var(--dur) }
.qa a:hover, .qa button:hover{ transform:translateY(-2px); border-color:color-mix(in srgb, var(--c) 50%, var(--line)) }
.qa .qtxt{ display:flex; flex-direction:column; gap:3px; min-width:0 }
.qa b{ font-weight:650; line-height:1.25 }
@media (min-width:860px){ .topbar .wrap{ max-width:900px } }
.qa small{ color:var(--muted); font-size:.78rem; line-height:1.3 }
@media (max-width:420px){ .qa{ grid-template-columns:1fr; } .qa a, .qa button{ flex-direction:row; align-items:center; min-height:0 } .qa .qtxt{ display:flex; flex-direction:column } }
.tip{ display:flex; gap:14px; align-items:flex-start; padding:16px; border-radius:var(--radius); background:color-mix(in srgb, var(--sun) 14%, var(--surface)); border:1px solid color-mix(in srgb, var(--sun) 35%, var(--line)) }
.tip .ticon{ --c:var(--h5) }
.tip p b{ font-weight:650 }
.topichead{ display:flex; gap:14px; align-items:center }
.lessons-wrap .lesson .lnum{ background:color-mix(in srgb, var(--c) 15%, var(--surface)); color:var(--c) }
.lessons-wrap .lesson.read .lnum{ background:var(--good-soft); color:var(--good) }
.setting > .ticon{ align-self:flex-start; margin-top:2px }
.confetti{ position:fixed; pointer-events:none; z-index:50; width:9px; height:9px; border-radius:2px; animation:conf 900ms cubic-bezier(.2,.7,.3,1) forwards }
@keyframes conf{ 0%{ transform:translate(0,0) rotate(0); opacity:1 } 100%{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0 } }
.resulthead{ display:flex; gap:14px; align-items:center }
.term{ display:inline; font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-decoration:underline dotted; text-decoration-color:color-mix(in srgb, var(--h2) 70%, transparent); text-decoration-thickness:2px; text-underline-offset:3px; border-radius:3px }
.term:hover{ background:color-mix(in srgb, var(--h2) 12%, transparent) }
.sheet-backdrop{ position:fixed; inset:0; z-index:60; background:rgb(10 14 30 / .45); display:flex; align-items:flex-end; justify-content:center; animation:fade var(--dur) ease-out }
.sheet{ width:100%; max-width:560px; background:var(--surface); color:var(--ink); border-radius:22px 22px 0 0; padding:12px max(20px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:14px; box-shadow:0 -10px 40px rgb(0 0 0 / .25); animation:rise 240ms ease-out }
@media (min-width:640px){ .sheet-backdrop{ align-items:center } .sheet{ border-radius:22px; padding:20px 22px } .sheet-grip{ display:none } }
.sheet-grip{ align-self:center; width:40px; height:5px; border-radius:99px; background:var(--line) }
.sheet-def{ font-size:1.05rem; line-height:1.55 }
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
.searchbox{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:0 14px; min-height:52px }
.searchbox:focus-within{ border-color:var(--h2); box-shadow:0 0 0 3px color-mix(in srgb, var(--h2) 20%, transparent) }
.searchbox svg{ width:20px; height:20px; color:var(--muted); flex:none }
.searchbox input{ flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--ink); padding:12px 0 }
.sresult, .gitem{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; color:var(--ink); font:inherit }
.sresult:hover, .gitem:hover{ border-color:color-mix(in srgb, var(--h2) 45%, var(--line)) }
.sresult .grow, .gitem .grow{ display:flex; flex-direction:column; gap:2px; min-width:0 }
.sresult b, .gitem b{ font-weight:650 }
mark{ background:color-mix(in srgb, var(--sun) 40%, transparent); color:inherit; border-radius:3px; padding:0 1px }
.glist{ display:flex; flex-direction:column; gap:8px }
.gdot{ --c:var(--h1); width:12px; height:12px; border-radius:50%; background:var(--c); flex:none }
.linkrow{ display:flex; gap:10px; flex-wrap:wrap }
.linkrow a{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-weight:600; padding:8px 14px 8px 8px; border:1px solid var(--line); border-radius:99px; background:var(--surface); min-height:44px }
.chartbox{ position:relative; width:100%; min-height:210px }
.chartbox svg{ display:block; overflow:visible }
.chartbox .grid{ stroke:var(--line); stroke-width:1 }
.chartbox .tick{ fill:var(--muted); font-size:11px; font-family:var(--font-body); font-variant-numeric:tabular-nums }
.chartbox .refline{ stroke:var(--ink); stroke-width:1.5; stroke-dasharray:5 4; opacity:.55 }
.chartbox .cross{ stroke:var(--muted); stroke-width:1 }
.chartbox .sline{ fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round }
.chartbox .sline.nat{ stroke:var(--s-nat) } .chartbox .sline.st{ stroke:var(--s-st) }
.chartbox .mk{ stroke:var(--surface); stroke-width:2 }
.chartbox .mk.nat{ fill:var(--s-nat) } .chartbox .mk.st{ fill:var(--s-st) }
.chartbox .dlabel{ fill:var(--ink); font-size:12px; font-weight:600; font-family:var(--font-body) }
.hhit{ position:absolute; width:32px; background:none; border:0; padding:0; cursor:pointer }
.hread{ margin-top:8px; background:var(--sunk); border-radius:12px; padding:10px 12px; font-size:.88rem; display:flex; flex-direction:column; gap:4px; font-variant-numeric:tabular-nums }
.hread .row b{ margin-left:auto }
.legend2{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.8rem; color:var(--muted) }
.legend2 span{ display:inline-flex; align-items:center; gap:6px }
.sw{ display:inline-block; width:10px; height:10px; border-radius:50%; flex:none }
.sw.nat{ background:var(--s-nat) } .sw.st{ background:var(--s-st) } .sw.sq{ border-radius:2px }
.sw.ref{ width:16px; height:0; border-top:2px dashed var(--ink); opacity:.55; border-radius:0 }
.htable{ width:100%; border-collapse:collapse; font-size:.88rem }
.htable th, .htable td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap }
.htable th{ color:var(--muted); font-weight:600 }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

/* ===== Glass skin: soft neutral ground, frosted cards, floating pill menu ===== */
:root{
  --font-display:"Merriweather", Georgia, "Times New Roman", serif;
  --font-body:"Nunito Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --bg:#edf1f2; --surface:#ffffff; --sunk:#e6ebec; --ink:#141719; --muted:#677076; --line:#dde3e5;
  --glass:rgb(255 255 255 / .66); --glass-strong:rgb(255 255 255 / .82); --glass-line:rgb(255 255 255 / .9); --glass-edge:rgb(20 30 40 / .06);
  --shadow:0 12px 32px -10px rgb(20 32 40 / .16); --radius:24px;
  --cu1:#4e1a0b; --cu2:#87341a; --cu3:#b65a2e; --silver1:#f3f4f5; --silver2:#c9ced2;
  --k1:#0f948a; --k2:#b5179e; --k3:#4f46e5; --k4:#c97d00; --dot:#e5322d;
  --orb1:rgb(182 90 46 / .16); --orb2:rgb(15 148 138 / .12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c0e10; --surface:#171a1d; --sunk:#1f2327; --ink:#eef1f3; --muted:#9aa3a9; --line:#272c31;
  --glass:rgb(30 34 38 / .62); --glass-strong:rgb(34 38 43 / .82); --glass-line:rgb(255 255 255 / .08); --glass-edge:rgb(0 0 0 / .3);
  --shadow:0 14px 34px -12px rgb(0 0 0 / .6);
  --k1:#21a397; --k2:#c04fc4; --k3:#7b7cf2; --k4:#b8781e; --dot:#ff5a52;
  --orb1:rgb(182 90 46 / .18); --orb2:rgb(33 163 151 / .12); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c0e10; --surface:#171a1d; --sunk:#1f2327; --ink:#eef1f3; --muted:#9aa3a9; --line:#272c31;
  --glass:rgb(30 34 38 / .62); --glass-strong:rgb(34 38 43 / .82); --glass-line:rgb(255 255 255 / .08); --glass-edge:rgb(0 0 0 / .3);
  --shadow:0 14px 34px -12px rgb(0 0 0 / .6);
  --k1:#21a397; --k2:#c04fc4; --k3:#7b7cf2; --k4:#b8781e; --dot:#ff5a52;
  --orb1:rgb(182 90 46 / .18); --orb2:rgb(33 163 151 / .12); color-scheme:dark }
body{ background:radial-gradient(55% 35% at 0% 0%, var(--orb1), transparent 70%), radial-gradient(45% 35% at 100% 40%, var(--orb2), transparent 70%), var(--bg); background-attachment:fixed; padding-bottom:calc(118px + env(safe-area-inset-bottom,0px)); letter-spacing:-0.005em }
h1,h2,h3{ font-weight:600; letter-spacing:-0.02em }
h1{ font-size:1.8rem }
.eyebrow{ letter-spacing:.06em }
.card, .tcard, .lesson, .feedback, .sresult, .gitem, .navpanel, .mq, .opt, .tip, .qa a, .qa button, .choice, .linkrow a, .searchbox{
  background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-line); box-shadow:var(--shadow), inset 0 0 0 1px var(--glass-edge); border-radius:var(--radius) }
.choice{ border-radius:20px; box-shadow:0 6px 18px -10px rgb(20 32 40 / .2) }
.choice.is-correct{ border-color:var(--good); background:color-mix(in srgb, var(--good-soft) 85%, transparent) }
.choice.is-wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad-soft) 85%, transparent) }
.choice.is-picked{ border-color:var(--ink); background:var(--glass-strong) }
.choice.is-picked .key{ background:var(--ink); color:var(--surface) }
.choice.is-picked .verdict{ color:var(--ink) }
.tip{ background:var(--glass) }
.opt:has(input:checked){ border-color:var(--ink); background:var(--glass-strong) }
.opt input{ accent-color:var(--ink) }
.btn{ border-radius:999px }
.btn-primary{ background:var(--ink); color:var(--surface) }
.btn-quiet{ background:var(--glass-strong); border-color:var(--glass-line); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px) }
.iconbtn{ border-radius:999px; background:var(--glass-strong); border:1px solid var(--glass-line); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); color:var(--ink); text-decoration:none }
.chip, .tchip{ border-radius:999px }
.timer{ border-radius:999px; background:var(--glass-strong); border-color:var(--glass-line) }
.stickynext{ bottom:calc(104px + env(safe-area-inset-bottom,0px)); background:none }
@media (min-width:860px){ .stickynext{ bottom:calc(104px + env(safe-area-inset-bottom,0px)) } }
.qtop{ background:color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:none }
.toast{ bottom:calc(116px + env(safe-area-inset-bottom,0px)); border-radius:999px }

/* top bar: search line like a native app */
.topbar{ background:color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%); border-bottom:0 }
.topbar .wrap{ max-width:680px; gap:8px; padding-block:8px }
.topsearch{ flex:1; min-width:0; display:flex; align-items:center; gap:12px; height:52px; background:none; border:0; border-bottom:1.5px solid var(--line); color:var(--muted); font:inherit; font-size:1.05rem; cursor:pointer; text-align:left; padding:0 4px }
.topsearch svg{ width:22px; height:22px; flex:none; color:var(--muted) }
.topsearch span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.topsearch:hover{ color:var(--ink) }
.topbar .iconbtn[aria-current="page"]{ background:var(--ink); color:var(--surface) }
.topbar.on-search .topsearch{ visibility:hidden }

/* floating pill menu */
.tabbar{ position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:30; display:flex; justify-content:center; align-items:center; gap:10px; background:none; border:0;
  padding-left:max(14px, env(safe-area-inset-left,0px)); padding-right:max(14px, env(safe-area-inset-right,0px)); padding-bottom:0; pointer-events:none }
.tabbar nav{ pointer-events:auto; flex:1; max-width:440px; margin:0; display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:6px; border-radius:999px;
  background:var(--glass-strong); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); border:1px solid var(--glass-line); box-shadow:0 14px 34px -8px rgb(20 32 40 / .28), inset 0 0 0 1px var(--glass-edge) }
.tabbar a{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:62px; padding:6px 2px; border-radius:999px; color:var(--ink); font-size:.82rem; font-weight:500; text-decoration:none }
.tabbar a svg{ width:24px; height:24px; padding:0; background:none!important }
.tabbar a[aria-current="page"]{ color:var(--ink); background:color-mix(in srgb, var(--ink) 9%, transparent) }
.tabbar a .ndot{ position:absolute; top:8px; right:calc(50% - 22px); width:11px; height:11px; border-radius:50%; background:var(--dot); box-shadow:0 0 0 2px var(--glass-strong) }
.fab{ pointer-events:auto; width:74px; height:74px; flex:none; border-radius:50%; display:grid; place-items:center; color:var(--ink); cursor:pointer;
  background:var(--glass-strong); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); border:1px solid var(--glass-line); box-shadow:0 14px 34px -8px rgb(20 32 40 / .28), inset 0 0 0 1px var(--glass-edge) }
.fab svg{ width:30px; height:30px }
.fab .spark{ color:var(--k3) }
@media (min-width:860px){ .tabbar{ display:flex } body{ padding-bottom:calc(118px + env(safe-area-inset-bottom,0px)) } }

/* wallet progress card */
.greet{ display:flex; flex-direction:column; gap:2px }
.greet p{ color:var(--muted) }
.wallet{ position:relative; border-radius:34px; padding:16px 16px 0; height:300px; margin-bottom:46px; color:#fff;
  background:radial-gradient(120% 90% at 20% 0%, var(--cu3), var(--cu2) 45%, var(--cu1)); box-shadow:0 22px 40px -18px rgb(78 26 11 / .55) }
.wallet::before{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:.55;
  background:radial-gradient(circle at 1px 1px, rgb(0 0 0 / .22) 1px, transparent 1.6px) 0 0/7px 7px, linear-gradient(115deg, transparent 30%, rgb(255 255 255 / .10) 45%, transparent 60%) }
.wsheet{ position:relative; height:170px; border-radius:22px 22px 8px 8px; padding:20px 22px; color:#14171a;
  background:linear-gradient(160deg, var(--silver1), var(--silver2) 55%, #eef0f2); overflow:hidden }
.wsheet::after{ content:""; position:absolute; right:-30px; top:-20px; width:240px; height:200px; opacity:.5;
  background:repeating-linear-gradient(115deg, rgb(255 255 255 / .9) 0 10px, rgb(170 176 182 / .35) 10px 22px); -webkit-mask:radial-gradient(closest-side, #000, transparent); mask:radial-gradient(closest-side, #000, transparent) }
.wmark{ position:relative; z-index:1; font-weight:700; font-size:1.7rem; letter-spacing:-0.04em; line-height:1 }
.wmark small{ display:block; font-size:.78rem; font-weight:500; letter-spacing:0; color:#5b6166; margin-top:6px }
.wbadge{ position:absolute; z-index:1; right:16px; top:16px; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:rgb(255 255 255 / .6); color:#14171a }
.wbadge svg{ width:20px; height:20px }
.wpocket{ position:absolute; left:0; right:0; bottom:0; height:182px; border-radius:0 0 34px 34px;
  background:radial-gradient(130% 120% at 30% 100%, var(--cu2), var(--cu1)), var(--cu2);
  -webkit-mask:radial-gradient(ellipse 30% 34px at 50% 0, transparent 97%, #000 100%); mask:radial-gradient(ellipse 30% 34px at 50% 0, transparent 97%, #000 100%) }
.wpocket::before{ content:""; position:absolute; inset:0; border-radius:inherit; opacity:.6; background:radial-gradient(circle at 1px 1px, rgb(0 0 0 / .25) 1px, transparent 1.6px) 0 0/7px 7px, linear-gradient(to bottom, rgb(255 255 255 / .12), transparent 30%) }
.wpanels{ position:absolute; left:22px; right:22px; bottom:-40px; display:flex; gap:6px }
.wpanel{ position:relative; border:0; cursor:pointer; color:#fff; text-align:left; text-decoration:none; font:inherit;
  background:linear-gradient(to bottom, rgb(255 255 255 / .22), rgb(255 255 255 / .10)); -webkit-backdrop-filter:blur(18px) saturate(140%); backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .35), 0 16px 30px -14px rgb(0 0 0 / .45) }
.wpanel.main{ flex:1; min-width:0; border-radius:26px 8px 8px 26px; padding:16px 18px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; min-height:112px }
.wpanel.side{ width:96px; border-radius:8px 26px 26px 8px; display:grid; place-items:center; flex:none }
.wpanel.side svg{ width:28px; height:28px }
.wlabel{ font-size:1rem; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.wpanel.main > span:first-child{ min-width:0 }
.wbig{ font-size:2.4rem; font-weight:500; letter-spacing:-0.03em; line-height:1.05; font-variant-numeric:tabular-nums }
.wbig small{ font-size:.85rem; font-weight:500; letter-spacing:0; opacity:.9; white-space:nowrap }
.wsub{ display:block; font-size:.82rem; opacity:.85; white-space:nowrap }
.wplay{ width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center; background:rgb(255 255 255 / .22); margin-bottom:2px }
.wplay svg{ width:18px; height:18px }
.wpanel:focus-visible{ outline:3px solid #fff; outline-offset:2px }

/* message card (like a notification) */
.msg{ padding:20px 22px }
.msg-head{ display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1.5px solid var(--line) }
.msg-head .mi{ width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--sunk); color:var(--ink) }
.msg-head .mi svg{ width:18px; height:18px }
.msg-head b{ flex:1; min-width:0; font-weight:600; font-size:1.08rem }
.msg-head time{ flex:none; white-space:nowrap }
.msg-head .mh-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px }
.msg-head .mh-text b{ flex:none }
.msg-head .mh-text small{ color:var(--muted); font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.msg-head time{ color:var(--muted); font-variant-numeric:tabular-nums }
.msg-body{ display:flex; align-items:center; gap:14px; padding-top:14px; width:100%; background:none; border:0; text-align:left; font:inherit; color:var(--ink); cursor:pointer; text-decoration:none }
.msg-body p{ flex:1; min-width:0; font-size:1.02rem; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.msg-body svg{ width:28px; height:28px; flex:none }

/* receipt card */
.receipt{ padding:22px 24px }
.receipt-top{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 12px; padding-bottom:18px; border-bottom:1.5px dashed var(--line) }
.receipt-top b{ font-size:1.25rem; font-weight:600 }
.receipt-top span{ font-size:1.3rem; font-weight:600; font-variant-numeric:tabular-nums; margin-left:auto; text-align:right }
.receipt dl{ display:grid; grid-template-columns:auto 1fr; gap:12px 22px; margin:18px 0 0 }

/* ===== photo hero ===== */
.photohero{ position:relative; border-radius:30px; padding:0 0 14px; background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%); border:1px solid var(--glass-line); box-shadow:0 24px 50px -24px rgb(20 32 40 / .35), inset 0 0 0 1px var(--glass-edge) }
.ph-media{ position:relative; aspect-ratio:4 / 3.15; border-radius:29px 29px 22px 22px; overflow:hidden; isolation:isolate; background:#dfe8e4 }
.ph-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:44% 60%; transform-origin:50% 60%; animation:phzoom 1.6s cubic-bezier(.2,.7,.2,1) both }
@keyframes phzoom{ from{ transform:scale(1.08); filter:saturate(.85) } to{ transform:scale(1); filter:none } }
.ph-shade{ position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(to bottom, rgb(10 16 24 / .38), rgb(10 16 24 / 0) 30%), linear-gradient(to top, rgb(10 16 24 / .28), rgb(10 16 24 / 0) 34%); }
.ph-badge, .ph-exam{ position:absolute; z-index:2; top:14px; display:inline-flex; align-items:center; gap:8px; color:#fff; font-weight:600; font-size:.92rem; border-radius:999px;
  background:rgb(255 255 255 / .18); -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%); border:1px solid rgb(255 255 255 / .35); box-shadow:0 6px 18px -8px rgb(0 0 0 / .4) }
.ph-badge{ left:14px; padding:8px 14px 8px 12px; letter-spacing:-0.01em }
.ph-dot{ width:8px; height:8px; border-radius:50%; background:var(--sun); box-shadow:0 0 0 3px rgb(255 176 32 / .3) }
.ph-exam{ right:14px; padding:8px 14px 8px 10px; min-height:44px; text-decoration:none }
.ph-exam svg{ width:20px; height:20px }
.ph-exam:hover{ background:rgb(255 255 255 / .28) }
.ph-panel{ position:relative; z-index:3; display:flex; align-items:center; gap:14px; width:calc(100% - 28px); margin:-30px 14px 0; padding:16px 16px 16px 20px; text-align:left; font:inherit; color:var(--ink); cursor:pointer; border-radius:24px;
  background:var(--glass-strong); -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%); border:1px solid var(--glass-line); box-shadow:0 18px 36px -18px rgb(20 32 40 / .45), inset 0 0 0 1px var(--glass-edge); transition:transform var(--dur) }
.ph-panel:hover{ transform:translateY(-1px) }
.ph-panel:active{ transform:scale(.99) }
.ph-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px }
.ph-label{ font-size:.86rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.ph-count{ display:flex; align-items:baseline; gap:4px; white-space:nowrap; font-variant-numeric:tabular-nums }
.ph-count b{ font-size:2.1rem; font-weight:600; letter-spacing:-0.03em; line-height:1.05 }
.ph-count span{ color:var(--muted); font-weight:500 }
.ph-bar{ height:6px; border-radius:99px; background:color-mix(in srgb, var(--ink) 10%, transparent); overflow:hidden; margin-top:4px }
.ph-bar span{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, var(--k1), var(--k3)) }
.ph-play{ width:54px; height:54px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:var(--surface); box-shadow:0 10px 20px -10px rgb(0 0 0 / .5) }
.ph-play svg{ width:20px; height:20px; margin-left:2px }
@media (max-width:400px){
  .ph-badge{ font-size:.82rem; padding:7px 12px 7px 10px; top:10px; left:10px }
  .ph-exam{ top:10px; right:10px; padding:6px 12px 6px 8px; font-size:.82rem }
  .ph-panel{ width:calc(100% - 20px); margin:-24px 10px 0; padding:12px 12px 12px 16px; gap:10px; border-radius:20px }
  .ph-count b{ font-size:1.75rem }
  .ph-play{ width:46px; height:46px }
  .photohero{ border-radius:26px; padding-bottom:10px } .ph-media{ border-radius:25px 25px 18px 18px }
}

@media (min-width:700px){ .ph-media{ aspect-ratio:3 / 2 } .ph-panel{ margin-top:-46px } }
/* ===== toast: full-width aware, clears menu and sticky buttons ===== */
.toast{ left:50% !important; right:auto; transform:translateX(-50%); width:max-content; max-width:min(520px, calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  display:flex; align-items:center; gap:12px; padding:12px 12px 12px 16px; border-radius:20px !important; line-height:1.35; text-align:left; font-weight:600;
  background:color-mix(in srgb, var(--ink) 94%, transparent); color:var(--surface); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  box-shadow:0 16px 36px -12px rgb(0 0 0 / .45); animation:toastin 260ms cubic-bezier(.2,.8,.2,1) both }
.toast.out{ animation:toastout 200ms ease-in both }
@keyframes toastin{ from{ opacity:0; transform:translate(-50%, 10px) scale(.98) } to{ opacity:1; transform:translate(-50%, 0) } }
@keyframes toastout{ to{ opacity:0; transform:translate(-50%, 6px) } }
.toast .t-ico{ flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:rgb(255 255 255 / .1); color:var(--sun) }
.toast .t-ico svg{ width:18px; height:18px }
.toast .t-msg{ flex:1; min-width:0 }
.toast .t-act{ flex:none; min-height:40px; padding:8px 16px; border-radius:999px; border:0; font:inherit; font-weight:700; cursor:pointer; background:var(--surface); color:var(--ink) }
@media (max-width:400px){ .toast{ gap:10px; padding:10px 10px 10px 12px; font-size:.92rem } .toast .t-act{ padding:8px 12px } }

/* ===== type pairing: Merriweather headings + Nunito Sans text ===== */
body{ letter-spacing:0 }
h1, h2, h3{ font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; line-height:1.25 }
h1{ font-size:1.65rem } h2{ font-size:1.22rem } h3{ font-size:1.02rem }
.tcard .ttl, .qa b, .msg-head b, .receipt-top b, .sresult b, .gitem b, .cal-item b, .lesson h3, .sheet h2, .ph-count b, .stats3 b, .score .big, .opt b{ font-family:var(--font-display); font-weight:700; letter-spacing:-0.005em }
.ph-count b{ font-weight:900; letter-spacing:-0.02em }
.qtext{ font-family:var(--font-body) !important; font-weight:700; letter-spacing:-0.005em }
.ph-badge{ font-family:var(--font-display); font-weight:700; font-size:.86rem }
.eyebrow, .ph-label{ font-family:var(--font-body); font-weight:700 }
.btn, .tabbar a, .chip, .tchip, .timer{ font-family:var(--font-body) }
.tabbar a{ font-weight:600 }
@media (max-width:400px){ h1{ font-size:1.45rem } .ph-count b{ font-size:1.6rem } }

/* ===== emphasis: formulas, calculations, key notions ===== */
.formula{ display:inline-block; font-family:var(--font-body); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:0; color:var(--ink);
  background:color-mix(in srgb, var(--k3) 11%, var(--surface)); border:1px solid color-mix(in srgb, var(--k3) 30%, transparent); border-radius:10px; padding:2px 10px; margin:2px 0; line-height:1.5 }
.fgrid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px }
.fgrid .formula{ margin:0 }
.lbody b, .lbody strong{ font-weight:700; background:linear-gradient(transparent 58%, color-mix(in srgb, var(--sun) 32%, transparent) 58%); padding:0 .08em; border-radius:2px; -webkit-box-decoration-break:clone; box-decoration-break:clone }
.kfig{ font-weight:700; color:var(--ink); background:linear-gradient(transparent 60%, color-mix(in srgb, var(--k1) 22%, transparent) 60%); padding:0 .06em; border-radius:2px; -webkit-box-decoration-break:clone; box-decoration-break:clone; white-space:nowrap }
.calc{ border-radius:16px; padding:12px 14px; background:color-mix(in srgb, var(--k3) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--k3) 24%, transparent); display:flex; flex-direction:column; gap:8px }
.calc .eyebrow{ display:flex; align-items:center; gap:6px; color:var(--k3) }
.calc .eyebrow svg{ width:15px; height:15px }
.calc ol{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; counter-reset:st }
.calc li{ display:flex; gap:10px; align-items:flex-start; font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink); line-height:1.6 }
.calc .st-b{ flex:1; min-width:0; overflow-wrap:normal; word-break:normal }
.calc .nw, .calc .rhs{ white-space:nowrap }
.calc .rhs{ display:inline-block }
.calc .st-n{ flex:none; width:22px; height:22px; margin-top:2px; border-radius:50%; display:grid; place-items:center; font-size:.72rem; font-weight:700; color:var(--k3); background:color-mix(in srgb, var(--k3) 14%, var(--surface)) }
.calc .eq{ color:var(--muted); font-weight:500 }
.calc b{ font-weight:800 }
.calc b.res{ display:inline-block; padding:0 8px; border-radius:8px; background:var(--ink); color:var(--surface); white-space:nowrap }
.missed .calc, .mq .calc{ margin-top:2px }

/* ===== exam format radios: white with ring when unselected ===== */
.opt input[type="radio"]{ -webkit-appearance:none; appearance:none; width:24px; height:24px; flex:none; margin:0; border-radius:50%; background:#fff; border:2px solid color-mix(in srgb, var(--ink) 38%, #fff); box-shadow:0 1px 2px rgb(0 0 0 / .08); cursor:pointer; display:grid; place-items:center; transition:border-color var(--dur), box-shadow var(--dur) }
.opt input[type="radio"]::after{ content:""; width:10px; height:10px; border-radius:50%; background:var(--ink); transform:scale(0); transition:transform 160ms ease }
.opt input[type="radio"]:checked{ border-color:var(--ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent) }
.opt input[type="radio"]:checked::after{ transform:scale(1) }
.opt input[type="radio"]:focus-visible{ outline:3px solid var(--focus); outline-offset:2px }
.opt:hover input[type="radio"]:not(:checked){ border-color:var(--ink) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .opt input[type="radio"]{ border-color:#7d868d; box-shadow:0 0 0 3px rgb(255 255 255 / .14) } :root:not([data-theme="light"]) .opt input[type="radio"]::after{ background:#14171a } :root:not([data-theme="light"]) .opt input[type="radio"]:checked{ border-color:#fff } }
:root[data-theme="dark"] .opt input[type="radio"]{ border-color:#7d868d; box-shadow:0 0 0 3px rgb(255 255 255 / .14) }
:root[data-theme="dark"] .opt input[type="radio"]::after{ background:#14171a }
:root[data-theme="dark"] .opt input[type="radio"]:checked{ border-color:#fff }

/* top search only on Home and Topics */
.topbar.no-search .topsearch{ display:none }
.topbar.no-search .wrap{ justify-content:flex-end }

/* ===== no top bar: actions live in page headers ===== */

main{ padding-block:22px 32px }
.qtop{ top:env(safe-area-inset-top,0px) }

/* ===== home: daily challenge ===== */
.daily{ display:flex; flex-direction:column; gap:14px; padding:18px 20px; position:relative; overflow:hidden }
.daily::before{ content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(90% 70% at 100% 0%, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%) }
.daily > *{ position:relative }
.daily-top{ display:flex; align-items:center; justify-content:space-between; gap:10px }
.daily-badge{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 9px; border-radius:999px; font-size:.8rem; font-weight:700; letter-spacing:.02em; color:#fff; background:linear-gradient(135deg, #ff7a45, #e8432d) }
.daily-badge svg{ width:15px; height:15px }
.daily-top time{ color:var(--muted); font-size:.86rem; font-variant-numeric:tabular-nums }
.daily-body{ display:flex; gap:14px; align-items:center }
.daily-text{ min-width:0; display:flex; flex-direction:column; gap:3px }

.dd-check{ width:30px; height:30px; flex:none; display:grid; place-items:center; border-radius:50%; background:var(--good); color:#fff }

/* ===== home: week strip ===== */

.week-row{ display:flex; align-items:center; gap:8px }

@media (max-width:380px){ .week-days{ gap:3px } .wday{ min-height:62px } .wday .wd-name{ font-size:.64rem } .wday .wd-num{ font-size:.92rem } .cal-toggle{ width:38px; height:62px } }

/* ===== home: bento ===== */
.bento{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); grid-auto-flow:dense; gap:12px }
.tile{ position:relative; display:flex; flex-direction:column; gap:8px; padding:16px; min-width:0; text-align:left; font:inherit; color:var(--ink); text-decoration:none; cursor:pointer;
  background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%); border:1px solid var(--glass-line); border-radius:24px; box-shadow:var(--shadow), inset 0 0 0 1px var(--glass-edge) }
div.tile{ cursor:default }
a.tile:hover, button.tile:hover{ border-color:color-mix(in srgb, var(--ink) 25%, var(--glass-line)) }
.tile-head{ display:flex; align-items:center; gap:10px }
.tile-head b{ font-family:var(--font-display); font-weight:700; font-size:1.05rem }
.tile-title{ font-family:var(--font-display); font-weight:700; font-size:1.02rem; line-height:1.25 }
.tile-text{ color:var(--muted); line-height:1.45 }
.tile-big{ font-family:var(--font-display); font-weight:900; font-size:1.55rem; line-height:1.1; letter-spacing:-0.02em; margin-top:auto }
.t-next{ grid-column:span 2; flex-direction:column; padding-right:64px }
.t-next .tile-text{ color:var(--ink); font-size:1rem }

/* Study content for Aurely's Texas salesperson exam prep.
