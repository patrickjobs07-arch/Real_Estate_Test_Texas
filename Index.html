    w: "Barber chairs are trade fixtures. The tenant may remove them before the lease expires and must repair any damage. If they're left behind, they become the landlord's by accession." },
  { id: "pr4", t: "property", s: "POR1 p. 23",
    q: "Annual crops produced by labor, such as a planted wheat crop, are known as:",
    c: ["Emblements, treated as personal property", "Improvements that transfer with the land", "Fixtures", "Appurtenances"],
    n: ["", "Shrubs, trees, and landscaping are improvements; annual crops are treated differently.", "Crops aren't fixtures, even though they grow in the land.", "An appurtenance is a right that runs with the land, like an easement."],
    w: "Emblements are annual crops produced by labor. Even though they are attached to the land, they are considered personal property." },
  { id: "pr5", t: "property", s: "POR1 p. 23",
    q: "When the seller agrees to include a freestanding refrigerator in the sale, the refrigerator is normally transferred by:",
    c: ["A bill of sale", "The deed", "The deed of trust", "A release of lien"],
    n: ["", "A deed conveys real property.", "A deed of trust secures a loan.", "A release of lien clears a paid-off debt."],
    w: "Personal property that goes with a sale is transferred by a bill of sale, which normally accompanies the deed." },
  { id: "pr6", t: "property", s: "POR1 p. 22", tx: true,
    q: "Under Texas water law as summarized in the course, surface water in rivers and streams belongs to:",
    c: ["The State of Texas", "The owner of the adjoining land", "Whoever pumps it first", "The county where it flows"],
    n: ["", "Riparian owners need a permit to use it (since 1967).", "The \"biggest pump\" rule describes groundwater, not surface water.", "The course doesn't assign water ownership to counties."],
    w: "Groundwater belongs to the landowner, but surface water belongs to the State of Texas." },

  /* estates */
  { id: "es1", t: "estates", s: "POR1 p. 31",
    q: "Which estate gives the owner the most complete ownership, with the fewest limitations?",
    c: ["Fee simple absolute", "Fee simple defeasible", "Life estate", "Estate for years"],
    n: ["", "A defeasible fee can be lost if a condition is broken.", "A life estate ends at a person's death.", "An estate for years is a leasehold: possession without ownership."],
    w: "Fee simple absolute places the fewest limitations on the owner, is inheritable, and is indefeasible." },
  { id: "es2", t: "estates", s: "POR1 p. 32",
    q: "Rosa receives a life estate that lasts for the lifetime of her uncle, not her own. This is a:",
    c: ["Life estate pur autre vie", "Remainder interest", "Fee simple determinable", "Tenancy at will"],
    n: ["", "A remainder is the future interest of whoever takes ownership after the life estate.", "A determinable fee is tied to a use condition, not a lifetime.", "A tenancy at will is a leasehold."],
    w: "A life estate measured by someone else's life is a life estate pur autre vie." },
  { id: "es3", t: "estates", s: "POR1 p. 34",
    q: "An electric company's right to run power lines across a homeowner's back lot is most commonly:",
    c: ["An easement in gross", "An easement appurtenant", "An encroachment", "A license to occupy"],
    n: ["", "An appurtenant easement benefits a neighboring parcel, not a company.", "An encroachment is an unauthorized intrusion onto another's land.", "The course classifies utility rights as easements in gross."],
    w: "An easement in gross belongs to a person or company rather than to a parcel. The utility easement is the most common example." },
  { id: "es4", t: "estates", s: "POR1 p. 34",
    q: "Which statement about an easement appurtenant is correct?",
    c: ["It runs with the land and passes to new owners when the land is sold", "It belongs to a person, not to a parcel", "It ends automatically when either property is sold", "It is used mainly for utility lines"],
    n: ["", "That describes an easement in gross.", "Because it runs with the land, it survives a sale.", "Utility lines are typically easements in gross."],
    w: "An easement appurtenant benefits a piece of land and runs with it. It's most often used for ingress and egress." },
  { id: "es5", t: "estates", s: "POR1 p. 64", tx: true,
    q: "Two unmarried friends buy a house together. The deed doesn't say how they hold title or in what shares. Under Texas law they are:",
    c: ["Tenants in common with equal shares", "Joint tenants with right of survivorship", "Owners of community property", "Owners in severalty"],
    n: ["", "Joint tenancy has to be specifically created and needs the four unities.", "Community property applies to spouses.", "Severalty means one owner."],
    w: "In the course's example, co-owners whose deed is silent are tenants in common. With no division stated, they own equal shares." },
  { id: "es6", t: "estates", s: "POR1 p. 64",
    q: "The four unities required to create a joint tenancy are:",
    c: ["Time, title, interest, and possession", "Time, title, intent, and price", "Title, interest, consideration, and delivery", "Possession, consent, recording, and title"],
    n: ["", "Intent and price aren't unities.", "Consideration and delivery relate to contracts and deeds.", "Consent and recording aren't unities."],
    w: "Joint owners must acquire their interests at the same time, from the same source, in equal shares, with equal rights of possession." },

  /* landuse */
  { id: "lu1", t: "landuse", s: "POR1 p. 29",
    q: "The most common example of the government's police power is:",
    c: ["Zoning", "Eminent domain", "Escheat", "Ad valorem taxation"],
    n: ["", "Eminent domain is a separate right: taking property with compensation.", "Escheat applies when an owner dies without a will or heirs.", "Taxation is its own right in PETE."],
    w: "Police power is the right to regulate land use. Zoning is the most common example, along with environmental laws and health and fire codes." },
  { id: "lu2", t: "landuse", s: "POR1 p. 29",
    q: "An apartment complex was legal when built. The area was later rezoned for single-family homes only. The apartments are now a:",
    c: ["Nonconforming use", "Variance", "Inverse condemnation", "Deed restriction"],
    n: ["", "A variance is permission requested to depart from current zoning.", "Inverse condemnation is a lawsuit that forces the government to buy land.", "Deed restrictions are private controls, not zoning."],
    w: "A use that was permitted under the former rules and continues after a zoning change is a nonconforming use." },
  { id: "lu3", t: "landuse", s: "POR1 p. 30",
    q: "A landowner sues the city to force it to purchase land that a city project has made unusable. This is called:",
    c: ["Inverse condemnation", "Eminent domain", "Escheat", "Police power"],
    n: ["", "In eminent domain, the government starts the taking.", "Escheat follows death without heirs or abandonment.", "Police power regulates use without compensation."],
    w: "When the owner sues to force the government to buy the land, it is inverse condemnation." },
  { id: "lu4", t: "landuse", s: "POR1 p. 30",
    q: "At a foreclosure sale, which lien is paid first?",
    c: ["Unpaid property taxes", "The first mortgage", "A mechanic's lien", "A judgment lien"],
    n: ["", "Property taxes outrank even the first mortgage.", "These rank below property taxes.", "These rank below property taxes."],
    w: "Property taxes create the highest-priority lien. Unpaid taxes are an automatic lien and are always paid first at foreclosure." },
  { id: "lu5", t: "landuse", s: "POR1 p. 31",
    q: "A man dies without a will and without any heirs. His land passes to the state through:",
    c: ["Escheat", "Eminent domain", "Adverse possession", "Police power"],
    n: ["", "Eminent domain is a taking for public use, with compensation.", "Adverse possession is a private claim based on occupation.", "Police power regulates use."],
    w: "Under escheat, the government takes title when someone dies intestate and without heirs, or when property is abandoned." },

  /* contracts */
  { id: "co1", t: "contracts", s: "CON p. 65",
    q: "A buyer pays a fee for the right to purchase land at a set price within one year. Only the seller is bound. This is a:",
    c: ["Unilateral contract", "Bilateral contract", "Void contract", "Implied contract"],
    n: ["", "In a bilateral contract, both parties must perform.", "Nothing in the facts makes it void.", "It was created by express agreement."],
    w: "An option is a unilateral contract. The buyer may buy, but the seller must sell if the buyer exercises the option." },
  { id: "co2", t: "contracts", s: "CON p. 66–67",
    q: "Which of the following is NOT one of the five essential elements of a valid contract?",
    c: ["Earnest money", "Consideration", "Competent parties", "Legal purpose"],
    n: ["", "Consideration is required.", "Competent parties are required.", "A legal purpose is required."],
    w: "The five elements are competent parties, offer and acceptance, legal purpose, a writing when required, and consideration. The course states that earnest money is not one of them." },
  { id: "co3", t: "contracts", s: "CON p. 66",
    q: "According to the course, an oral agreement to sell a house is:",
    c: ["Valid but unenforceable", "Void", "Voidable by the buyer only", "Fully enforceable if witnessed"],
    n: ["", "Void contracts are those with an illegal purpose, which this isn't.", "Voidability relates to capacity or consent problems.", "The Statute of Frauds requires a writing; witnesses don't fix that."],
    w: "Under the Statute of Frauds, real estate contracts must be in writing. The course says an unwritten one is valid but not enforceable." },
  { id: "co4", t: "contracts", s: "CON p. 66",
    q: "A contract whose purpose is illegal is:",
    c: ["Void", "Voidable", "Valid but unenforceable", "Executory"],
    n: ["", "A voidable contract is valid until one party chooses to cancel.", "That describes a contract that fails the writing requirement.", "Executory describes timing, not legality."],
    w: "The law treats a contract for an illegal purpose as if it never existed. It is void." },
  { id: "co5", t: "contracts", s: "CON p. 67",
    q: "The seller signs an acceptance on Monday. The buyer is told of the acceptance on Tuesday. The effective date is:",
    c: ["Tuesday", "Monday", "The date of closing", "The date the buyer delivers earnest money"],
    n: ["", "Signing isn't enough; acceptance must be communicated.", "Closing is when the contract becomes executed.", "Earnest money isn't what makes a contract effective."],
    w: "The effective date is the date acceptance is communicated to the offering party." },
  { id: "co6", t: "contracts", s: "CON p. 137",
    q: "Which remedy is the only one that could result in the sale actually closing?",
    c: ["Specific performance", "Liquidated damages", "Monetary damages", "Refund of earnest money"],
    n: ["", "Liquidated damages release the parties instead of closing.", "Money damages compensate the injured party but don't close the sale.", "A refund terminates the contract."],
    w: "Specific performance is a court order directing the defaulting party to perform. It is the only remedy that can lead to closing." },
  { id: "co7", t: "contracts", s: "CON p. 67",
    q: "Can a listing agreement be assigned to another person?",
    c: ["No. It is a personal services contract", "Yes, like any contract", "Yes, but only with TREC approval", "Only if the property is commercial"],
    n: ["", "Most contracts are assignable, but personal services contracts are an exception.", "TREC has no approval role here.", "Property type doesn't change the rule."],
    w: "Personal services contracts aren't assignable, so listing and buyer representation agreements can't be assigned." },

  /* title */
  { id: "ti1", t: "title", s: "POR1 p. 147",
    q: "Which deed gives the buyer the greatest protection?",
    c: ["General warranty deed", "Special warranty deed", "Quitclaim deed", "Deed of trust"],
    n: ["", "Its warranty covers only the grantor's period of ownership.", "It carries no warranty at all.", "A deed of trust secures a loan; it doesn't convey a sale."],
    w: "A general warranty deed warrants title back to the sovereignty of the soil, which gives the most protection." },
  { id: "ti2", t: "title", s: "POR1 p. 147",
    q: "A deed warrants title only against claims arising \"by, through, or under Grantor but not otherwise.\" It is a:",
    c: ["Special warranty deed", "General warranty deed", "Quitclaim deed", "Sheriff's deed"],
    n: ["", "A general warranty covers the full chain of title.", "A quitclaim makes no warranty.", "Sheriff's deeds aren't covered in this section of the course."],
    w: "That limiting language defines the special warranty deed, which builders and lenders selling foreclosures often use." },
  { id: "ti3", t: "title", s: "POR1 p. 148",
    q: "A title company asks a former co-owner to sign a deed giving up any possible claim, with no warranty. The company is most likely using a:",
    c: ["Quitclaim deed", "General warranty deed", "Special warranty deed", "Bill of sale"],
    n: ["", "This deed carries a full warranty.", "This deed still carries a limited warranty.", "A bill of sale transfers personal property."],
    w: "A quitclaim deed carries no warranty and is mainly used to cure title problems. It's also common in divorces." },
  { id: "ti4", t: "title", s: "POR1 p. 135",
    q: "Which of the following is an example of involuntary alienation?",
    c: ["Adverse possession", "A sale using a general warranty deed", "A gift deed to a child", "Signing a listing agreement"],
    n: ["", "A sale is voluntary.", "A gift is voluntary.", "A listing doesn't transfer ownership."],
    w: "Involuntary alienation transfers ownership against the owner's will. Adverse possession is one of the course's examples." },
  { id: "ti5", t: "title", s: "POR1 p. 182",
    q: "A title commitment shows a lis pendens. This means:",
    c: ["A lawsuit affecting the property is pending", "Property taxes are delinquent", "A mortgage was paid but not released", "A utility easement exists"],
    n: ["", "Delinquent taxes are listed separately.", "That would be an unreleased lien.", "Easements are listed as exceptions, not as lis pendens."],
    w: "A lis pendens is notice of a pending lawsuit affecting the property. It must be resolved before closing." },
  { id: "ti6", t: "title", s: "POR1 p. 145", tx: true,
    q: "A Texas deed often recites \"$10.00 and other good and valuable consideration\" rather than the price because:",
    c: ["Texas is a non-disclosure state", "Deeds may not mention money", "TREC sets the consideration amount", "The real price appears only on the deed of trust"],
    n: ["", "Consideration must be cited; the exact amount needn't be.", "TREC doesn't set the consideration.", "That isn't what the course says."],
    w: "Consideration is required for a valid deed, but because Texas is a non-disclosure state, the exact price doesn't have to be stated." },

  /* finance */
  { id: "fi1", t: "finance", s: "FIN p. 138",
    q: "Which security instrument involves three parties: borrower, lender, and trustee?",
    c: ["Deed of trust", "Standard mortgage", "Promissory note", "Warranty deed"],
    n: ["", "A standard mortgage is a two-party instrument.", "The note is the promise to pay, not the security instrument.", "A warranty deed conveys title to a buyer."],
    w: "A deed of trust is a three-party instrument. Its power of sale clause allows non-judicial foreclosure." },
  { id: "fi2", t: "finance", s: "FIN p. 13",
    q: "A lender charges one discount point on a $200,000 loan. How much is the point?",
    c: ["$2,000", "$200", "$20,000", "$1,000"],
    n: ["", "That would be 0.1%.", "That would be 10%.", "That would be half a point."],
    w: "One point is 1% of the loan amount: $200,000 × 0.01 = $2,000." },
  { id: "fi3", t: "finance", s: "FIN p. 186",
    q: "Which statement about the FHA is correct?",
    c: ["It insures loans made by approved lenders", "It lends money directly to buyers", "It guarantees loans only for veterans", "It buys loans on the secondary market"],
    n: ["", "The course stresses that the FHA is not a lender.", "That describes the VA program.", "That describes secondary market agencies such as Fannie Mae."],
    w: "The FHA is not a lender. It insures loans and charges the borrower mortgage insurance premiums." },
  { id: "fi4", t: "finance", s: "FIN p. 68",
    q: "Under TRID, when must the borrower receive the Closing Disclosure?",
    c: ["At least three business days before closing the loan", "At the closing table", "Within three days after application", "Ten days after closing"],
    n: ["", "Receiving it at closing would leave no review time.", "That timing belongs to the Loan Estimate.", "It has to come before closing."],
    w: "The creditor must make sure the consumer receives the Closing Disclosure at least three business days before closing." },
  { id: "fi5", t: "finance", s: "FIN p. 143",
    q: "A clause that makes the entire unpaid principal due upon default is a(n):",
    c: ["Acceleration clause", "Escalation clause", "Prepayment clause", "Subordination clause"],
    n: ["", "An escalation clause lets the lender raise the interest rate.", "Prepayment clauses deal with paying early.", "Subordination changes lien priority."],
    w: "An acceleration clause makes the entire principal due and payable if the borrower defaults." },
  { id: "fi6", t: "finance", s: "POR2 p. 9",
    q: "A loan program allows 90% LTV. The sales price is $105,000 and the appraisal is $100,000. What is the maximum loan?",
    c: ["$90,000", "$94,500", "$100,000", "$105,000"],
    n: ["", "That uses the sales price, which is the higher figure.", "That's 100% of the appraisal.", "That's 100% of the price."],
    w: "LTV uses the lower of the price or the appraised value: $100,000 × 90% = $90,000." },
  { id: "fi7", t: "finance", s: "FIN p. 186", flag: "The FHA maximum LTV is a HUD program figure that can change. Verify it on hud.gov.",
    q: "According to the course, the maximum loan-to-value ratio on an FHA loan is:",
    c: ["96.5%", "80%", "100%", "90%"],
    n: ["", "80% is a common conventional benchmark, not FHA's.", "100% financing isn't the FHA figure in the course.", "This isn't the figure the course gives."],
    w: "The course states that the maximum LTV on an FHA loan is 96.5%, meaning a minimum 3.5% down payment." },

  /* appraisal */
  { id: "ap1", t: "appraisal", s: "POR2 p. 21",
    q: "Which approach is most useful for valuing a church?",
    c: ["Cost approach", "Sales comparison approach", "Income approach", "Gross rent multiplier"],
    n: ["", "Special-purpose buildings have few comparable sales.", "Churches don't usually produce rental income.", "The gross rent multiplier is an income tool."],
    w: "The cost approach is used for unique, special-purpose properties with little market activity, such as churches." },
  { id: "ap2", t: "appraisal", s: "POR2 p. 20",
    q: "A comparable sale has a fireplace and the subject home doesn't. The fireplace contributes $1,400 in this market. The appraiser should:",
    c: ["Subtract $1,400 from the comparable's sale price", "Add $1,400 to the comparable's sale price", "Add $1,400 to the subject's value", "Use the cost to build a fireplace instead"],
    n: ["", "You add only when the comp lacks a feature the subject has.", "Adjustments are made to the comparable, not the subject.", "The market's contribution matters, not the construction cost."],
    w: "When a comp is superior to the subject, adjust the comp down by the feature's market contribution." },
  { id: "ap3", t: "appraisal", s: "POR2 p. 22",
    q: "A new freeway is built next to a neighborhood, and nearby homes lose value. This is:",
    c: ["External obsolescence", "Functional obsolescence", "Physical deterioration", "Deferred maintenance"],
    n: ["", "Functional obsolescence is an outdated design inside the property.", "Physical deterioration is wear and tear.", "Deferred maintenance is a type of physical deterioration."],
    w: "External obsolescence comes from outside the property, such as highways, factories, or zoning changes." },
  { id: "ap4", t: "appraisal", s: "POR2 p. 22",
    q: "An older home is heated by bulky steam radiators that buyers now find undesirable. This is an example of:",
    c: ["Functional obsolescence", "External obsolescence", "Economic obsolescence", "Physical deterioration"],
    n: ["", "The problem is inside the property, not outside it.", "Economic obsolescence is another name for external obsolescence.", "The radiators still work; the issue is design."],
    w: "Functional obsolescence is a loss in desirability of the style, layout, or function of an element over time. The course uses steam radiators as its example." },
  { id: "ap5", t: "appraisal", s: "POR2 p. 22",
    q: "Using the cost approach: replacement cost is $240,000, depreciation is 25%, and land is worth $40,000. What is the indicated value?",
    c: ["$220,000", "$180,000", "$240,000", "$280,000"],
    n: ["", "That's the depreciated building value without the land added.", "That ignores both depreciation and the land.", "That adds the land but ignores depreciation."],
    w: "$240,000 − (25% × $240,000) = $180,000 for the building, plus $40,000 for the land, equals $220,000." },
  { id: "ap6", t: "appraisal", s: "POR2 p. 24",
    q: "In reconciliation, the appraiser:",
    c: ["Weighs the approaches using judgment to reach one value", "Averages the three approaches", "Always picks the highest value", "Uses a formula set by the lender"],
    n: ["", "The course says no set formula or weighted average is used.", "There's no such rule.", "No lender formula applies."],
    w: "Reconciliation is at the appraiser's discretion, and the reasoning is explained in the report." },

  /* leases */
  { id: "le1", t: "leases", s: "POR2 p. 196",
    q: "A tenant's lease has ended, but the tenant refuses to leave and pays no rent. This is a:",
    c: ["Tenancy at sufferance", "Tenancy at will", "Periodic tenancy", "Estate for years"],
    n: ["", "A tenancy at will exists with the owner's permission.", "A periodic tenancy renews by agreement.", "An estate for years has an agreed term."],
    w: "A holdover tenant occupying against the owner's will, without paying rent, has a tenancy at sufferance." },
  { id: "le2", t: "leases", s: "POR2 p. 196",
    q: "A month-to-month rental that renews automatically until someone gives notice is a(n):",
    c: ["Periodic tenancy", "Estate for years", "Tenancy at sufferance", "Life estate"],
    n: ["", "An estate for years has fixed start and end dates.", "That's an unwanted holdover.", "A life estate is a freehold estate."],
    w: "A periodic tenancy renews itself for like periods and requires notice to end." },
  { id: "le3", t: "leases", s: "POR2 p. 196",
    q: "Which leasehold has definite start and end dates and needs no notice to end?",
    c: ["Estate for years", "Periodic tenancy", "Tenancy at will", "Tenancy at sufferance"],
    n: ["", "A periodic tenancy requires notice.", "A tenancy at will has no fixed term.", "There's no agreed term at all."],
    w: "An estate for years has a specific start and end date, and it survives death or the sale of the property." },
  { id: "le4", t: "leases", s: "POR2 p. 196",
    q: "A shopping center tenant pays a base rent plus a share of gross sales. This is a:",
    c: ["Percentage lease", "Gross lease", "Net lease", "Graduated lease"],
    n: ["", "In a gross lease, the landlord pays the expenses and the tenant pays flat rent.", "In a net lease, the tenant pays rent plus expenses.", "In a graduated lease, rent steps up over time."],
    w: "In a percentage lease, all or part of the rent is based on the tenant's gross receipts. It's typical of shopping centers." },
  { id: "le5", t: "leases", s: "POR2 p. 197",
    q: "A landlord stops providing water and air conditioning, and the unit becomes unusable. The tenant may claim:",
    c: ["Constructive eviction", "Tenancy at sufferance", "Accession", "Actual eviction"],
    n: ["", "That's a holdover tenant situation.", "Accession concerns fixtures left behind.", "Actual eviction is a physical removal by the landlord."],
    w: "When a landlord's failure to provide essential services makes the premises unusable, the tenant may terminate under constructive eviction." },
  { id: "le6", t: "leases", s: "POR2 p. 197", tx: true,
    q: "A Texas client asks their agent to write a lease-purchase agreement. The agent should:",
    c: ["Refer the client to an attorney", "Use a TREC lease form", "Write it in Special Provisions", "Use a seller financing addendum"],
    n: ["", "The course says license holders are prohibited from writing this type of agreement.", "Adding it there would be the unauthorized practice of law.", "This doesn't create a lease-purchase."],
    w: "Texas license holders are prohibited from writing lease-purchase agreements for clients, so they should refer clients to an attorney." },

  /* fair housing */
  { id: "fh1", t: "fairhousing", s: "POR2 p. 245",
    q: "Which law prohibits racial discrimination in property transactions with no exceptions?",
    c: ["Civil Rights Act of 1866", "Fair Housing Act of 1968", "Americans with Disabilities Act", "Equal Credit Opportunity Act"],
    n: ["", "The 1968 Act has some exemptions.", "The ADA covers disability and public accommodations.", "ECOA covers credit decisions."],
    w: "The 1866 Act applies to race with no exceptions, as confirmed in Jones v. Alfred H. Mayer Co. (1968)." },
  { id: "fh2", t: "fairhousing", s: "POR2 p. 245",
    q: "Which of the following is NOT a protected class under the federal Fair Housing Act?",
    c: ["Age", "Familial status", "Sex", "National origin"],
    n: ["", "Familial status was added in 1988.", "Sex was added in 1974.", "National origin was included in 1968."],
    w: "The course states plainly that age is not a protected category under this law." },
  { id: "fh3", t: "fairhousing", s: "POR2 p. 246",
    q: "An agent urges owners to sell quickly because \"people of a different religion are moving in.\" This is:",
    c: ["Blockbusting", "Steering", "Redlining", "Puffing"],
    n: ["", "Steering directs buyers toward or away from areas.", "Redlining is a lending practice.", "Puffing is harmless sales talk."],
    w: "Persuading owners to sell, for profit, by invoking a protected class is blockbusting, also called panic peddling." },
  { id: "fh4", t: "fairhousing", s: "POR2 p. 172",
    q: "Showing a buyer homes only in certain neighborhoods because of the buyer's national origin is:",
    c: ["Steering", "Blockbusting", "Puffing", "A reasonable accommodation"],
    n: ["", "Blockbusting targets owners, urging them to sell.", "Puffing is opinion-based marketing.", "A reasonable accommodation relates to disability."],
    w: "Directing a buyer to a different area based on a protected class is steering. TRELA §1101.652(b)(32) treats it as grounds for discipline." },
  { id: "fh5", t: "fairhousing", s: "POR2 p. 245–246",
    q: "An owner of a four-unit building who lives in one unit may be exempt from parts of the 1968 Act. If a license holder lists the units:",
    c: ["The license holder must still comply fully", "The exemption covers the license holder too", "Only advertising rules apply", "TREC can grant a waiver"],
    n: ["", "The course says license holders must always comply.", "The license holder must comply with all of it, not just the advertising rules.", "TREC has no waiver process for this."],
    w: "There are some exceptions to the 1968 law, but real estate license holders must always comply." },
  { id: "fh6", t: "fairhousing", s: "POR2 p. 247",
    q: "Which advertising approach best follows fair housing guidance?",
    c: ["Describe the property, not the ideal occupant", "Mention the kind of neighbors who would \"fit in\"", "State \"adults preferred\" to keep it quiet", "List nearby houses of worship to attract a group"],
    n: ["", "\"Fit in\" is a trigger phrase in the course's example scenario.", "That implies a familial status preference.", "That can signal a religious preference."],

        "A <b>planned unit development (PUD)</b> combines individually owned lots with shared common facilities such as pools and greenbelts."] },
  { h: "Environmental hazards", s: "POR2 p. 99–102",
    b: ["<b>Lead-based paint</b>: the seller provides the lead paint disclosure for homes built <b>before 1978</b>. Buyers may waive the lead inspection.",
        "<b>Radon</b> is a naturally occurring, colorless, odorless gas that enters through foundations. Lowering it is called mitigation.",
        "<b>Asbestos</b> is most dangerous when disturbed or removed, because the dust is hazardous.",
        "<b>CERCLA</b> (Superfund, 1980) pays for and enforces cleanup of contaminated sites."] },
  { h: "Eminent domain after Kelo", s: "POR1 p. 136",
    b: ["In <b>Kelo v. City of New London</b> (2005), the U.S. Supreme Court allowed eminent domain for economic redevelopment. Texas responded by limiting eminent domain for redeveloping blighted areas. In Texas, the power is commonly granted to private parties such as utility companies."] }
]);
addLessons("contracts", [
  { h: "Offers and acceptance", s: "PCF p. 28",
    b: ["Acceptance must be unconditional. <b>Any change, however small, makes it a counteroffer.</b>",
        "An offeror may withdraw an offer any time <b>before acceptance</b>. The death or bankruptcy of either party before acceptance ends the offer by operation of law.",
        "When there are several offers, the broker presents <b>all of them promptly</b> unless the seller instructs otherwise."] },
  { h: "Ending or changing a contract", s: "PCF p. 16; CON p. 67, 94",
    b: ["Contracts can end by mutual agreement, partial performance the other party accepts, substantial performance, <b>impossibility</b> (such as the death of a party to a personal services contract), operation of law, or breach.",
        "<b>Novation</b> substitutes a new contract (or a new party) for the old one. <b>Mutual rescission</b> returns both parties to their pre-contract positions.",
        "After an assignment, the assignor remains <b>secondarily liable</b> unless released."] },
  { h: "Contract for deed", s: "CON p. 114",
    b: ["In a contract for deed, the seller keeps <b>legal title</b> until all payments are made, and the buyer holds <b>equitable title</b>. Option agreements and contracts for deed have no TREC forms and should be prepared by an attorney."] }
]);
addLessons("title", [
  { h: "Deed requirements and clauses", s: "POR1 p. 142–143",
    b: ["A valid deed needs, among other things, recited consideration, <b>words of conveyance</b> (the granting clause), a <b>legal description</b>, the grantor's signature, and <b>delivery</b>.",
        "The <b>habendum</b> (\"to have and to hold\") clause describes the estate being granted. It's rarely used today.",
        "A <b>restriction</b> limits the new owner and binds all future owners. A <b>reservation</b> keeps rights for the grantor, such as minerals. If a deed reserves no minerals, the grantor's minerals pass to the grantee (p. 145)."] },
  { h: "Recording and the chain of title", s: "POR1 p. 134, 143",
    b: ["Recording <b>isn't required for a valid deed</b>, but it gives <b>constructive notice</b> to the world. Deeds are recorded with the <b>County Clerk</b> in the county where the land is located.",
        "The <b>chain of title</b> lists all recorded owners back to the sovereignty of the soil."] },
  { h: "Wills and adverse possession", s: "POR1 p. 136–137",
    b: ["A formal will is typed, signed, dated, and witnessed by two people. Texas also accepts a <b>holographic</b> will, written entirely in the testator's own hand.",
        "<b>Adverse possession</b> requires hostile, actual, and continuous occupation for the statutory period. Texas has 3-, 5-, 10-, and 25-year periods, and <b>10 years</b> is the one most often applied."] }
]);
addLessons("finance", [
  { h: "The Fed and the secondary market", s: "FIN p. 12, 27–28, 37, 114",
    b: ["The Fed's three tools are <b>open market operations</b> (the most flexible and most often used), the <b>discount rate</b> (what Reserve Banks charge institutions for short-term loans), and <b>reserve requirements</b>.",
        "Loans that meet Fannie Mae and Freddie Mac standards are <b>conforming</b>. Loans a lender keeps are <b>portfolio</b> loans. <b>Ginnie Mae</b> pioneered the mortgage-backed security."] },
  { h: "Loan clauses and mortgage types", s: "FIN p. 142, 166, 168",
    b: ["<b>Alienation (due-on-sale)</b>: the lender can call the loan if the property is sold. <b>Release</b>: part of the property is freed as part of the loan is paid, which is common with <b>blanket</b> mortgages covering several lots. <b>Subordination</b>: a lender lets a later loan take priority.",
        "<b>Package mortgage</b>: real plus personal property. <b>Wraparound</b>: seller financing in a junior position that preserves the low rate on the original loan. <b>Budget</b> payments include PITI, with taxes and insurance held in escrow.",
        "<b>Private mortgage insurance (PMI)</b> protects the lender against default on a conventional loan."] },
  { h: "Consumer protection laws", s: "FIN p. 42, 45, 57, 73",
    b: ["<b>RESPA</b> prohibits kickbacks and undisclosed referral fees.",
        "Under <b>Regulation Z</b>, an ad using a triggering term must also state the down payment, the repayment terms, and the <b>APR</b>.",
        "The <b>Community Reinvestment Act</b> prohibits <b>redlining</b>, which is refusing to lend in an area because of its location.",
        "<b>Negative amortization</b> means the loan balance grows because unpaid interest is added to it."] },
  { h: "When borrowers can't pay", s: "FIN p. 138, 264",
    b: ["A <b>deed in lieu</b> of foreclosure voluntarily deeds the property to the lender in exchange for release from the loan. If a foreclosure sale falls short, the lender may sue for a <b>deficiency judgment</b>."] }
]);
addLessons("appraisal", [
  { h: "Principles of value", s: "POR2 p. 10–15",
    b: ["<b>Substitution</b>: value is influenced by the cost of a comparable substitute. <b>Contribution</b>: a feature is worth what it adds to value, not what it cost. <b>Conformity</b>: value is maximized when nearby homes are reasonably similar. <b>Regression</b>: an over-improved home is pulled down by its neighbors. <b>Anticipation</b>: expected future benefits affect today's price."] },
  { h: "Income tools", s: "POR2 p. 23",
    b: ["<b>Gross rent multiplier</b> (GRM):<span class=\"fgrid\"><span class=\"formula\">GRM = sales price ÷ monthly rent</span><span class=\"formula\">Value = GRM × subject's monthly rent</span></span>",
        "<b>IRV</b>: <span class=\"formula\">Value = net income ÷ rate</span> For example, $75,000 ÷ 0.08 = $937,500."] },
  { h: "Who regulates appraisers", s: "POR2 p. 26",
    b: ["<b>FIRREA</b> (1989) moved appraiser regulation to the states. Texas appraisers are licensed by the <b>Texas Appraiser Licensing and Certification Board (TALCB)</b>."] }
]);
addLessons("leases", [
  { h: "Texas landlord–tenant rules", s: "POR2 p. 198", tx: true,
    b: ["The landlord must mail the security deposit, with an itemized accounting of any deductions, <b>postmarked within 30 days</b> after the lease ends.",
        "There must be at least one <b>smoke alarm in each bedroom</b>, plus one on each level. Fire extinguishers aren't required, but if the landlord provides them, the landlord must inspect and repair them."] },
  { h: "Property management", s: "POR2 p. 227",
    b: ["A property manager is usually a <b>general agent</b> of the owner, hired under a <b>management agreement</b> (the manager's employment contract). The primary duty is to <b>maximize income while preserving the property's value</b>."] }
]);
addLessons("fairhousing", [
  { h: "Disability and senior housing", s: "POR2 p. 248–250",
    b: ["A landlord must allow <b>reasonable modifications</b> at the <b>tenant's expense</b>, and may require the unit to be restored when reasonable.",
        "Housing for older persons may be exempt from the familial status rules if it is occupied solely by people 62 or older, or if at least 80% of occupied units have at least one person aged 55 or older."] },
  { h: "Filing a complaint", s: "POR2 p. 250–251",
    b: ["Complaints can go to <b>HUD within one year</b>, to the <b>Texas Workforce Commission Civil Rights Division within 365 days</b>, or to court <b>within two years</b>.",
        "Fair housing violations are civil, so there are <b>no criminal penalties</b>.",
        "The <b>Texas Fair Housing Act</b> (1989) recognizes the same protected classes as federal law."] }
]);
addLessons("trela", [
  { h: "Enforcement", s: "POR2 p. 120, 170, 173, 178, 183",
    b: ["The <b>administrative penalty</b> can be up to <b>$5,000 per violation</b>, and each day a violation continues can count separately.",
        "Willfully violating TRELA is a <b>Class A misdemeanor</b>.",
        "Prohibited conduct includes <b>commingling</b> other people's money with your own. TREC must suspend or revoke a license for the <b>unauthorized practice of law</b> (§1101.654).",
        "TREC is subject to the <b>Texas Sunset Act</b>."] },
  { h: "Other license types and definitions", s: "POR2 p. 113, 150–151",
    b: ["A <b>residential rental locator</b> locates apartment units for prospective tenants for compensation. An <b>easement or right-of-way agent</b> holds a certificate of registration.",
        "<b>Broker</b> license: 900 hours of education and 4 years of active sales agent experience within the past 5 years.",
        "The exam must be passed <b>within one year</b> after the application is filed."] }
]);
addLessons("agency", [
  { h: "Texas agency relationships", s: "AG p. 17, 20, 41",
    b: ["TRELA allows four relationships: <b>seller agency, buyer agency, subagency, and intermediary</b>. Texas has <b>no implied agency</b>, so by default a person is a <b>customer</b>.",
        "A <b>subagent</b> represents the seller through a cooperative agreement with the listing broker but isn't associated with that broker. The <b>broker owns all listings</b>."] },
  { h: "Types of listings", s: "AG p. 83–88",
    b: ["<b>Open</b>: several brokers, and the seller may sell without owing a fee. Open listings lead to <b>procuring cause</b> disputes.",
        "<b>Exclusive agency</b>: one broker, but the seller can sell on their own without owing compensation.",
        "<b>Exclusive right to sell</b>: the broker is paid <b>no matter who finds the buyer</b>.",
        "<b>Net listing</b>: legal in Texas but discouraged. Take one only when the principal insists and knows current market values."] },
  { h: "Advertising rules", s: "AG p. 57–58, 66",
    b: ["Every ad must show the name of the license holder or team <b>and the broker's name</b>. The broker's name must be at least <b>half the size</b> of the largest agent or team contact information.",
        "A team name can't suggest an independent brokerage, so terms like \"brokerage,\" \"company,\" and \"associates\" aren't allowed.",
        "The IABS and Consumer Protection Notice (CN 1-5) must be on the license holder's business website, but they don't have to appear in every social media post."] },
  { h: "Unlicensed assistants", s: "AG p. 175–176",
    b: ["An unlicensed assistant can't do anything that requires a license, including <b>showing property</b> or <b>soliciting</b> (telemarketing for appointments)."] }
]);
addLessons("forms", [
  { h: "Key addenda and notices", s: "PCF p. 24, 38, 59, 210; CON p. 34",
    b: ["<b>Third Party Financing Addendum</b>: financing is approved when <b>Buyer Approval</b> (credit) and <b>Property Approval</b> (appraisal and so on) are both obtained. Time is of the essence for its approval paragraph.",
        "<b>Seller's Disclosure</b> (Paragraph 7B): if the notice hasn't been delivered, the buyer may terminate <b>within 7 days after receiving it</b>.",
        "Federal law requires the <b>lead-based paint</b> addendum for homes built before 1978.",
        "TREC has two temporary leases, each for <b>no more than 90 days</b>: the <b>Buyer's</b> lease (before closing) and the <b>Seller's</b> lease (after closing).",
        "TREC has no forms for co-ops, commercial transactions, or mobile homes."] },
  { h: "What license holders may and may not do", s: "CON p. 16 (TREC Rule 537.11)",
    b: ["<b>May</b>: fill in blanks, add factual statements and business details, strike text as directed in writing, and explain the choices on a form without giving legal advice.",
        "<b>May not</b>: draft clauses that affect legal rights, such as <b>escalation</b>, appraisal, or other contingency clauses, or discourage anyone from hiring a lawyer.",
        "When a transaction involves unusual matters, advise the principals to <b>consult a lawyer</b>."] }
]);
addLessons("txproperty", [
  { h: "Homestead details", s: "POR1 p. 34",
    b: ["<b>Urban</b>: up to <b>10 contiguous acres</b>. <b>Rural</b>: up to <b>100 acres</b> for an individual or <b>200 acres</b> for a family, and the tracts don't have to be contiguous. There is <b>no value limit</b>.",
        "Protection is written into the Texas Constitution. It is <b>automatic</b> and <b>can't be waived</b>, and both spouses must sign to sell or encumber the homestead.",
        "A homestead can be lost for unpaid mechanic's liens, owners' association fees, or a home equity loan."] },
  { h: "Home equity lending", s: "FIN p. 55–56",
    b: ["The equity loan consumer disclosure must be given <b>at least 12 days before</b> closing.",
        "A home equity line of credit can't exceed <b>80% of market value</b> minus other loans on the home."] }
]);
addLessons("disclosures", [
  { h: "Exemptions and defenses", s: "AG p. 68, 225, 227; CON p. 34",
    b: ["Eleven kinds of sales are exempt from the Seller's Disclosure Notice, including court-ordered and foreclosure sales and sales by a bankruptcy trustee. <b>Every seller must still disclose known material defects.</b>",
        "TREC form <b>55-0</b> meets the minimum requirements. §5.008 didn't expand what sellers must disclose.",
        "One DTPA statutory defense covers relying on false information from government records that the agent didn't know was false and couldn't reasonably have known.",
        "Casual phrases like \"no problem\" or \"this is a small repair\" can lead to DTPA claims."] }
]);

QUESTIONS.push(
  /* property */
  { id: "pr7", t: "property", s: "POR1 p. 11", q: "The fact that a buyer must go to the land, because land can't be moved, describes:", c: ["Immobility", "Indestructibility", "Scarcity", "Fixity"], n: ["", "Indestructibility means land can't be destroyed.", "Scarcity is an economic characteristic.", "Fixity is an economic idea about long-term investment."], w: "Immobility means land cannot be moved, so the owner must go to the land." },
  { id: "pr8", t: "property", s: "POR1 p. 11", q: "Land may flood or be dug into a crater, but it still exists. This describes:", c: ["Indestructibility", "Immobility", "Appreciation", "Accession"], n: ["", "Immobility is about land not moving.", "Appreciation is an increase in value.", "Accession relates to fixtures left behind."], w: "Indestructibility, or durability, means outside forces cannot destroy land." },
  { id: "pr9", t: "property", s: "POR1 p. 31", q: "Which is NOT part of an owner's bundle of rights?", c: ["The right to ignore zoning laws", "The right to exclude others", "The right to lease the property", "The right to pass it to heirs"], n: ["", "Excluding others is a core right.", "Leasing is part of the bundle.", "Passing property to heirs is part of the bundle."], w: "The bundle includes possessing, using, excluding, selling, leasing, mortgaging, and passing to heirs. Government police power, such as zoning, still applies." },
  { id: "pr10", t: "property", s: "POR1 p. 19", q: "An owner leases the space above her building to a cell tower company. This shows that air rights:", c: ["Can be leased, sold, or mortgaged separately", "Belong to the federal government", "Can't be separated from the surface", "Exist only for condominiums"], n: ["", "Owners hold air rights above the surface.", "The course says they can be separated.", "Condos are only one example."], w: "As an interest in land, air rights can be leased, sold, or mortgaged. Cell tower and billboard leases are examples." },
  { id: "pr11", t: "property", s: "POR1 p. 23", q: "A tenant leaves trade fixtures behind after the lease expires. They become the landlord's property through:", c: ["Accession", "Annexation", "Severance", "Escheat"], n: ["", "Annexation is attaching personal property to land.", "Severance is removing a fixture.", "Escheat is the state taking title."], w: "Trade fixtures not removed before the lease expires become the landlord's property by accession." },
  { id: "pr12", t: "property", s: "POR1 p. 23", q: "A custom-measured fireplace screen is installed in one home. A one-size-fits-all screen sits in another. Which test makes the custom screen more likely a fixture?", c: ["Adaptation to the property", "Cost of the item", "Age of the home", "Who paid the property taxes"], n: ["", "Cost isn't one of the tests.", "Age doesn't matter.", "Taxes don't decide fixture status."], w: "Adaptation looks at how the item fits the property. A custom-fitted item suggests it is permanent." },

  /* estates */
  { id: "es7", t: "estates", s: "POR1 p. 37", q: "Which is an example of a specific lien?", c: ["A mortgage", "A judgment lien", "An IRS tax lien", "A general creditor's claim"], n: ["", "A judgment lien is a general lien.", "An IRS lien is a general lien.", "A general claim isn't a specific lien."], w: "A specific lien attaches to particular named property. A mortgage is the classic example." },
  { id: "es8", t: "estates", s: "POR1 p. 37", q: "A lien that attaches to all of a debtor's non-exempt property is a:", c: ["General lien", "Specific lien", "Mechanic's lien", "Easement"], n: ["", "A specific lien attaches to named property.", "A mechanic's lien is specific to the improved property.", "An easement isn't a lien."], w: "General liens, such as judgments and IRS liens, attach to all of the debtor's non-exempt property." },
  { id: "es9", t: "estates", s: "POR1 p. 38", q: "After tax liens, the priority of liens is generally determined by:", c: ["The order in which they were recorded", "The dollar amount of each lien", "Which creditor is a bank", "The order the debts were created"], n: ["", "Size doesn't set priority.", "Lender type doesn't set priority.", "Recording, not when the debt was created, sets priority."], w: "Liens recorded earlier take priority over liens recorded later, after tax liens." },
  { id: "es10", t: "estates", s: "POR1 p. 38", q: "A creditor files an abstract of judgment in a county. This creates:", c: ["A lien on all the debtor's real property in that county", "A lien only on the debtor's homestead", "An automatic foreclosure", "A transfer of title to the creditor"], n: ["", "It isn't limited to the homestead.", "Filing it doesn't foreclose.", "Title doesn't transfer."], w: "Filing an abstract of judgment creates a lien on all of the debtor's real property in that county." },
  { id: "es11", t: "estates", s: "POR1 p. 67", q: "Timeshare owners typically hold title as:", c: ["Tenants in common", "Joint tenants", "Owners in severalty", "Life tenants"], n: ["", "Joint tenancy requires survivorship and the four unities.", "Severalty means one owner.", "A life estate is measured by a life."], w: "Timeshare owners own the property as tenants in common, with exclusive use for set days." },
  { id: "es12", t: "estates", s: "POR1 p. 67", q: "A buyer of a cooperative unit receives:", c: ["Stock in the corporation and a proprietary lease", "A deed to the unit", "A life estate", "A mortgage on the building"], n: ["", "A co-op owner doesn't own the unit itself.", "No life estate is created.", "The buyer doesn't get a mortgage on the building."], w: "In a co-op, a corporation owns the building. Buyers purchase stock and receive a proprietary lease." },
  { id: "es13", t: "estates", s: "POR1 p. 67", q: "How are condominium property taxes handled?", c: ["Each unit is taxed separately; common areas aren't taxed separately", "The association pays one tax bill for the building", "Common areas are taxed to the developer", "Condos are tax-exempt"], n: ["", "Units are taxed individually.", "Common areas aren't taxed separately.", "They aren't exempt."], w: "Each condo unit is separately owned and taxed. Common areas are not taxed separately from the units." },
  { id: "es14", t: "estates", s: "POR1 p. 67", q: "A condominium manager's primary responsibility is to:", c: ["Preserve property values", "Maximize rental income", "Sell units for the developer", "Collect property taxes"], n: ["", "That's the usual goal of an income property manager.", "That isn't the manager's role.", "Taxes are billed per unit."], w: "Condominium managers work for resident owners, and their primary responsibility is to preserve property values." },
  { id: "es15", t: "estates", s: "POR1 p. 31", q: "Land is given to a church on the condition that it be used for a school. The church builds a parking lot instead and could lose the land. The church held a:", c: ["Fee simple defeasible", "Fee simple absolute", "Life estate", "Leasehold"], n: ["", "An absolute fee can't be lost this way.", "A life estate is measured by a life.", "A leasehold is possession without ownership."], w: "A fee simple defeasible can be lost if a stated condition is violated, and ownership reverts." },
  { id: "es16", t: "estates", s: "POR1 p. 32", q: "When a life estate ends and ownership goes back to the original grantor, the grantor held a:", c: ["Reversionary interest", "Remainder interest", "Leasehold estate", "Easement in gross"], n: ["", "A remainder goes to a third party.", "A leasehold is a rental interest.", "An easement is a use right."], w: "At the end of a life estate, ownership returns to the original grantor, who held a reversionary interest." },

  /* legal */
  { id: "lg1", t: "legal", s: "POR1 p. 49", q: "One acre contains how many square feet?", c: ["43,560", "640", "5,280", "36,000"], n: ["", "640 is the number of acres in a section.", "5,280 is the number of feet in a mile.", "This isn't the conversion."], w: "One acre of land contains 43,560 square feet." },
  { id: "lg2", t: "legal", s: "POR1 p. 54", q: "In the government survey system, a section contains:", c: ["640 acres", "36 acres", "43,560 acres", "160 acres"], n: ["", "36 is the number of sections in a township.", "That's the square feet in one acre.", "That's a quarter section."], w: "Each section is one square mile, containing 640 acres." },
  { id: "lg3", t: "legal", s: "POR1 p. 54", q: "A township contains how many sections?", c: ["36", "640", "16", "24"], n: ["", "640 is the acres in a section.", "This isn't the number.", "This isn't the number."], w: "Each township has 36 one-square-mile sections." },
  { id: "lg4", t: "legal", s: "POR1 p. 49", q: "A metes and bounds description starts and ends at the:", c: ["Point of beginning", "Principal meridian", "Recorded plat", "Section corner"], n: ["", "Meridians are part of the government survey system.", "Plats are used for lot and block.", "Section corners are part of the government survey system."], w: "Metes and bounds uses calls from a point of beginning around the boundary and back to it." },
  { id: "lg5", t: "legal", s: "POR1 p. 52", tx: true, q: "According to the course, which land description method is used in Texas?", c: ["Metes and bounds", "The rectangular survey only", "Street address only", "Township and range only"], n: ["", "The course lists Texas with the metes and bounds states.", "A street address isn't a legal description.", "Township and range belongs to the rectangular survey."], w: "The course lists Texas among the states that use the metes and bounds method." },
  { id: "lg6", t: "legal", s: "POR1 p. 142", q: "Which would NOT be an acceptable legal description in a deed?", c: ["The street address", "Metes and bounds", "Lot and block in a recorded subdivision", "A government survey description"], n: ["", "Metes and bounds is an accepted method. It traces the boundaries from a point of beginning.", "Lot and block, tied to a recorded plat, is an accepted method.", "The government survey system is an accepted method of legal description."], w: "A legal description must let someone locate the land on the ground. A street address isn't sufficient." },
  { id: "lg7", t: "legal", s: "POR1 p. 49", q: "How many square feet are in 3 acres?", c: ["130,680", "43,560", "87,120", "1,920"], n: ["", "That's one acre.", "That's two acres.", "That's 3 × 640."], w: "3 × 43,560 = 130,680 square feet." },
  { id: "lg8", t: "legal", s: "POR1 p. 56", tx: true, q: "By default, a Texas title policy does NOT protect against:", c: ["Boundary discrepancies and encroachments", "Forged deeds in the chain of title", "Any recorded liens", "Unknown heirs' claims"], n: ["", "Forgery is a typical title risk.", "This isn't the default exclusion described.", "This isn't the exclusion the course describes."], w: "Texas title policies don't cover boundary discrepancies, shortages in area, or encroachments by default. Extra coverage is available for a fee." },
  { id: "lg9", t: "legal", s: "POR1 p. 52", q: "The Government Survey System, used after the Land Ordinance of 1785, is also called the:", c: ["Rectangular Survey System", "Metes and bounds system", "Lot and block system", "Torrens system"], n: ["", "Metes and bounds predates it.", "Lot and block uses recorded plats.", "Torrens is a title registration system."], w: "Surveyors used the Government (Rectangular) Survey System for lands west of the Appalachians after 1785." },

  /* landuse */
  { id: "lu6", t: "landuse", s: "POR1 p. 29", q: "The required space between the lot line and the building line is the:", c: ["Setback", "Buffer zone", "Easement", "Variance"], n: ["", "A buffer zone separates land uses.", "An easement is a right of use.", "A variance is a permitted exception."], w: "A setback is the required distance between the lot line and the building line, set by zoning or deed restrictions." },
  { id: "lu7", t: "landuse", s: "POR1 p. 29", q: "Apartments placed between single-family homes and a shopping center serve as a:", c: ["Buffer zone", "Setback", "Nonconforming use", "Spot zone"], n: ["", "A setback is distance from the lot line.", "A nonconforming use predates rezoning.", "That isn't what the course describes."], w: "A buffer zone is a transitional use between incompatible land uses." },
  { id: "lu8", t: "landuse", s: "POR2 p. 99", q: "A lead-based paint disclosure is required for residential properties built before:", c: ["1978", "1968", "1988", "2000"], n: ["", "1968 is the year of the Fair Housing Act.", "Too late. The cutoff is homes built before 1978.", "Too late. Only homes built before 1978 need the disclosure."], w: "Use the lead paint disclosure for properties built before 1978. The seller provides it." },
  { id: "lu9", t: "landuse", s: "POR2 p. 99", q: "A colorless, odorless gas from decaying radioactive material that enters homes through the foundation is:", c: ["Radon", "Asbestos", "Carbon monoxide", "Urea-formaldehyde"], n: ["", "Asbestos is a fibrous material.", "The course describes radon here.", "That's an insulation material."], w: "Radon is a naturally occurring, colorless, odorless gas that enters through foundations." },
  { id: "lu10", t: "landuse", s: "POR2 p. 99", q: "Asbestos is most hazardous when:", c: ["It is disturbed or removed, releasing dust", "It is painted over", "It is left undisturbed in good condition", "Humidity is low"], n: ["", "Painting over it doesn't release dust.", "Undisturbed material is less of a problem.", "Humidity isn't the issue."], w: "Problems arise during removal because asbestos dust can be extremely hazardous." },
  { id: "lu11", t: "landuse", s: "POR2 p. 102", q: "CERCLA (the Superfund law, 1980) was designed to:", c: ["Clean up sites contaminated with hazardous substances", "Require lead paint disclosures", "Regulate fair housing advertising", "Set appraisal standards"], n: ["", "That's a separate disclosure rule.", "That's fair housing law.", "That's FIRREA and appraisal rules."], w: "CERCLA was designed to clean up contaminated sites and recover damages." },
  { id: "lu12", t: "landuse", s: "POR1 p. 136", q: "In Kelo v. City of New London (2005), the U.S. Supreme Court held that:", c: ["Eminent domain may be used for economic redevelopment", "Eminent domain requires blight", "Cities can't transfer condemned land to private developers", "Zoning is a taking"], n: ["", "The Court ruled it didn't matter whether the area was blighted.", "The Court allowed the transfer.", "The case wasn't about zoning."], w: "The Court upheld eminent domain for redevelopment. Texas later limited it for blighted-area redevelopment." },
  { id: "lu13", t: "landuse", s: "POR2 p. 95", q: "Which is an exercise of police power?", c: ["Health and fire codes", "Condemning land for a highway", "Taking land of someone who died without heirs", "Collecting property taxes"], n: ["", "That's eminent domain.", "That's escheat.", "That's taxation."], w: "Police power regulates use. Zoning, wetlands laws, and health and fire codes are examples." },
  { id: "lu14", t: "landuse", s: "POR2 p. 24", q: "A subdivision with individually owned lots plus shared pools, parks, and greenbelts is a:", c: ["Planned unit development (PUD)", "Cooperative", "Timeshare", "Buffer zone"], n: ["", "In a co-op, a corporation owns the building.", "A timeshare is interval ownership.", "A buffer zone is a land use transition."], w: "A PUD includes individually owned lots plus shared ownership of common facilities." },

  /* contracts */
  { id: "co8", t: "contracts", s: "PCF p. 28", q: "A seller accepts an offer but changes the closing date by one day. Legally this is:", c: ["A counteroffer", "An acceptance", "A binding contract with an amendment", "A void contract"], n: ["", "Acceptance must be unconditional.", "No contract exists yet.", "Nothing illegal makes it void."], w: "Any change to an offer, however trivial, turns it into a counteroffer." },
  { id: "co9", t: "contracts", s: "PCF p. 28", q: "When may a buyer withdraw an offer?", c: ["Any time before the offeree accepts it", "Only after 24 hours", "Never, once it's signed", "Only with the listing broker's approval"], n: ["", "There's no waiting period.", "An offer can be withdrawn before acceptance.", "No approval is needed."], w: "An offeror may withdraw an offer at any time before the offeree accepts it." },
  { id: "co10", t: "contracts", s: "PCF p. 28", q: "The seller dies before accepting the buyer's offer. The offer:", c: ["Terminates by operation of law", "Passes to the seller's heirs to accept", "Becomes a binding contract", "Remains open for 30 days"], n: ["", "Heirs can't accept a terminated offer.", "There was no acceptance.", "No such rule exists."], w: "The death or bankruptcy of either party before acceptance terminates the offer by operation of law." },
  { id: "co11", t: "contracts", s: "PCF p. 28", q: "A listing agent receives a second offer after presenting the first but before the seller responds. The agent must:", c: ["Present the second offer promptly", "Hold it until the seller decides on the first", "Return it to the buyer", "Present it only if it's higher"], n: ["", "All offers must be presented promptly.", "Present it unless the seller instructs otherwise.", "Price doesn't decide whether it's presented."], w: "All offers must be presented to the seller promptly unless the seller instructs otherwise. No offer has priority." },
  { id: "co12", t: "contracts", s: "CON p. 67", q: "Substituting a new contract for an existing one, possibly with new parties, is called:", c: ["Novation", "Assignment", "Rescission", "Accession"], n: ["", "An assignment leaves the assignor secondarily liable.", "Rescission undoes a contract.", "Accession relates to fixtures."], w: "A novation occurs when a new contract is substituted for an existing one." },
  { id: "co13", t: "contracts", s: "CON p. 94", q: "Mutual rescission aims to:", c: ["Restore the parties to their pre-contract status", "Force the sale to close", "Award treble damages", "Transfer the contract to new parties"], n: ["", "That's specific performance.", "That's a DTPA remedy.", "That's assignment or novation."], w: "Mutual rescission restores both parties to where they were before the contract." },
  { id: "co14", t: "contracts", s: "CON p. 114", q: "In a contract for deed, the buyer holds:", c: ["Equitable title while the seller keeps legal title", "Legal title from day one", "Only a leasehold", "No interest until the final payment"], n: ["", "The seller retains legal title.", "The buyer has an ownership interest, not just a lease.", "The buyer holds an equitable interest."], w: "The seller keeps legal title until all payments are made. The buyer acquires equitable title." },
  { id: "co15", t: "contracts", s: "PCF p. 16", q: "A contractor finishes a remodel but skips minor paint touch-ups. The contractor has most likely provided:", c: ["Substantial performance", "Partial performance", "No performance", "A novation"], n: ["", "Partial performance means leaving well short, such as moving out early.", "The job is essentially done.", "No new contract was formed."], w: "The job was substantially completed. Payment is due, possibly with an adjustment." },
  { id: "co16", t: "contracts", s: "PCF p. 16", q: "A personal services contract ends because one party dies. This is termination by:", c: ["Impossibility", "Breach", "Mutual agreement", "Novation"], n: ["", "No one failed to perform.", "Nobody agreed to end it.", "No substitute contract exists."], w: "Performance can become impossible, such as when a party to a personal services contract dies." },
  { id: "co17", t: "contracts", s: "CON p. 65", q: "Ordering a meal at a restaurant creates what kind of contract?", c: ["Implied", "Express", "Unilateral", "Void"], n: ["", "No terms were spoken or written.", "Both sides have duties.", "It's perfectly legal."], w: "A contract created by behavior is implied." },
  { id: "co18", t: "contracts", s: "CON p. 67", q: "Once a real estate sale has closed, the sales contract is:", c: ["Executed", "Executory", "Voidable", "Unilateral"], n: ["", "Executory describes the period before closing.", "Nothing makes it voidable.", "Both parties had duties."], w: "From the effective date to closing a contract is executory. At closing it becomes fully executed." },
  { id: "co19", t: "contracts", s: "CON p. 67", q: "After assigning a contract, the original party (the assignor):", c: ["Remains secondarily liable unless released", "Has no further liability", "Remains primarily liable", "Must get TREC approval"], n: ["", "They aren't released automatically.", "The assignee takes primary liability.", "TREC has no role in this."], w: "The assignee assumes primary liability, and the assignor remains secondarily liable unless released." },
  { id: "co20", t: "contracts", s: "CON p. 124", q: "When presenting an offer, the listing agent prepares a net sheet to:", c: ["Estimate the seller's proceeds under that offer", "Show the buyer's loan approval", "Calculate property taxes for next year", "Recommend accepting the offer"], n: ["", "That comes from the lender.", "That isn't its purpose.", "The course says preparing it doesn't suggest accepting."], w: "A net sheet estimates what the seller will net if the offer is accepted as presented." },

  /* title */
  { id: "ti7", t: "title", s: "POR1 p. 143", q: "Recording a deed:", c: ["Gives constructive notice but isn't required for validity", "Is required for the deed to be valid", "Transfers title by itself", "Is done with TREC"], n: ["", "The course says recording isn't required for a valid deed.", "Delivery and acceptance transfer title.", "Deeds are recorded with the County Clerk."], w: "Recording isn't required for a valid deed, but it gives constructive notice to the world." },
  { id: "ti8", t: "title", s: "POR1 p. 143", q: "Where is a Texas deed recorded?", c: ["The County Clerk's office in the county where the land is located", "The Secretary of State in Austin", "TREC", "The buyer's lender"], n: ["", "This isn't where deeds are recorded.", "TREC licenses agents; it doesn't record deeds.", "Lenders don't record public records themselves."], w: "Deeds are recorded in the County Clerk's office in the county where the land is located." },
  { id: "ti9", t: "title", s: "POR1 p. 143", q: "A seller deeds land but keeps the mineral rights. This is a:", c: ["Reservation", "Restriction", "Encroachment", "Habendum"], n: ["", "A restriction limits the buyer's use.", "An encroachment is an intrusion.", "A habendum states the estate granted."], w: "A reservation keeps rights for the grantor, such as minerals or an access easement." },
  { id: "ti10", t: "title", s: "POR1 p. 143", q: "A legal deed restriction limiting the property to residential use:", c: ["Binds all future owners indefinitely", "Ends when the property sells", "Lasts only five years", "Binds only the first buyer"], n: ["", "It runs with the land.", "No five-year limit applies.", "It binds all future owners."], w: "As long as they're legal, restrictions last indefinitely and apply to all future owners." },
  { id: "ti11", t: "title", s: "POR1 p. 134", q: "A list of all recorded owners back to the sovereignty of the soil is the:", c: ["Chain of title", "Title commitment", "Abstract of judgment", "Survey"], n: ["", "A commitment is a title insurer's promise to insure.", "An abstract of judgment is a lien filing.", "A survey shows boundaries."], w: "The chain of title is a history of all recorded owners." },
  { id: "ti12", t: "title", s: "POR1 p. 142", q: "The \"to have and to hold\" clause of a deed is the:", c: ["Habendum clause", "Granting clause", "Acceleration clause", "Reservation"], n: ["", "The granting clause holds the words of conveyance.", "That's a loan clause.", "A reservation keeps rights for the grantor."], w: "The habendum clause states the extent of the estate granted. It's rarely used today." },
  { id: "ti13", t: "title", s: "POR1 p. 137", tx: true, q: "A will written entirely in the testator's own handwriting, with no witnesses, is valid in Texas as a:", c: ["Holographic will", "Formal will", "Nuncupative will", "Codicil"], n: ["", "A formal will needs two witnesses.", "The course doesn't discuss oral wills here.", "A codicil amends a will."], w: "Texas accepts holographic wills written and signed in the testator's own hand." },
  { id: "ti14", t: "title", s: "POR1 p. 136", tx: true, q: "Texas has several adverse possession periods. Which is applied most often in successful cases?", c: ["10 years", "3 years", "5 years", "25 years"], n: ["", "Three years is the shortest Texas period, but it isn't the one most claims rely on.", "Five years is a Texas period too, but the 10-year period is applied most often.", "Twenty-five years is the longest Texas period. Most successful claims use 10 years."], w: "Texas has 3-, 5-, 10-, and 25-year periods. The 10-year period is applied most often." },
  { id: "ti15", t: "title", s: "POR1 p. 136", q: "Adverse possession requires occupation that is:", c: ["Hostile, actual, and continuous for the statutory period", "Permitted by the owner", "Occasional and secret", "Recorded with TREC"], n: ["", "Permission defeats a hostile claim.", "It must be continuous.", "TREC isn't involved."], w: "Title is acquired through hostile, actual, and continuous occupation for the statutory period." },
  { id: "ti16", t: "title", s: "POR1 p. 145", q: "A deed says nothing about mineral rights. Who owns the grantor's minerals after the sale?", c: ["The grantee", "The grantor", "The State of Texas", "The title company"], n: ["", "Without a reservation, the grantor keeps nothing.", "The state isn't involved.", "The title company never owns them."], w: "If a deed contains no mineral reservation, all minerals the grantor owned pass to the grantee." },

  /* finance */
  { id: "fi8", t: "finance", s: "FIN p. 27", q: "The Federal Reserve's most flexible and most often used monetary policy tool is:", c: ["Open market operations", "The discount rate", "Reserve requirements", "Setting mortgage rates directly"], n: ["", "This is a tool, but not the most used.", "This is a tool, but not the most used.", "The Fed doesn't set mortgage rates."], w: "Buying and selling government securities through open market operations is the Fed's most-used tool." },
  { id: "fi9", t: "finance", s: "FIN p. 28", q: "The discount rate is the rate:", c: ["Reserve Banks charge eligible institutions for short-term borrowing", "Lenders charge for one discount point", "Banks pay on savings accounts", "Charged on FHA loans"], n: ["", "A point is 1% of the loan.", "That's a deposit rate.", "It isn't FHA-specific."], w: "The discount rate is what a Reserve Bank charges eligible institutions to borrow short-term." },
  { id: "fi10", t: "finance", s: "FIN p. 114", q: "A loan originated to Fannie Mae and Freddie Mac standards is called a:", c: ["Conforming loan", "Portfolio loan", "Subprime loan", "Wraparound loan"], n: ["", "Portfolio loans are kept by the lender.", "Subprime loans are non-conforming.", "A wraparound is seller financing."], w: "Loans that meet Fannie Mae and Freddie Mac property, borrower, and form standards are conforming loans." },
  { id: "fi11", t: "finance", s: "FIN p. 37", q: "Which entity, part of HUD, pioneered the mortgage-backed security?", c: ["Ginnie Mae", "Fannie Mae", "Freddie Mac", "The FDIC"], n: ["", "Fannie Mae isn't part of HUD.", "Freddie Mac isn't part of HUD.", "The FDIC insures deposits."], w: "Ginnie Mae, a wholly owned federal corporation within HUD, pioneered the mortgage-backed security." },
  { id: "fi12", t: "finance", s: "FIN p. 168", q: "Private mortgage insurance (PMI) protects:", c: ["The lender against borrower default on a conventional loan", "The buyer against title defects", "The borrower if they lose their job", "FHA loans"], n: ["", "Title insurance does that.", "PMI protects the lender.", "FHA uses its own MIP."], w: "PMI indemnifies the lender against default on a conventional residential loan." },
  { id: "fi13", t: "finance", s: "FIN p. 142", q: "Which clause lets the lender declare the full balance due if the borrower sells the property?", c: ["Alienation (due-on-sale) clause", "Release clause", "Subordination clause", "Escalation clause"], n: ["", "A release clause frees part of the property.", "Subordination changes lien priority.", "Escalation raises the rate."], w: "The alienation clause prevents a loan assumption without the lender's consent." },
  { id: "fi14", t: "finance", s: "FIN p. 142, 166", q: "A builder's single loan covering several subdivision lots usually includes a:", c: ["Release clause", "Prepayment penalty", "Due-on-sale waiver", "Package clause"], n: ["", "That isn't the clause the course pairs with blanket loans.", "This isn't the typical clause.", "Package mortgages cover personal property."], w: "A blanket mortgage typically has a release clause, so lots are released as lump-sum payments are made." },
  { id: "fi15", t: "finance", s: "FIN p. 142", q: "A clause in which a mortgage holder allows a later mortgage to take priority is a:", c: ["Subordination clause", "Acceleration clause", "Alienation clause", "Defeasance clause"], n: ["", "Acceleration makes the loan due.", "Alienation concerns a sale.", "The course doesn't define this one here."], w: "Subordination is the act of yielding priority to a later loan." },
  { id: "fi16", t: "finance", s: "FIN p. 166", q: "A furnished resort condo is financed with one loan covering the real estate and the furniture. This is a:", c: ["Package mortgage", "Blanket mortgage", "Wraparound mortgage", "Budget mortgage"], n: ["", "A blanket covers several parcels.", "A wraparound is seller financing.", "A budget mortgage includes taxes and insurance."], w: "A package mortgage includes both real property and personal property." },
  { id: "fi17", t: "finance", s: "FIN p. 166", q: "Seller financing that keeps the low interest rate on the seller's existing loan, with the new loan in a junior position, is a:", c: ["Wraparound mortgage", "Package mortgage", "Blanket mortgage", "Reverse mortgage"], n: ["", "A package covers personal property.", "A blanket covers several parcels.", "A reverse mortgage pays the owner."], w: "A wraparound preserves the original low rate. The new loan takes a secondary lien position." },
  { id: "fi18", t: "finance", s: "FIN p. 264", q: "A borrower voluntarily deeds the property to the lender in exchange for release from the loan. This is a:", c: ["Deed in lieu of foreclosure", "Short sale", "Judicial foreclosure", "Loan assumption"], n: ["", "In a short sale, a third party buys the property.", "No court is involved.", "Nobody takes over the loan."], w: "A deed in lieu transfers the property to the lender in exchange for release from the mortgage obligations." },
  { id: "fi19", t: "finance", s: "FIN p. 57", q: "RESPA prohibits:", c: ["Kickbacks and undisclosed referral fees", "All referral relationships", "Seller-paid closing costs", "Escrow accounts"], n: ["", "It targets undisclosed referral fees and kickbacks.", "These are allowed.", "RESPA regulates escrow accounts; it doesn't ban them."], w: "RESPA prohibits abusive practices such as undisclosed referral fees and kickbacks." },
  { id: "fi20", t: "finance", s: "FIN p. 45", q: "An ad says \"only $1,000 down.\" Under Regulation Z, it must also state:", c: ["The down payment, the repayment terms, and the APR", "Only the sales price", "The lender's name only", "The buyer's credit score"], n: ["", "More is required.", "More is required.", "That's never required."], w: "A triggering term requires the down payment, the repayment terms, and the APR." },
  { id: "fi21", t: "finance", s: "FIN p. 42", q: "Refusing to make loans in an area because of its location is:", c: ["Redlining, prohibited by the Community Reinvestment Act", "Steering", "Blockbusting", "Allowed if the area is high-risk"], n: ["", "Steering is directing buyers to areas.", "Blockbusting is urging owners to sell.", "The CRA prohibits it."], w: "The CRA prohibits redlining, which is refusing financing in an area because of its location." },
  { id: "fi22", t: "finance", s: "FIN p. 73", q: "When unpaid interest is added to the loan, so the balance grows, it's called:", c: ["Negative amortization", "Acceleration", "Subordination", "A balloon"], n: ["", "Acceleration makes the loan due.", "Subordination is about priority.", "A balloon is a large final payment."], w: "Negative amortization means the principal balance may increase as accrued interest is added." },
  { id: "fi23", t: "finance", s: "FIN p. 12", q: "A loan the lender keeps instead of selling on the secondary market is a:", c: ["Portfolio loan", "Conforming loan", "Securitized loan", "Government loan"], n: ["", "Conforming loans are made to be sold.", "Securitized loans have been sold into pools.", "Government loans are FHA and VA."], w: "Loans not sold on the secondary market are portfolio loans." },
  { id: "fi24", t: "finance", s: "FIN p. 166", q: "In a budget mortgage, the tax and insurance part of each payment is held in a(n):", c: ["Escrow (impound) account", "Trust deed", "Option fee account", "Recovery fund"], n: ["", "A deed of trust is a security instrument.", "That's a contract term.", "That's a TREC fund."], w: "PITI payments put taxes and insurance into an escrow, also called impound, trust, or reserve, account." },
  { id: "fi25", t: "finance", s: "FIN p. 138", q: "A foreclosure sale brings less than the loan balance. The lender may sue for a:", c: ["Deficiency judgment", "Lis pendens", "Novation", "Release of lien"], n: ["", "A lis pendens is notice of a lawsuit.", "A novation is a substitute contract.", "A release follows payoff."], w: "If there's a shortage after the sale, the lender may sue the borrower for a deficiency judgment." },

  /* appraisal */
  { id: "ap7", t: "appraisal", s: "POR2 p. 15", q: "A buyer won't pay more for a home than the cost of an equally desirable substitute. This is the principle of:", c: ["Substitution", "Contribution", "Conformity", "Anticipation"], n: ["", "Contribution is about what a feature adds to value.", "Conformity is about similar neighboring homes.", "Anticipation is about future benefits."], w: "Under substitution, value is influenced by the cost of acquiring a comparable substitute." },
  { id: "ap8", t: "appraisal", s: "POR2 p. 13", q: "Value is maximized when homes in an area are reasonably similar. This is the principle of:", c: ["Conformity", "Regression", "Substitution", "Change"], n: ["", "Regression describes an over-improved home.", "Substitution is about comparable choices.", "Change describes constant market forces."], w: "Conformity holds that a reasonable degree of sameness maximizes value." },
  { id: "ap9", t: "appraisal", s: "POR2 p. 14", q: "A large new custom home in an older, modest neighborhood will likely be valued lower because of:", c: ["Regression", "Progression", "Contribution", "Anticipation"], n: ["", "Progression helps a lesser home among better ones.", "Contribution is about what a feature adds to value.", "Anticipation is about future benefits."], w: "Regression: an over-improved property is penalized when its neighbors are of lesser quality." },
  { id: "ap10", t: "appraisal", s: "POR2 p. 14", q: "A seller spent $40,000 on a pool, but the market says it adds only $15,000. This illustrates:", c: ["Contribution: cost does not equal value", "Substitution", "Conformity", "Highest and best use"], n: ["", "Substitution is about comparable choices.", "Conformity is about similar neighboring homes.", "This isn't about the best use of the site."], w: "Contribution says a feature's value is what it adds to the whole, not what it cost." },
  { id: "ap11", t: "appraisal", s: "POR2 p. 10", q: "Prices rise in an area because a new hospital is planned nearby. This reflects the principle of:", c: ["Anticipation", "Regression", "Contribution", "Conformity"], n: ["", "Regression describes an over-improved home.", "Contribution is about one feature.", "Conformity is about similar homes."], w: "Anticipation: the expectation of future benefits affects today's purchase price." },
  { id: "ap12", t: "appraisal", s: "POR2 p. 23", q: "Comparable rentals sold for an average of $210,000 and rent for $1,500 a month. The subject will rent for $1,600 a month. Using the GRM, what is the subject's value?", c: ["$224,000", "$210,000", "$192,000", "$240,000"], n: ["", "That's the comparables' average, not the subject.", "Check the GRM: 210,000 ÷ 1,500 = 140.", "Recheck the multiplication."], w: "GRM = $210,000 ÷ $1,500 = 140. Value = 140 × $1,600 = $224,000." },
  { id: "ap13", t: "appraisal", s: "POR2 p. 23", q: "An office building nets $60,000 a year. Investors expect a 7.5% return. What is its value using the IRV formula?", c: ["$800,000", "$450,000", "$4,500", "$600,000"], n: ["", "Divide by the rate; don't multiply.", "Divide by the rate; don't multiply.", "Recheck the division."], w: "V = I ÷ R = $60,000 ÷ 0.075 = $800,000." },
