  { id: "ap14", t: "appraisal", s: "POR2 p. 26", tx: true, q: "Texas real estate appraisers are licensed by:", c: ["The Texas Appraiser Licensing and Certification Board (TALCB)", "TREC's sales agent division", "The county appraisal district", "HUD"], n: ["", "TREC licenses brokers and sales agents.", "Appraisal districts value property for taxes.", "HUD doesn't license appraisers."], w: "Texas appraisers are licensed through TALCB, after FIRREA gave appraiser regulation to the states." },
  { id: "ap15", t: "appraisal", s: "POR2 p. 19", q: "In the sales comparison approach, the appraiser gathers at least:", c: ["Three comparable sales", "One comparable sale", "Ten comparable sales", "Three active listings only"], n: ["", "One isn't enough.", "Some lenders require four or more, but the stated minimum is lower.", "Comparables are recently sold properties."], w: "The appraiser gathers at least three comparable sales, and some lenders require four or more." },
  { id: "ap16", t: "appraisal", s: "POR2 p. 26", q: "FIRREA, passed in 1989, affected appraisers by:", c: ["Giving regulation of appraisers to the individual states", "Abolishing appraisal licensing", "Requiring all appraisals to use the cost approach", "Creating TREC"], n: ["", "It led to state licensing.", "No such requirement exists.", "TREC was established in 1949."], w: "FIRREA, enacted after the savings and loan crisis, gave appraiser regulation to the states." },

  /* leases */
  { id: "le7", t: "leases", s: "POR2 p. 198", tx: true, q: "Under Texas law, a landlord returning a security deposit must:", c: ["Mail it, with any accounting, postmarked within 30 days after the lease ends", "Make sure the tenant receives it within 10 days", "Return it at move-out inspection", "Hold it for 60 days"], n: ["", "The rule is about the postmark, not receipt.", "Nothing requires a refund at the move-out inspection. The landlord has 30 days, measured by the postmark.", "Sixty days is too long. The refund and accounting must be postmarked within 30 days."], w: "The letter must be postmarked by the end of the 30-day period. It doesn't have to be received within 30 days." },
  { id: "le8", t: "leases", s: "POR2 p. 198", tx: true, q: "Texas law requires a residential landlord to install at least one smoke alarm:", c: ["In each separate bedroom", "Only in the kitchen", "Only if the tenant asks", "Only in multi-level units"], n: ["", "Bedrooms are required.", "It's required regardless.", "Each level also needs one, but bedrooms always do."], w: "A landlord must install at least one smoke alarm in each separate bedroom, plus one on each level." },
  { id: "le9", t: "leases", s: "POR2 p. 198", tx: true, q: "Under Texas rules, fire extinguishers in a rental unit:", c: ["Aren't required, but if provided the landlord must inspect and repair them", "Are required in every room", "Are the tenant's responsibility", "Are required only in apartments"], n: ["", "Texas doesn't require fire extinguishers at all. The rule only applies if the landlord provides them.", "The landlord is responsible if they're provided.", "There's no apartment-only requirement. Extinguishers are optional; if provided, the landlord maintains them."], w: "Fire extinguishers aren't required. If provided, the landlord is responsible for inspecting and repairing them." },
  { id: "le10", t: "leases", s: "POR2 p. 227", q: "A property manager with broad authority over an owner's building is usually the owner's:", c: ["General agent", "Special agent", "Subagent", "Customer"], n: ["", "A special agent handles one specific task.", "A subagent works through another broker.", "A customer isn't represented."], w: "A property manager is either an employee or a general agent of the owner, with broad responsibility." },
  { id: "le11", t: "leases", s: "POR2 p. 227", q: "A property manager's employment contract is the:", c: ["Management agreement", "Listing agreement", "Lease", "Bill of sale"], n: ["", "A listing is for selling property.", "A lease is with tenants.", "A bill of sale transfers personal property."], w: "The role of a property manager is established by a written management agreement." },
  { id: "le12", t: "leases", s: "POR2 p. 227", q: "In most cases, a property manager's primary duty is to:", c: ["Maximize income while preserving the property's value", "Minimize vacancies at any cost", "Sell the property", "Lower rents"], n: ["", "Value must be preserved too.", "That isn't the manager's role.", "That isn't the goal."], w: "The primary duty is to maximize income while preserving the value of the asset." },
  { id: "le13", t: "leases", s: "POR2 p. 196", q: "A tenant pays rent plus property taxes, insurance, and repairs. This is a:", c: ["Net lease", "Gross lease", "Percentage lease", "Graduated lease"], n: ["", "In a gross lease, the landlord pays expenses.", "A percentage lease is tied to sales.", "A graduated lease steps up over time."], w: "In a net lease, the tenant pays rent plus expenses such as taxes, insurance, and repairs." },
  { id: "le14", t: "leases", s: "POR2 p. 196", q: "Which leasehold ends at the death of either party or the sale of the property?", c: ["Tenancy at will", "Estate for years", "Periodic tenancy", "None of them"], n: ["", "An estate for years survives death and sale.", "A periodic tenancy survives death and sale.", "One of them does."], w: "Unlike the others, a tenancy at will ends at the death of either party or the sale of the property." },
  { id: "le15", t: "leases", s: "POR2 p. 196", q: "A lease with rent that increases on a schedule, often used to attract tenants in hard times, is a:", c: ["Graduated lease", "Net lease", "Percentage lease", "Gross lease"], n: ["", "A net lease shifts expenses to the tenant.", "A percentage lease is tied to sales.", "A gross lease has flat rent."], w: "In a graduated lease, rent gradually increases as the lease matures." },
  { id: "le16", t: "leases", s: "POR2 p. 196", q: "What is the most common type of residential lease?", c: ["Gross lease", "Net lease", "Percentage lease", "Ground lease"], n: ["", "Net leases are common in commercial property.", "Percentage leases are for retail.", "The course doesn't call ground leases common for residential."], w: "In a gross lease, the landlord pays the ownership expenses. It is the most common residential lease." },

  /* fair housing */
  { id: "fh7", t: "fairhousing", s: "POR2 p. 248", q: "A tenant with a disability needs grab bars installed. Under fair housing law:", c: ["The landlord must allow reasonable modifications at the tenant's expense", "The landlord must pay for all modifications", "The landlord may refuse any changes", "Only owner-occupied buildings must allow them"], n: ["", "The tenant pays for the modification.", "Refusing isn't allowed.", "This isn't limited to owner-occupied buildings."], w: "A landlord may not refuse reasonable modifications at the tenant's expense, and may require restoration when reasonable." },
  { id: "fh8", t: "fairhousing", s: "POR2 p. 250", q: "Housing for older persons may qualify for an exemption if at least one person aged 55 or older lives in at least what share of occupied units?", c: ["80%", "50%", "100%", "62%"], n: ["", "This is too low.", "That's the 62-and-older test.", "62 is an age, not a percentage."], w: "The 55-and-older test requires at least one person aged 55+ in at least 80% of occupied units, plus a policy showing that intent." },
  { id: "fh9", t: "fairhousing", s: "POR2 p. 250", q: "A complaint to HUD must be filed within:", c: ["One year after the alleged discrimination", "30 days", "Two years", "Five years"], n: ["", "This is too short.", "That's the deadline for a private lawsuit.", "This is too long."], w: "A HUD complaint must be filed within one year after the last discriminatory act." },
  { id: "fh10", t: "fairhousing", s: "POR2 p. 250", q: "A private fair housing lawsuit must be filed in court within:", c: ["Two years of the alleged act", "One year", "180 days", "Ten years"], n: ["", "That's the HUD deadline.", "180 days isn't a fair housing deadline in the course. HUD complaints: one year. Private lawsuits: two years.", "Ten years is far too long. A private lawsuit must be filed within two years."], w: "A private enforcement action must be brought within two years of the alleged act." },
  { id: "fh11", t: "fairhousing", s: "POR2 p. 251", tx: true, q: "The Texas Fair Housing Act, passed in 1989:", c: ["Recognizes the same protected classes as federal law", "Adds age as a protected class", "Applies only to rentals", "Replaced the federal law in Texas"], n: ["", "The course says the classes are the same.", "It covers sales and rentals.", "Federal law still applies."], w: "Texas passed its Fair Housing Act in 1989. It closely parallels federal law with the same protected classes." },
  { id: "fh12", t: "fairhousing", s: "POR2 p. 250", tx: true, q: "In Texas, a fair housing complaint can be filed with the Texas Workforce Commission Civil Rights Division within:", c: ["365 days of the alleged harm", "90 days", "Two years", "30 days"], n: ["", "Ninety days is too short. The TWC Civil Rights Division accepts complaints for 365 days.", "Two years is for a court action.", "Thirty days is too short. The TWC deadline is 365 days."], w: "A complaint can be filed with the TWC Civil Rights Division within 365 calendar days." },
  { id: "fh13", t: "fairhousing", s: "POR2 p. 250", q: "What penalties apply to fair housing violations, according to the course?", c: ["Civil remedies only, with no criminal penalties", "Mandatory jail time", "Criminal fines only", "License revocation only"], n: ["", "Violations are civil offenses.", "There are no criminal penalties.", "Remedies include actual and punitive damages."], w: "A violation is a civil offense, so there are no criminal penalties. Remedies include actual and punitive damages." },
  { id: "fh14", t: "fairhousing", s: "POR2 p. 245", q: "Which protected classes were added to the federal Fair Housing Act in 1988?", c: ["Handicap and familial status", "Sex and religion", "Race and color", "Age and marital status"], n: ["", "Sex was added in 1974, and religion was in the 1968 Act.", "These were in the 1968 Act.", "Neither is protected under this law."], w: "Sex was added in 1974. Handicap and familial status were added in 1988." },
  { id: "fh15", t: "fairhousing", s: "POR2 p. 245", q: "Which case confirmed that the Civil Rights Act of 1866 bars racial discrimination with no exceptions?", c: ["Jones v. Alfred H. Mayer Co.", "Kelo v. City of New London", "Brown v. Board of Education", "Shelley v. Kraemer"], n: ["", "Kelo is an eminent domain case.", "That's a school case, not the one the course cites.", "That isn't the case the course cites."], w: "In 1968, Jones v. Alfred H. Mayer Co. held that the 1866 law prohibits racial discrimination without exception." },

  /* math */
  { id: "ma7", t: "math", s: "POR2 p. 283", q: "A home sells for $320,000. The commission is 6%, the loan payoff is $180,000, and other seller costs are $4,800. What are the seller's net proceeds?", c: ["$116,000", "$135,200", "$120,800", "$140,000"], n: ["", "That leaves out the commission.", "That leaves out the other costs.", "That leaves out the commission and costs."], w: "$320,000 − $19,200 (6%) − $180,000 − $4,800 = $116,000." },
  { id: "ma8", t: "math", s: "POR2 p. 283", q: "A $300,000 sale pays 6%, split equally between two brokerages. The listing agent gets 70% of her broker's share. How much does she earn?", c: ["$6,300", "$12,600", "$9,000", "$4,500"], n: ["", "That's 70% of the full commission.", "That's the whole broker side before her split.", "Recheck the 70%."], w: "$300,000 × 6% = $18,000. Half is $9,000, and 70% of that is $6,300." },
  { id: "ma9", t: "math", s: "POR2 p. 286", q: "A home bought for $200,000 sells for $230,000. What is the percentage of appreciation?", c: ["15%", "13%", "30%", "1.5%"], n: ["", "That divides by the sale price.", "Check the decimal.", "Check the decimal."], w: "Gain ÷ original price: $30,000 ÷ $200,000 = 15%." },
  { id: "ma10", t: "math", s: "POR2 p. 283", q: "A 2,300-square-foot home sells for $276,000. What is the price per square foot?", c: ["$120", "$83", "$12", "$1,200"], n: ["", "This divides the wrong way.", "Check the decimal.", "Check the decimal."], w: "$276,000 ÷ 2,300 = $120 per square foot." },
  { id: "ma11", t: "math", s: "POR2 p. 283", q: "A $150,000 loan carries 6% annual interest. How much interest is in the first monthly payment?", c: ["$750", "$9,000", "$900", "$75"], n: ["", "That's a full year of interest.", "Recheck the math: $9,000 ÷ 12.", "Check the decimal."], w: "Yearly interest = $150,000 × 0.06 = $9,000. Divided by 12, that's $750 for the first month." },
  { id: "ma12", t: "math", s: "FIN p. 168", q: "A buyer gets a 90% LTV loan on a $250,000 home (price and appraisal match). What is the down payment?", c: ["$25,000", "$225,000", "$22,500", "$2,500"], n: ["", "That's the loan amount.", "That's 9%.", "That's 1%."], w: "100% − 90% = 10% down, and $250,000 × 10% = $25,000." },
  { id: "ma13", t: "math", s: "POR2 p. 283", q: "A triangular lot has a 200-foot base and a 150-foot height. What is its area?", c: ["15,000 square feet", "30,000 square feet", "350 square feet", "7,500 square feet"], n: ["", "You forgot to take half.", "That adds the sides instead of multiplying.", "You took half twice."], w: "½ × 200 × 150 = 15,000 square feet." },
  { id: "ma14", t: "math", s: "POR1 p. 49", q: "A tract contains 87,120 square feet. How many acres is it?", c: ["2 acres", "1 acre", "20 acres", "0.5 acres"], n: ["", "One acre is 43,560 square feet.", "Check the decimal.", "Recheck the division."], w: "87,120 ÷ 43,560 = 2 acres." },
  { id: "ma15", t: "math", s: "POR1 p. 30", q: "A property is assessed at $180,000, and the tax rate is 20 mills. What is the annual tax?", c: ["$3,600", "$36,000", "$360", "$900"], n: ["", "A mill is per $1,000, not per $100.", "Check the decimal.", "This isn't the right calculation."], w: "20 mills means $20 per $1,000 of value. $180,000 ÷ 1,000 × $20 = $3,600." },
  { id: "ma16", t: "math", s: "POR2 p. 286", q: "A seller wants to net $190,000 after paying a 5% commission (ignore other costs). What sales price is needed?", c: ["$200,000", "$199,500", "$180,500", "$195,000"], n: ["", "That adds 5% of $190,000 instead of dividing.", "That subtracts the commission.", "That isn't the right calculation."], w: "The net is 95% of the price, so $190,000 ÷ 0.95 = $200,000." },
  { id: "ma17", t: "math", s: "POR2 p. 283", q: "An investor pays $600,000 for a property that nets $42,000 a year. What is the cap rate?", c: ["7%", "14%", "0.7%", "70%"], n: ["", "Recheck the division.", "Check the decimal.", "Check the decimal."], w: "Rate = income ÷ value = $42,000 ÷ $600,000 = 7%." },

  /* trela */
  { id: "tr8", t: "trela", s: "POR2 p. 178", q: "The maximum TREC administrative penalty is:", c: ["$5,000 for each violation, and each day can count separately", "$1,000 per year", "$50,000 per license", "There is no maximum"], n: ["", "This isn't the statutory amount.", "This isn't the statutory amount.", "The statute sets a limit."], w: "§1101.702 caps the penalty at $5,000 per violation, and each day a violation continues may be a separate violation." },
  { id: "tr9", t: "trela", s: "POR2 p. 183", q: "Willfully violating TRELA or a commission order is a:", c: ["Class A misdemeanor", "Felony", "Civil infraction only", "Class C misdemeanor"], n: ["", "This isn't the classification in §1101.756.", "It's a criminal offense.", "It's a more serious class than that."], w: "§1101.756 makes a willful violation a Class A misdemeanor." },
  { id: "tr10", t: "trela", s: "POR2 p. 170", q: "A broker deposits a client's earnest money into her personal checking account. This is:", c: ["Commingling, a ground for discipline", "Allowed if repaid within 30 days", "Allowed for small amounts", "Required by TREC"], n: ["", "There's no grace period.", "The amount doesn't matter.", "TREC prohibits it."], w: "§1101.652 lists commingling another person's money with the license holder's own as a ground for discipline." },
  { id: "tr11", t: "trela", s: "POR2 p. 113", q: "Someone who, for compensation, locates apartment units for prospective tenants is a:", c: ["Residential rental locator", "Property manager", "Easement or right-of-way agent", "Inspector"], n: ["", "A property manager manages for an owner.", "That agent deals in easements.", "Inspectors examine property."], w: "TRELA defines a residential rental locator as someone who, for consideration, locates apartment units for tenants. It doesn't include an owner locating units in their own complex." },
  { id: "tr12", t: "trela", s: "POR2 p. 113", q: "A person who buys or sells easements for a pipeline company for compensation must hold:", c: ["A certificate of registration as an easement or right-of-way agent", "A broker license", "An inspector license", "Nothing"], n: ["", "TRELA creates a separate certificate for this.", "This isn't the credential.", "Registration is required."], w: "Easement or right-of-way agents are certificate holders registered under Subchapter K." },
  { id: "tr13", t: "trela", s: "POR2 p. 150", q: "A Texas broker applicant needs:", c: ["900 education hours and 4 years of active sales agent experience in the last 5", "180 hours and 1 year of experience", "270 hours and no experience", "A college degree"], n: ["", "That's the sales agent education level.", "270 hours is part of the 900.", "No degree is required."], w: "The broker requirement is 900 hours, 270 of them in qualifying real estate courses, plus 4 years active in the 5 years before applying." },
  { id: "tr14", t: "trela", s: "POR2 p. 151", q: "After filing a license application, the applicant must pass the exam within:", c: ["One year", "Six months", "Two years", "90 days"], n: ["", "Six months is too short. Applicants have one year from filing to pass.", "Two years is too long. The exam must be passed within one year of filing.", "Ninety days is too short. The deadline is one year after the application is filed."], w: "§1101.355(f) requires the exam to be passed within one year after the application is filed." },
  { id: "tr15", t: "trela", s: "POR2 p. 120", q: "Under TRELA, TREC is subject to:", c: ["The Texas Sunset Act", "The federal Administrative Procedure Act only", "Oversight by the State Bar", "Approval by HUD"], n: ["", "TRELA names the Sunset Act.", "The State Bar doesn't oversee TREC.", "HUD has no role here."], w: "TREC is subject to the Texas Sunset Act and is abolished unless continued." },
  { id: "tr16", t: "trela", s: "POR2 p. 168", q: "A Texas broker may share a commission with:", c: ["A broker licensed in another state who doesn't negotiate in Texas", "An unlicensed friend who referred the buyer", "The buyer's attorney as a referral fee", "Any person the seller approves"], n: ["", "An unlicensed person can't be paid for brokerage.", "This isn't permitted under §1101.651.", "Approval doesn't make it legal."], w: "A broker may pay only license holders or out-of-state brokers who don't negotiate in Texas." },
  { id: "tr17", t: "trela", s: "POR2 p. 173", q: "If a license holder who isn't an attorney engages in the unauthorized practice of law, TREC:", c: ["Shall suspend or revoke the license", "May only issue a warning", "Has no authority", "Must refer it to HUD"], n: ["", "The statute requires discipline.", "§1101.654 gives TREC the authority.", "HUD isn't involved."], w: "§1101.654 directs TREC to suspend or revoke the license for the unauthorized practice of law." },

  /* agency */
  { id: "ag8", t: "agency", s: "AG p. 41", q: "Which is NOT one of the four agency relationships TRELA allows?", c: ["Dual agency", "Subagency", "Intermediary", "Buyer agency"], n: ["", "Subagency is allowed.", "Intermediary is allowed.", "Buyer agency is allowed."], w: "TRELA allows seller agency, buyer agency, subagency, and intermediary. Representing both sides is handled as intermediary." },
  { id: "ag9", t: "agency", s: "AG p. 41", q: "A buyer calls a listing agent about a home but signs nothing. In Texas, the buyer is:", c: ["A customer, because Texas has no implied agency", "Automatically a client", "Represented by the listing broker", "Represented by any agent who answers"], n: ["", "An agency must be established; it isn't assumed.", "The listing broker represents the seller.", "Answering a call doesn't create agency."], w: "In Texas there is no assumed or implied agency. By default, people are customers." },
  { id: "ag10", t: "agency", s: "AG p. 17", q: "A license holder who represents the seller through a cooperative agreement with the listing broker, but isn't associated with that broker, is a:", c: ["Subagent", "Intermediary", "Buyer's agent", "Customer"], n: ["", "An intermediary represents both sides in-house.", "A buyer's agent represents the buyer.", "A customer isn't a license holder role."], w: "A subagent represents the seller through a cooperative agreement, often through MLS membership." },
  { id: "ag11", t: "agency", s: "AG p. 88", q: "Under which listing is the broker paid no matter who finds the buyer, even the seller?", c: ["Exclusive right to sell", "Exclusive agency", "Open listing", "Net listing"], n: ["", "In an exclusive agency, the seller can sell without paying.", "In an open listing, only the broker who finds the buyer is paid.", "A net listing is about how pay is calculated."], w: "An exclusive right to sell gives the broker compensation regardless of who procures the buyer." },
  { id: "ag12", t: "agency", s: "AG p. 84", q: "One broker lists the home, but the seller can sell it personally without owing a fee. This is a(n):", c: ["Exclusive agency listing", "Exclusive right to sell", "Open listing", "Net listing"], n: ["", "In an exclusive right to sell, the broker is paid regardless.", "An open listing allows multiple brokers.", "A net listing is about pay."], w: "In an exclusive agency, only one broker lists the home, but the seller keeps the right to sell without paying compensation." },
  { id: "ag13", t: "agency", s: "AG p. 84", q: "Which listing type most often leads to procuring cause lawsuits between brokers?", c: ["Open listing", "Exclusive right to sell", "Exclusive agency", "Buyer representation"], n: ["", "It avoids such disputes because only one broker can sell.", "There's only one broker.", "That's a buyer agreement."], w: "With several brokers competing, open listings often produce disputes over who was the procuring cause." },
  { id: "ag14", t: "agency", s: "AG p. 85", q: "Under TREC rules, a broker should take a net listing only when:", c: ["The principal insists and appears familiar with current market values", "The broker is sure of a high profit", "The property is commercial", "Never. Net listings are illegal in Texas"], n: ["", "That puts the broker's interest first.", "Property type isn't the test.", "They're legal in Texas but discouraged."], w: "Net listings are legal in Texas, but TREC says to take one only when the principal insists and knows market values." },
  { id: "ag15", t: "agency", s: "AG p. 57", q: "In a sales agent's advertisement, the broker's name must appear:", c: ["At least half the size of the largest agent or team contact information", "In the same font as the agent's name", "Only on yard signs", "Only if the broker asks"], n: ["", "Size, not font, is the rule.", "It applies to all advertisements.", "It's required."], w: "TREC Rule 535.155 requires the broker's name in at least half the size of the largest contact information." },
  { id: "ag16", t: "agency", s: "AG p. 58", q: "Which team name would violate TREC advertising rules?", c: ["\"The Garcia Group Company\"", "\"The Garcia Team\"", "\"Garcia Home Group\"", "\"Team Garcia\""], n: ["", "\"Team\" is allowed. The problem words are ones like company, brokerage, or associates.", "\"Group\" on its own is fine. Adding \"Company\" is what breaks the rule.", "\"Team\" is allowed. It doesn't suggest a separate brokerage."], w: "Team names can't use terms like \"company,\" \"brokerage,\" or \"associates\" that imply independence from the sponsoring broker." },
  { id: "ag17", t: "agency", s: "AG p. 66", q: "Where must a license holder display the IABS and the Consumer Protection Notice (CN 1-5)?", c: ["On their business website, not necessarily in every social post", "In every social media post", "Only in the office", "Only on yard signs"], n: ["", "Links aren't required in every post.", "The website requirement applies.", "Yard signs don't carry these notices. They belong on the business website."], w: "Completed versions of both notices must be on the business website. They don't have to be in each social media ad." },
  { id: "ag18", t: "agency", s: "AG p. 176", q: "Which task may an unlicensed assistant NOT perform?", c: ["Showing a broker's listing to prospective buyers", "Filing paperwork", "Scheduling the agent's calendar", "Ordering yard signs"], n: ["", "Filing paperwork is administrative work an unlicensed assistant may do.", "Managing a calendar is administrative and doesn't need a license.", "Ordering signs is administrative. Showing listings is what needs a license."], w: "TREC Rule 535.4(c) requires a license to show a broker's listings. Soliciting must also be done by license holders." },
  { id: "ag19", t: "agency", s: "AG p. 20", q: "Who owns a listing taken by a sales agent?", c: ["The sponsoring broker", "The sales agent", "The seller's attorney", "The MLS"], n: ["", "The agent acts for the broker.", "The attorney isn't a party.", "The MLS shares listing data; it doesn't own listings."], w: "Paperwork is in the broker's name, and the broker owns all of the firm's listings." },

  /* forms */
  { id: "fo8", t: "forms", s: "PCF p. 38", q: "Under the Third Party Financing Addendum, financing is approved when:", c: ["Both Buyer Approval and Property Approval are obtained", "The buyer submits an application", "The appraisal is ordered", "The seller signs the addendum"], n: ["", "Applying isn't approval.", "Ordering isn't approval.", "The seller's signature isn't the test."], w: "Approval is deemed obtained when both Buyer Approval (credit) and Property Approval are obtained." },
  { id: "fo9", t: "forms", s: "PCF p. 38", q: "In the Third Party Financing Addendum's approval paragraph, deadlines are:", c: ["Strict, because time is of the essence", "Flexible, within a reasonable time", "Set by the lender", "Not stated"], n: ["", "This paragraph says otherwise.", "The addendum sets the days.", "They're stated."], w: "The addendum states that time is of the essence for this paragraph and strict compliance is required." },
  { id: "fo10", t: "forms", s: "CON p. 34", q: "Paragraph 7B(2) is checked and the seller delivers the Seller's Disclosure later. The buyer may terminate:", c: ["Within 7 days after receiving the notice", "Only during the option period", "Never, once the contract is signed", "Within 30 days after closing"], n: ["", "This right is separate from the option.", "7B(2) gives this right.", "It must happen before closing."], w: "If the seller delivers the notice, the buyer may terminate within 7 days of receipt and get the earnest money back." },
  { id: "fo11", t: "forms", s: "PCF p. 24", q: "A buyer will move in two weeks before closing. Which TREC form fits?", c: ["Buyer's Temporary Residential Lease", "Seller's Temporary Residential Lease", "A Texas REALTORS® residential lease", "No form is needed"], n: ["", "That's for the seller staying after closing.", "TREC has a specific form for this.", "A written lease is wise."], w: "The Buyer's Temporary Residential Lease is for buyer occupancy of no more than 90 days before closing." },
  { id: "fo12", t: "forms", s: "PCF p. 24", q: "For which transaction does TREC NOT provide a promulgated sales contract?", c: ["Sale of a cooperative unit", "Resale of a condominium", "Unimproved land", "Farm and ranch"], n: ["", "There's a TREC condo contract.", "There's an Unimproved Property Contract.", "There's a Farm and Ranch Contract."], w: "TREC has no promulgated forms for co-ops, commercial transactions, or mobile homes." },
  { id: "fo13", t: "forms", s: "CON p. 16", q: "A buyer asks his agent to write an escalation clause into the offer. Under TREC Rule 537.11, the agent:", c: ["May not draft it and should refer him to an attorney", "May write it in Special Provisions", "May write it if the seller agrees", "Must use an amendment form"], n: ["", "Drafting it is the unauthorized practice of law.", "Agreement doesn't change who may draft it.", "No TREC form covers this."], w: "License holders may not draft language affecting rights, including escalation, appraisal, or other contingency clauses." },
  { id: "fo14", t: "forms", s: "CON p. 16", q: "When completing a TREC form, a license holder may add:", c: ["Factual statements and business details", "Any terms the client requests", "Legal language from past contracts", "Clauses from internet templates"], n: ["", "Legal terms require an attorney.", "That risks the unauthorized practice of law.", "That risks the unauthorized practice of law."], w: "Filling in blanks isn't practicing law. Add only factual statements and business details, or strike text as directed in writing." },
  { id: "fo15", t: "forms", s: "CON p. 16", q: "A transaction involves unusual matters that a lawyer should review. The license holder should:", c: ["Advise the principals to consult a lawyer of their choice", "Explain the legal effect themselves", "Hire a lawyer for the client and pay the fee", "Proceed without comment"], n: ["", "That's legal advice.", "The rule bars paying a lawyer to represent a principal in their own transaction.", "Silence doesn't meet the duty."], w: "When unusual matters arise, the license holder advises each principal to consult a lawyer of their choice." },
  { id: "fo16", t: "forms", s: "CON p. 16", q: "Under TREC rules, a license holder may NOT:", c: ["Discourage a principal from hiring a lawyer", "Explain the choices on a TREC form", "Fill in blanks on a TREC form", "Strike text as the parties direct in writing"], n: ["", "Explaining the choices is allowed.", "Filling in blanks is allowed.", "Striking text as directed is allowed."], w: "Rule 537.11 prohibits attempting to prevent or discourage a principal from employing a lawyer." },
  { id: "fo17", t: "forms", s: "PCF p. 14", q: "After the inspection, the seller agrees to make repairs. The parties should:", c: ["Sign an amendment to the contract", "Write the repairs into the original Paragraph 11", "Rely on a verbal agreement", "Start a new contract"], n: ["", "Changes after signing call for an amendment.", "Oral changes aren't binding.", "That isn't necessary."], w: "When a seller agrees to repairs or a financial adjustment, an amendment to the contract is needed." },
  { id: "fo18", t: "forms", s: "PCF p. 210", q: "Which TREC form lets the buyer check one of several reasons for terminating?", c: ["Notice of Buyer's Termination of Contract", "Third Party Financing Addendum", "Amendment to Contract", "Seller's Disclosure Notice"], n: ["", "That covers financing terms.", "That changes terms.", "That's a disclosure."], w: "The Notice of Buyer's Termination of Contract is a multipurpose form listing specific reasons to terminate." },
  { id: "fo19", t: "forms", s: "PCF p. 59", q: "Federal law requires the lead-based paint addendum for a residential dwelling built:", c: ["Before 1978", "Before 1990", "After 1978", "In any year"], n: ["", "1990 is too late. The cutoff is homes built before 1978.", "It's the reverse.", "Only older homes."], w: "The seller's lead-based paint disclosure is required by federal law for housing built before 1978." },

  /* txproperty */
  { id: "tp8", t: "txproperty", s: "POR1 p. 34", q: "An urban homestead in Texas is limited to:", c: ["10 contiguous acres", "1 acre", "100 acres", "200 acres"], n: ["", "This is too small.", "That's the rural limit for an individual.", "That's the rural limit for a family."], w: "An urban homestead is limited to 10 acres of land, which must be contiguous, plus improvements." },
  { id: "tp9", t: "txproperty", s: "POR1 p. 34", q: "A married couple's rural homestead can include up to:", c: ["200 acres, which may be non-contiguous", "100 acres, which must be contiguous", "10 acres", "Unlimited acres"], n: ["", "100 acres is the limit for an individual.", "That's the urban limit.", "There's an acreage cap."], w: "A rural homestead can be up to 200 acres for a family (100 for an individual), and the tracts may be non-contiguous." },

const CALC = {
"fi2": {
"w": "One discount point equals 1% of the loan amount.",
"f": [
"1 point = 1% of the loan",
"$200,000 × 0.01 = $2,000"
]
},
"fi6": {
"w": "LTV uses the lower of the price or the appraised value.",
"f": [
"Lower value = $100,000",
"$100,000 × 90% = $90,000"
]
},
"ap5": {
"w": "Subtract depreciation from the replacement cost, then add the land.",
"f": [
"$240,000 × 25% = $60,000 depreciation",
"$240,000 − $60,000 = $180,000 building",
"$180,000 + $40,000 land = $220,000"
]
},
"ma1": {
"w": "Commission is the rate times the sales price.",
"f": [
"Commission = rate × price",
"0.06 × $285,000 = $17,100"
]
},
"ma2": {
"w": "With a rate per $100, count the hundreds, then multiply by the rate.",
"f": [
"$240,000 ÷ 100 = 2,400",
"2,400 × $2.25 = $5,400"
]
},
"ma3": {
"w": "Rearrange the cap rate formula to solve for value.",
"f": [
"Net income = cap rate × value",
"Value = net income ÷ cap rate",
"$36,000 ÷ 0.08 = $450,000"
]
},
"ma4": {
"w": "Multiply the length by the width.",
"f": [
"Area = length × width",
"120 × 80 = 9,600 sq ft"
]
},
"ma5": {
"w": "Points are based on the loan amount, not the price.",
"f": [
"Loan = 0.80 × $250,000 = $200,000",
"2 points = 0.02 × $200,000 = $4,000"
]
},
"lg7": {
"w": "Multiply the number of acres by 43,560.",
"f": [
"1 acre = 43,560 sq ft",
"3 × 43,560 = 130,680 sq ft"
]
},
"ap12": {
"w": "Find the GRM from the comparables, then apply it to the subject's rent.",
"f": [
"GRM = price ÷ monthly rent",
"$210,000 ÷ $1,500 = 140",
"Value = 140 × $1,600 = $224,000"
]
},
"ap13": {
"w": "Use the IRV formula: value equals income divided by rate.",
"f": [
"V = I ÷ R",
"$60,000 ÷ 0.075 = $800,000"
]
},
"ma7": {
"w": "Subtract the commission, the loan payoff, and other costs from the price.",
"f": [
"Commission = $320,000 × 6% = $19,200",
"$320,000 − $19,200 − $180,000 − $4,800 = $116,000"
]
},
"ma8": {
"w": "Find the total commission, split it between the brokerages, then take her 70%.",
"f": [
"$300,000 × 6% = $18,000",
"$18,000 ÷ 2 = $9,000",
"$9,000 × 70% = $6,300"
]
},
"ma9": {
"w": "Divide the gain by the original price.",
"f": [
"Gain = $230,000 − $200,000 = $30,000",
"$30,000 ÷ $200,000 = 15%"
]
},
"ma10": {
"w": "Divide the price by the square footage.",
"f": [
"$276,000 ÷ 2,300 = $120 per sq ft"
]
},
"ma11": {
"w": "Find one year of interest, then divide by 12.",
"f": [
"$150,000 × 0.06 = $9,000 per year",
"$9,000 ÷ 12 = $750"
]
},
"ma12": {
"w": "The down payment is the part the loan doesn't cover.",
"f": [
"100% − 90% = 10% down",
"$250,000 × 10% = $25,000"
]
},
"ma13": {
"w": "The area of a triangle is half the base times the height.",
"f": [
"Area = ½ × base × height",
"½ × 200 × 150 = 15,000 sq ft"
]
},
"ma14": {
"w": "Divide the square feet by 43,560.",
"f": [
"87,120 ÷ 43,560 = 2 acres"
]
},
"ma15": {
"w": "A mill is $1 per $1,000 of value, so 20 mills is $20 per $1,000.",
"f": [
"$180,000 ÷ 1,000 = 180",
"180 × $20 = $3,600"
]
},
"ma16": {
"w": "After a 5% commission, the seller keeps 95% of the price.",
"f": [

"$190,000 ÷ 0.95 = $200,000"
]
},
"ma17": {

function answer(k){

  logActivity({ at:res.at, type: ss.topic ? "topic" : "mixed", label: ss.topic ? TOPIC[ss.topic].title : "Mixed or review round", t: ss.topic || null, score: right + " / " + ss.ids.length });

document.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft" && (PEEK !== null ? PEEK : ss.i) > 0 && !(e.target.closest && e.target.closest("input, [role=progressbar]"))){ e.preventDefault(); peekTo((PEEK !== null ? PEEK : ss.i) - 1); return; }
  if (PEEK !== null){ if (e.key === "ArrowRight" || e.key === "Escape"){ e.preventDefault(); peekTo(e.key === "Escape" ? null : PEEK + 1); } return; }
  const q = QBY[ss.ids[ss.i]], done = ss.answers[q.id] !== undefined;
  const key = e.key.toUpperCase();
  let pos = KEYS.indexOf(key); if (pos === -1 && /^[1-5]$/.test(key)) pos = +key - 1;

function renderResults(){

  const rows = Object.entries(byT).map(([id, b]) => ({ id, ...b, pct: Math.round(b.right / b.total * 100) })).sort((a, b) => a.pct - b.pct);
  const strong = rows.filter(x => x.pct >= 80), weak = rows.filter(x => x.pct < 80);
  const missed = qs.filter(q => r.answers[q.id] !== 0);
  const msg = pct >= 90 ? "Excellent work. Keep this material fresh with a mixed round in a few days."
    : pct >= 70 ? "Solid progress. A quick look at the missed questions will lock these in."
    : "Every missed question shows you exactly what to review next. Read the lessons below, then retry.";
  view.innerHTML = `<div class="stack-lg">

/* ---------- practice exam ---------- */
const EXAM_FORMATS = {
  full:     { label:"Full practice exam", sections:[["National", 85, 150], ["State", 50, 90]] },
  short:    { label:"Short practice exam", sections:[["National", 25, 45], ["State", 15, 27]] },
  national: { label:"National section only", sections:[["National", 85, 150]] },
  state:    { label:"State section only", sections:[["State", 50, 90]] }
};
const PASS_PCT = 70;
const isState = q => TOPIC[q.t].group === "tx" || q.tx;
function samplePool(pool, n){
  const byT = {}; pool.forEach(q => (byT[q.t] = byT[q.t] || []).push(q));
  const tids = Object.keys(byT); tids.forEach(t => byT[t] = shuffle(byT[t]));
  const quota = {}; let used = 0;
  const rem = tids.map(t => { const exact = n * byT[t].length / pool.length; quota[t] = Math.min(byT[t].length, Math.floor(exact)); used += quota[t]; return [t, exact - Math.floor(exact)]; }).sort((a, b) => b[1] - a[1]);
  for (let i = 0; used < n && i < rem.length * 3; i++){ const t = rem[i % rem.length][0]; if (quota[t] < byT[t].length){ quota[t]++; used++; } }
  return shuffle(tids.flatMap(t => byT[t].slice(0, quota[t])));
}
function startExam(fmtKey, timed){
  const fmt = EXAM_FORMATS[fmtKey];
  S.exam = { fmt:fmtKey, timed, cur:0, i:0, review:false, between:false, started:Date.now(),
    sections: fmt.sections.map(([name, n, mins]) => {
      const pool = QUESTIONS.filter(q => name === "State" ? isState(q) : !isState(q));
      const qs = samplePool(pool, Math.min(n, pool.length));
      return { name, ids:qs.map(q => q.id), order:qs.map(q => shuffle(q.c.map((_, k) => k))), answers:{}, flags:{}, limit:mins * 60, elapsed:0, submitted:false, timeUp:false };
    }) };
  save(); go("exam-run");
}

function startExamTimer(){
  stopExamTimer();
  const ex = S.exam, sec = ex.sections[ex.cur];
  if (!ex.timed || sec.timeUp) return;
  let last = Date.now(), tick = 0;
  examTimerId = setInterval(() => {
    const now = Date.now(); sec.elapsed += (now - last) / 1000; last = now;
    if (++tick % 10 === 0) save();
    const el = $("#etimer"); if (!el){ stopExamTimer(); save(); return; }
    const left = sec.limit - sec.elapsed;
    if (left <= 0){ sec.timeUp = true; save(); stopExamTimer(); setTimerText(el, 0, true); toast("Time's up. On test day this section would end now. Review and submit when ready."); ex.review = true; save(); renderExamRun(); }
    else setTimerText(el, left, false);
  }, 500);
}

/* ---------- glossary: tap-to-define ---------- */
const GBY = Object.fromEntries(GLOSSARY.map(g => [g.id, g]));
const TERM_MAP = {};
GLOSSARY.filter(g => !g.nolink).forEach(g => [g.term].concat(g.alt).forEach(w => { TERM_MAP[w.toLowerCase()] = g.id; }));
const TERM_RE = new RegExp("\\b(" + Object.keys(TERM_MAP).sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "i");
function linkTerms(containers, maxPer){
  maxPer = maxPer || 3;
  containers.forEach(box => {
    let used = 0; const seen = new Set();
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest("button, a, .src, mark, .formula, .calc, .kfig") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes){
      if (used >= maxPer) break;
      let text = node.nodeValue, m, cur = node;
      while (used < maxPer && (m = TERM_RE.exec(text))){
        const id = TERM_MAP[m[1].toLowerCase()];
        if (seen.has(id)){ // skip repeats: continue scanning after this match
          const rest = cur.splitText(m.index + m[1].length); cur = rest; text = rest.nodeValue; continue;
        }
        seen.add(id); used++;
        const mid = cur.splitText(m.index); const after = mid.splitText(m[1].length);
        const b = document.createElement("button"); b.type = "button"; b.className = "term"; b.dataset.term = id;
        b.setAttribute("aria-label", m[1] + ", show definition"); b.textContent = mid.nodeValue;
        mid.replaceWith(b); cur = after; text = after.nodeValue;
      }
    }
  });
}

/* ---------- search ---------- */
const strip = h => h.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&");
const SEARCH_INDEX = [];
GLOSSARY.forEach(g => SEARCH_INDEX.push({ kind:"term", g, hay:(g.term + " " + g.alt.join(" ")).toLowerCase(), body:g.def.toLowerCase() }));
TOPICS.forEach(t => t.lessons.forEach((l, i) => SEARCH_INDEX.push({ kind:"lesson", t, i, l, text:strip(l.b.join(" ")), hay:l.h.toLowerCase(), body:strip(l.b.join(" ")).toLowerCase() })));
let SEARCH_Q = "";
function hl(text, q){ const i = text.toLowerCase().indexOf(q); if (i < 0) return esc(text); return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length)); }
function snippet(text, q){ const i = text.toLowerCase().indexOf(q); if (i < 0) return text.slice(0, 120) + (text.length > 120 ? "…" : ""); const a = Math.max(0, i - 50); return (a ? "…" : "") + text.slice(a, i + q.length + 80) + (i + q.length + 80 < text.length ? "…" : ""); }
function runSearch(q){
  q = q.trim().toLowerCase();
  if (q.length < 2) return null;
  const terms = [], lessons = [];
  SEARCH_INDEX.forEach(x => {
    const inHead = x.hay.includes(q), inBody = x.body.includes(q);
    if (!inHead && !inBody) return;
    (x.kind === "term" ? terms : lessons).push({ x, score: (inHead ? 2 : 0) + (x.hay.startsWith(q) ? 1 : 0) });
  });
  terms.sort((a, b) => b.score - a.score); lessons.sort((a, b) => b.score - a.score);
  return { q, terms: terms.slice(0, 6).map(r => r.x), lessons: lessons.slice(0, 12).map(r => r.x), totalT: terms.length, totalL: lessons.length };
}
function searchResultsHTML(r){
  if (!r) return "";
  if (!r.terms.length && !r.lessons.length) return `<div class="card empty">No matches for "${esc(r.q)}". Try a shorter word, like "lease" or "deed".</div>`;
  return `<p class="small muted" role="status">${r.totalT + r.totalL} result${r.totalT + r.totalL === 1 ? "" : "s"} for "${esc(r.q)}"</p>
  ${r.terms.length ? `<section class="stack" style="gap:8px"><p class="eyebrow">Key terms</p>${r.terms.map(x => `<button type="button" class="sresult" data-term="${x.g.id}">${ticon(x.g.t, "sm")}<span class="grow"><b>${hl(x.g.term, r.q)}</b><span class="small muted">${hl(x.g.def, r.q)}</span></span></button>`).join("")}</section>` : ""}
  ${r.lessons.length ? `<section class="stack" style="gap:8px"><p class="eyebrow">Lessons</p>${r.lessons.map(x => `<button type="button" class="sresult" data-open-lesson="${x.t.id}:${x.i}">${ticon(x.t.id, "sm")}<span class="grow"><b>${hl(x.l.h, r.q)}</b><span class="small muted">${esc(x.t.title)} · ${hl(snippet(x.text, r.q), r.q)}</span></span></button>`).join("")}</section>` : ""}`;
}

function seeded(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function dailyChallenge(){
  const d = new Date(), key = todayKey(), seed = d.getFullYear() * 1000 + Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  const rnd = seeded(seed), isTest = seed % 2 === 0;
  const done = (S.daily || {})[key];
  if (isTest){
    const t = TOPICS[Math.floor(rnd() * TOPICS.length)];
    const pool = topicQs(t.id).slice(); for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return { key, kind:"test", t, ids: pool.slice(0, 5).map(q => q.id), title:`5-question test: ${t.title}`, sub:"About 4 minutes · untimed", done };
  }
  const unread = []; TOPICS.forEach(t => t.lessons.forEach((l, i) => { if (!S.read[t.id + ":" + i]) unread.push([t, i]); }));
  const all = []; TOPICS.forEach(t => t.lessons.forEach((l, i) => all.push([t, i])));
  const list = unread.length ? unread : all; const [t, i] = list[Math.floor(rnd() * list.length)];
  return { key, kind:"lesson", t, i, title:`Lesson: ${t.lessons[i].h}`, sub:`${t.title} · about 2 minutes`, done };
}

/* =====================================================================
   1. SPACED REVIEW
   A missed question comes back after 1 day, then 3, then 7.
   Answering it right each time it is due moves it up a step;
   after the third step it is mastered and leaves the list.
   A wrong answer at any point sends it back to step 1.
   ===================================================================== */
const SRS_GAP = [1, 3, 7];
const dnum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / 864e5);
function srsInit(){
  S.srs = S.srs || {};
  if (!S.srsSeeded){
    QUESTIONS.forEach(q => { const st = S.stats[q.id]; if (st && !st.last && !S.srs[q.id]) S.srs[q.id] = { box:0, due:dnum() }; });
    S.srsSeeded = true; save(true);
  }
}
function srsRecord(id, ok){
  S.srs = S.srs || {};
  const it = S.srs[id], today = dnum();
  if (!ok){ S.srs[id] = { box:0, due:today + SRS_GAP[0] }; return; }
  if (!it || it.due > today) return;            // only a due review moves it up
  const box = it.box + 1;
  if (box >= SRS_GAP.length){ delete S.srs[id]; S.srsDone = (S.srsDone || 0) + 1; }
  else S.srs[id] = { box, due:today + SRS_GAP[box] };
}
function srsDue(){ const t = dnum(); return Object.keys(S.srs || {}).filter(id => QBY[id] && S.srs[id].due <= t); }
function srsNext(){
  const t = dnum(); let best = null, n = 0;
  Object.values(S.srs || {}).forEach(x => { if (x.due > t){ if (best === null || x.due < best){ best = x.due; n = 1; } else if (x.due === best) n++; } });
  return best === null ? null : { days:best - t, n };
}
function srsDueText(){ const d = srsDue().length; return d ? `${d} due today` : ""; }
function dayWord(n){ return n === 1 ? "tomorrow" : `in ${n} days`; }
function srsCardHTML(){
  const due = srsDue(), nx = srsNext(), all = Object.values(S.srs || {});
  const steps = SRS_GAP.map((g, i) => all.filter(x => x.box === i).length);
  return `<section class="card stack srs-card" style="gap:14px" aria-labelledby="srsT">
    <div class="row" style="gap:12px;align-items:center">${iconTile("refresh", 1, "sm")}<div class="grow" style="min-width:0"><h2 id="srsT">Due today</h2><p class="small muted">${due.length ? `${due.length} question${due.length > 1 ? "s" : ""} ready for review` : nx ? `Nothing due. Next review ${dayWord(nx.days)} (${nx.n} question${nx.n > 1 ? "s" : ""}).` : "Nothing to review yet. Missed questions will be scheduled here."}</p></div></div>
    ${due.length ? `<button class="btn btn-primary btn-block" id="srsGo">Start review${due.length > 20 ? " (20 at a time)" : ""}</button>` : ""}
    <ol class="srs-steps" aria-label="Review steps">${SRS_GAP.map((g, i) => `<li><span class="srs-n">${steps[i]}</span><span class="srs-l"><b>Step ${i + 1}</b><small>back after ${g} day${g > 1 ? "s" : ""}</small></span></li>`).join("")}<li class="srs-done"><span class="srs-n">${S.srsDone || 0}</span><span class="srs-l"><b>Mastered</b><small>3 right in a row</small></span></li></ol>
    <p class="small muted">Missed questions come back after 1 day, then 3, then 7. Get one right each time it's due and it's mastered. A miss sends it back to step 1.</p>
  </section>`;
}

/* =====================================================================
   2. BACKUP & SYNC
   Progress lives in this browser. When the page runs inside Claude and
   the viewer is signed in, it is also saved to their private storage
   on the artifact (only they can read it), so phone and laptop agree.
   ===================================================================== */
/* ---------------------------------------------------------------------
   SYNC SETTINGS — paste the two values from Supabase
   (Project Settings → API). Both are safe to publish: the database
   rules only let each signed-in person read and write their own row.
   Leave them empty and the app simply saves on this device only.
   --------------------------------------------------------------------- */
const SUPABASE_URL = "";   // e.g. "https://abcdefgh.supabase.co"
const SUPABASE_KEY = "";   // the "anon" or "publishable" key
const SB_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js";

const SYNC = { mode:null, state:"local", ref:null, at:null, writing:false, dirty:false, timer:null, pending:null, sb:null, uid:null, email:"", first:false, msg:"" };
function syncLabel(){
  if (SYNC.state === "on") return { on:true, txt: SYNC.at ? `Synced ${ago(SYNC.at)}` : "Sync is on" };
  if (SYNC.state === "connecting") return { on:false, txt:"Connecting…" };
  if (SYNC.state === "signedout" || SYNC.state === "codesent") return { on:false, txt:"Saved on this device only. Sign in to sync." };
  if (SYNC.state === "readonly") return { on:false, txt:"Saved on this device only. Ask for edit access to sync." };
  if (SYNC.state === "error") return { on:false, txt:"Can't reach sync right now. Progress is still saved on this device." };

}
function ago(t){ const s = Math.round((Date.now() - t) / 1000); return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : new Date(t).toLocaleDateString(); }
function syncStatusRefresh(){ const el = document.getElementById("syncStatus"); if (!el) return; const l = syncLabel(); el.className = "sync-st " + (l.on ? "on" : ""); el.lastChild.textContent = l.txt; }
function syncPayload(){ return { v:1, savedAt:S.savedAt || Date.now(), state:JSON.stringify(S) }; }
function syncSoon(){ if (!SYNC.ref) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncPush, 2500); }
async function syncPush(){

  if (SYNC.writing){ SYNC.dirty = true; return; }
  const p = syncPayload(); if (p.state.length > 900000) return;
  SYNC.writing = true;
  try { await SYNC.ref.set(p); SYNC.at = Date.now(); SYNC.state = "on"; }
  catch(e){ if (e && e.code === "invalid_argument"){ SYNC.state = "readonly"; SYNC.ref = null; } else if (e && e.code === "unavailable"){ SYNC.dirty = true; } else SYNC.state = "error"; }
  SYNC.writing = false; syncStatusRefresh();
  if (SYNC.dirty && SYNC.ref){ SYNC.dirty = false; setTimeout(syncPush, 4000 + Math.random() * 2000); }
}
function isEmptyState(st){ return !Object.keys(st.stats || {}).length && !Object.keys(st.read || {}).length && !(st.log || []).length && !(st.examHistory || []).length && !(st.drill && st.drill.seen); }
const BUSY_ROUTES = ["quiz", "exam-run", "drill"];
function adoptRemote(remote, msg){
  const prefs = S.prefs;
  S = Object.assign(fresh(), remote); S.prefs = prefs;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  render(); toast(msg || "Progress updated from your other device");
}
/* combine two devices' progress the first time a device signs in */
function mergeStates(a, b){
  const m = Object.assign(fresh(), b, a), byAt = (x, y, key) => { const seen = new Set(), out = []; (x || []).concat(y || []).forEach(e => { const k = e.at + "|" + (e[key] || ""); if (!seen.has(k)){ seen.add(k); out.push(e); } }); return out.sort((p, q) => p.at - q.at); };
  m.stats = Object.assign({}, b.stats); const from = {};
  Object.keys(b.stats || {}).forEach(k => from[k] = "b");
  Object.entries(a.stats || {}).forEach(([k, v]) => { if (!m.stats[k] || (v.seen || 0) >= (m.stats[k].seen || 0)){ m.stats[k] = v; from[k] = "a"; } });
  ["read", "bookmarks", "reviewTopics", "daily"].forEach(f => m[f] = Object.assign({}, b[f], a[f]));
  m.days = Object.assign({}, b.days); Object.entries(a.days || {}).forEach(([k, v]) => m.days[k] = Math.max(v, m.days[k] || 0));
  m.log = byAt(a.log, b.log, "label").slice(-500);
  m.examHistory = byAt(a.examHistory, b.examHistory, "fmt");
  m.srs = {}; Object.keys(from).forEach(k => { const src = from[k] === "a" ? a.srs : b.srs; if (src && src[k]) m.srs[k] = src[k]; });
  m.srsDone = Math.max(a.srsDone || 0, b.srsDone || 0); m.srsSeeded = !!(a.srsSeeded || b.srsSeeded);

async function syncPull(){
  if (!SYNC.ref) return;

    const snap = await SYNC.ref.get();
    SYNC.state = "on";
    const first = SYNC.first; SYNC.first = false;
    if (snap.exists){
      const d = snap.data(); let remote = null; try { remote = JSON.parse(d.state); } catch(e) {}
      const rAt = (remote && remote.savedAt) || 0, lAt = S.savedAt || 0;
      if (first && remote && !isEmptyState(remote) && !isEmptyState(S) && Math.abs(rAt - lAt) > 1000){

      } else if (remote && isEmptyState(S) && !isEmptyState(remote)){
        if (BUSY_ROUTES.includes(route().name)) SYNC.pending = remote; else adoptRemote(remote, "Your progress is here");
      } else if (remote && rAt > lAt + 1000){
        if (BUSY_ROUTES.includes(route().name)) SYNC.pending = remote; else adoptRemote(remote);
      } else if (lAt > rAt + 1000 && !isEmptyState(S)) syncPush();
      SYNC.at = Date.now();
    } else if (!isEmptyState(S)) syncPush();

function syncAfterRender(name){ if (SYNC.pending && !BUSY_ROUTES.includes(name)){ const r = SYNC.pending; SYNC.pending = null; setTimeout(() => adoptRemote(r), 0); } }
document.addEventListener("visibilitychange", () => { if (!SYNC.ref) return; if (document.visibilityState === "visible") syncPull(); else if (SYNC.timer){ clearTimeout(SYNC.timer); syncPush(); } });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e) {}

/* --- Supabase (the published website) --- */
const sbErr = e => ({ code: e && /fetch|network|timeout|load failed/i.test(String(e.message || e)) ? "unavailable" : "error", message: e && e.message });
function sbRef(uid){ return {
  async get(){ const { data, error } = await SYNC.sb.from("progress").select("state,saved_at").eq("user_id", uid).maybeSingle(); if (error) throw sbErr(error); return { exists:!!data, data:() => ({ state:JSON.stringify(data.state), savedAt:data.saved_at }) }; },
  async set(p){ const { error } = await SYNC.sb.from("progress").upsert({ user_id:uid, state:JSON.parse(p.state), saved_at:p.savedAt, updated_at:new Date().toISOString() }); if (error) throw sbErr(error); }
}; }
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.async = true; s.onload = ok; s.onerror = no; document.head.appendChild(s); setTimeout(no, 15000); }); }
function sbSession(session){

  else if (!u && SYNC.uid !== null || (!u && SYNC.state === "connecting")){ SYNC.uid = null; SYNC.ref = null; if (SYNC.state !== "codesent") SYNC.state = "signedout"; refreshSyncBox(); }
}
async function sbInit(){

/* backup file */
function backupData(){ return JSON.stringify({ app:"aurely-trec-study", v:1, exportedAt:new Date().toISOString(), state:S }, null, 1); }
async function downloadBackup(){
  const name = "aurely-study-backup-" + new Date().toISOString().slice(0, 10) + ".json", data = backupData();
  try {
    const dl = window.claude && window.claude.use ? await claude.use("downloads") : null;
    if (dl){ await dl.save({ filename:name, data }); toast("Backup saved"); return; }
  } catch(e){ if (e && e.code === "declined") return; }
  try {
    const url = URL.createObjectURL(new Blob([data], { type:"application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Backup downloaded");
  } catch(e){ toast("Couldn't create the backup file here"); }
}
function readBackup(file, done){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o || o.app !== "aurely-trec-study" || !o.state || typeof o.state.stats !== "object") throw 0;
      done(o);
    } catch(e){ done(null); }
  };
  fr.onerror = () => done(null);
  fr.readAsText(file);
}
function backupCardHTML(){
  return `<section class="card stack" style="gap:14px" aria-labelledby="bkT">
    <div class="row" style="gap:12px;align-items:center">${iconTile("cloud", 3, "sm")}<h3 id="bkT" class="grow">Sync & backup</h3></div>
    <div class="stack" style="gap:10px" id="syncBox">${syncBoxHTML()}</div>

    <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn btn-quiet btn-sm" id="bkDown">${IC.download}<span>Download backup</span></button><button class="btn btn-quiet btn-sm" id="bkUp">${IC.upload}<span>Restore from backup</span></button><input type="file" id="bkFile" accept=".json,application/json" hidden></div>
    <div id="bkArea" aria-live="polite"></div>
  </section>`;
}
function wireBackup(){
  wireSyncBox();
  const f = $("#bkFile");
  $("#bkDown").onclick = downloadBackup;
  $("#bkUp").onclick = () => f.click();
  f.onchange = () => {
    const file = f.files && f.files[0]; if (!file) return;
    readBackup(file, o => {
      const area = $("#bkArea"); f.value = "";
      if (!o){ area.innerHTML = `<p class="small" style="color:var(--bad);font-weight:600">That file isn't a backup from this app.</p>`; return; }
      const st = o.state, answers = Object.values(st.stats || {}).reduce((a, x) => a + (x.seen || 0), 0), lessons = Object.keys(st.read || {}).length;
      const when = o.exportedAt ? new Date(o.exportedAt).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : "an earlier date";
      area.innerHTML = `<div class="bk-confirm"><p class="small"><b>Backup from ${esc(when)}</b>: ${answers} answers, ${lessons} lessons read. Restoring replaces the progress on this device.</p><div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn btn-primary btn-sm" id="bkYes">Restore this backup</button><button class="btn btn-quiet btn-sm" id="bkNo">Cancel</button></div></div>`;
      $("#bkYes").focus();
      $("#bkNo").onclick = () => { area.innerHTML = ""; };
      $("#bkYes").onclick = () => { const prefs = S.prefs; S = Object.assign(fresh(), st); S.prefs = prefs; save(); toast("Backup restored"); renderPrefs(); };
    });
  };
}

   3. MATH DRILLS

const ri = (a, b, step = 1) => a + Math.floor(Math.random() * (Math.floor((b - a) / step) + 1)) * step;
const pk = a => a[Math.floor(Math.random() * a.length)];
const r2 = n => Math.round(n * 100) / 100;
const money = n => "$" + r2(n).toLocaleString("en-US", { minimumFractionDigits: Math.abs(r2(n) % 1) > 0 ? 2 : 0, maximumFractionDigits:2 });
const num = n => r2(n).toLocaleString("en-US", { maximumFractionDigits:2 });
const pc = n => num(n) + "%";
const an = n => /^(8|11|18)/.test(String(n)) ? "an" : "a";
const sqft = n => num(n) + " square feet";

      d:[[a / 10, "Check the decimal: move the % two places."], [a / 2, "That's half. No split was mentioned."], [price * (rate + 1) / 100, "Recheck the rate."]],
      steps:[`${money(price)} × ${pc(rate)} = ${money(a)}`], w:"Commission = rate × price." }; } },
  { cat:"comm", src:"POR2 p. 283", make(){

      d:[[tot * sh / 100, `That's ${pc(sh)} of the full commission, before the brokerage split.`], [side, "That's the whole brokerage side before her split."], [side * (100 - sh) / 100, "That's the broker's part, not hers."]],
      steps:[`${money(price)} × ${pc(rate)} = ${money(tot)}`, `${money(tot)} ÷ 2 = ${money(side)}`, `${money(side)} × ${pc(sh)} = ${money(a)}`], w:"Find the total commission, split it between the brokerages, then take her share." }; } },
  { cat:"comm", src:"POR2 p. 283", make(){
    const price = ri(220000, 480000, 5000), rate = pk([5, 6, 7]), pay = ri(90000, 200000, 5000), cost = ri(2000, 9000, 100), c = price * rate / 100, a = price - c - pay - cost;
    return { q:`A home sells for ${money(price)}. The commission is ${pc(rate)}, the loan payoff is ${money(pay)}, and other seller costs are ${money(cost)}. What are the seller's net proceeds?`, a, f:money,

const DR = { cats:new Set(Object.keys(DRILL_CATS)), cur:null, ans:null, n:0, right:0, streak:0 };
function newDrill(){
  const pool = DRILLS.filter(d => DR.cats.has(d.cat));
  const g = pk(pool.length ? pool : DRILLS), p = g.make();
  const seen = new Set([p.f(p.a)]), opts = [{ v:p.a, ok:true }];
  p.d.forEach(([v, why]) => { let x = r2(v); if (!(x > 0)) x = r2(p.a * 1.25); let t = p.f(x), k = 1; while (seen.has(t) && k < 6){ x = r2(p.a * (1 + 0.15 * k)); t = p.f(x); k++; } if (!seen.has(t)){ seen.add(t); opts.push({ v:x, why }); } });
  DR.cur = Object.assign(p, { src:g.src, cat:g.cat, opts:shuffle(opts) }); DR.ans = null;
}
function startDrills(){ DR.n = 0; DR.right = 0; DR.streak = 0; DR.cur = null; go("drill"); }
function finishDrills(){
  if (DR.n){ logActivity({ at:Date.now(), type:"topic", label:"Math drills", t:"math", score:`${DR.right} / ${DR.n}` }); S.drill = S.drill || { seen:0, correct:0 }; save(); toast(`Math drills: ${DR.right} of ${DR.n} correct`); }
  DR.cur = null; go("topic-math");
}
